<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#0e0e1a;color:#e0e0e0;min-height:100vh;-webkit-tap-highlight-color:transparent}
.container{max-width:480px;margin:0 auto;padding:16px}
#session-bar{position:fixed;top:0;left:0;right:0;height:3px;background:#1a1a2e;z-index:100}
#session-bar-fill{height:100%;background:#2dd4bf;width:0;transition:width 0.3s}
.header{display:flex;justify-content:space-between;align-items:center;margin:12px 0 16px;font-size:13px;color:#888}

.header button:hover{border-color:#2dd4bf;color:#2dd4bf}

.wo-prefix{font-size:16px;color:#888;margin-bottom:12px;font-style:italic;display:block}
.wo-slots{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:10px;background:#16162a;border:2px dashed #2a2a3a;border-radius:10px;margin-bottom:12px}
.wo-slots.correct{border-color:#4ade80;background:rgba(74,222,128,0.05)}
.wo-slots.wrong{border-color:#f87171;background:rgba(248,113,113,0.05)}
.wo-chip{padding:8px 14px;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;transition:all 0.15s;user-select:none;-webkit-user-select:none}
.wo-chip.available{background:#1e1e2e;border:1px solid #2a2a3a;color:#e0e0e0}
.wo-chip.available:hover{border-color:#555}
.wo-chip.placed{background:#2dd4bf15;border:1px solid #2dd4bf;color:#2dd4bf}
.wo-chip.placed:hover{opacity:0.7}
.wo-check-btn{margin-top:10px;padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;color:#fff;background:#2dd4bf;cursor:pointer;width:100%}
.wo-check-btn:disabled{background:#2a2a2a;color:#555;cursor:default}
.wo-check-btn:not(:disabled):hover{background:#26b5a3}
.feedback-box{background:#1a1a2e;border-radius:10px;padding:14px;margin-top:12px;display:none}
.fb-sentence{font-size:15px;font-weight:600;margin-bottom:4px}
.fb-sentence.correct-fb{color:#4ade80}
.fb-sentence.wrong-fb{color:#f87171}
.fb-english{font-size:13px;color:#aaa;font-style:italic;margin-bottom:6px}
.fb-rule{font-size:12px;color:#888;background:#0e0e1a;padding:8px;border-radius:6px;border-left:3px solid #2dd4bf}
.next-btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;color:#fff;background:#2dd4bf;cursor:pointer;margin-top:12px;display:none}
.next-btn:hover{background:#26b5a3}
.hint-rule{font-size:12px;color:#666;margin-top:4px;margin-bottom:8px;font-style:italic}
#finish-container{display:none;text-align:center;padding:20px 0}
#finish-container h2{color:#2dd4bf;margin-bottom:16px;font-size:22px}
.finish-stat{font-size:18px;margin-bottom:20px;color:#ccc}
.finish-stat strong{color:#2dd4bf}
#finish-container h3{color:#aaa;font-size:14px;margin-bottom:12px;text-align:left}
.word-stat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.word-label{width:50px;font-size:13px;font-weight:600;color:#ccc;text-align:right}

(function(){

  var entry=streaks[SK]||{date:'',streak:0};
  if(entry.date!==today){
    var yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
    entry.streak=(entry.date===yesterday)?entry.streak+1:1;
    entry.date=today;
  }
  streaks[SK]=entry;
  localStorage.setItem('gd_streaks',JSON.stringify(streaks));
})();

{prefix:"Ich finde, dass",chunks:["du","wohl","recht","hast"],correct:"du wohl recht hast",en:"I think you're right, I suppose.",rule:"wohl (hedging) — softens the claim",word:"wohl",role:"hedging"}

// === State ===
var deck=[],cur=0,cc=0,wc=0,locked=false,woPlaced=[];
var catStats={};
var STORE_KEY='germanDrill_chameleon_v1';
var WORDS=['nach','noch','schon','doch','mal','erst','ja','denn','wohl'];
var sessionTotal=0,sessionAnswered=0;

// === Utilities ===
function shuffle(a){
  var i,j,t;
  for(i=a.length-1;i>0;i--){
    j=Math.floor(Math.random()*(i+1));
    t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

// === Stats ===
function loadStats(){
  try{var s=localStorage.getItem(STORE_KEY);if(s)catStats=JSON.parse(s)}
  catch(e){catStats={}}
}

function saveStats(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(catStats))}catch(e){}
}

function recordStat(card,correct){
  var k=card.word+'_'+card.role;
  if(!catStats[k])catStats[k]={c:0,w:0};
  if(correct)catStats[k].c++;else catStats[k].w++;
  saveStats();
}

function hintLevel(card){
  var k=card.word+'_'+card.role;
  var s=catStats[k];
  if(!s)return 0;
  var total=s.c+s.w;
  if(total<5)return 0;
  var acc=s.c/total;
  if(acc>=0.85&&total>=10)return 2;
  if(acc>=0.70)return 1;
  return 0;
}

function getWeakness(card){
  var k=card.word+'_'+card.role;
  var s=catStats[k];
  if(!s)return 0.5;
  var total=s.c+s.w;
  if(total<3)return 0.5;
  return s.w/total;
}

function prioritizeWeak(cards){
  return cards.sort(function(a,b){
    var wa=getWeakness(a),wb=getWeakness(b);
    if(wa!==wb)return wb-wa;
    return Math.random()-0.5;
  });
}

// === Rendering ===
function render(){
  if(cur>=deck.length){showFinish();return}
  locked=false;woPlaced=[];
  var card=deck[cur];
  var hl=hintLevel(card);

  document.getElementById('case-label').textContent=card.word+' \u2014 '+card.role;
  document.getElementById('case-label').style.color='#2dd4bf';
  document.getElementById('prompt').textContent='Arrange the words in correct order:';
  document.getElementById('wo-prefix').textContent=card.prefix;
  document.getElementById('feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';

  renderWordOrder(card,hl);
  updateStats();
  updateSessionBar();
}

function renderWordOrder(card,hl){
  var optEl=document.getElementById('options');
  optEl.innerHTML='';

  if(hl<2&&card.rule){
    var hintDiv=document.createElement('div');
    hintDiv.className='hint-rule';
    if(hl===0)hintDiv.textContent=card.rule;
    else hintDiv.textContent=card.word+' = '+card.role;
    optEl.appendChild(hintDiv);
  }

  var slotsDiv=document.createElement('div');
  slotsDiv.className='wo-slots';
  slotsDiv.id='wo-slots';
  optEl.appendChild(slotsDiv);

  var shuffled=shuffle(card.chunks.slice());
  var chipArea=document.createElement('div');
  chipArea.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:8px';
  chipArea.id='wo-chips';

  for(var i=0;i<shuffled.length;i++){
    var chip=document.createElement('div');
    chip.className='wo-chip available';
    chip.textContent=shuffled[i];
    chip.setAttribute('data-word',shuffled[i]);
    chip.onclick=(function(c){return function(){woToggle(c)}})(chip);
    chipArea.appendChild(chip);
  }
  optEl.appendChild(chipArea);

  var btn=document.createElement('button');
  btn.className='wo-check-btn';
  btn.id='wo-check';
  btn.textContent='Check order';
  btn.disabled=true;
  btn.onclick=function(){woCheck(card)};
  optEl.appendChild(btn);
}

function woToggle(chip){
  if(locked)return;
  var slots=document.getElementById('wo-slots');

  if(chip.className.indexOf('placed')>=0){
    chip.className='wo-chip available';
    var w=chip.getAttribute('data-word');
    var idx=woPlaced.indexOf(w);
    if(idx>=0)woPlaced.splice(idx,1);
    document.getElementById('wo-chips').appendChild(chip);
  }else{
    chip.className='wo-chip placed';
    woPlaced.push(chip.getAttribute('data-word'));
    slots.appendChild(chip);
  }

  var btn=document.getElementById('wo-check');
  if(btn)btn.disabled=(woPlaced.length!==deck[cur].chunks.length);
}

// === Checking ===
function woCheck(card){
  if(locked)return;
  locked=true;sessionAnswered++;
  var userAnswer=woPlaced.join(' ');
  var isCorrect=(userAnswer===card.correct);
  var slots=document.getElementById('wo-slots');

  if(isCorrect){
    slots.className='wo-slots correct';
    cc++;
  }else{
    slots.className='wo-slots wrong';
    wc++;
    var corrDiv=document.createElement('div');
    corrDiv.style.cssText='margin-top:8px;color:#f87171;font-size:13px';
    corrDiv.innerHTML='Correct: <strong>'+card.prefix+' '+card.correct+'.</strong>';
    document.getElementById('options').appendChild(corrDiv);
    if(cur+3<deck.length){
      var retry={};for(var k in card)retry[k]=card[k];
      retry.isRetry=true;
      deck.splice(cur+3+Math.floor(Math.random()*5),0,retry);
      sessionTotal++;
    }
  }

  recordStat(card,isCorrect);
  document.getElementById('wo-check').style.display='none';
  document.getElementById('wo-chips').style.display='none';
  showFeedback(card,isCorrect);
  updateStats();
  updateSessionBar();
}

function showFeedback(card,isCorrect){
  var fb=document.getElementById('feedback');
  var html='';
  html+='<div class="fb-sentence '+(isCorrect?'correct-fb':'wrong-fb')+'">';
  html+=(isCorrect?'\u2713':'\u2717')+' '+card.prefix+' '+card.correct+'.';
  html+='</div>';
  html+='<div class="fb-english">'+card.en+'</div>';
  if(card.rule)html+='<div class="fb-rule">'+card.rule+'</div>';
  fb.innerHTML=html;
  fb.style.display='block';
  document.getElementById('next-btn').style.display='block';
}

function doAdvance(){
  cur++;
  render();
}

// === Stats Display ===
function updateStats(){
  var total=cc+wc;
  document.getElementById('progress').textContent=(Math.min(cur+1,deck.length))+' / '+deck.length;
  if(total>0){
    document.getElementById('accuracy').textContent='Accuracy: '+Math.round(cc/total*100)+'%';
  }else{
    document.getElementById('accuracy').textContent='';
  }
}

function updateSessionBar(){
  var pct=sessionTotal>0?(sessionAnswered/sessionTotal)*100:0;
  document.getElementById('session-bar-fill').style.width=Math.min(pct,100)+'%';
}

// === Game Flow ===
function buildGame(){
  loadStats();
  var all=chameleonEx.slice();
  deck=prioritizeWeak(shuffle(all));
  if(deck.length>30)deck=deck.slice(0,30);
  cur=0;cc=0;wc=0;
  sessionTotal=deck.length;sessionAnswered=0;
  document.getElementById('finish-container').style.display='none';
  document.getElementById('game-container').style.display='block';
  render();
}

function startGame(){buildGame()}

// === Finish Screen ===
function showFinish(){
  var total=cc+wc;
  var pct=total>0?Math.round(cc/total*100):0;

  var wordStats={};
  for(var k in catStats){
    var w=k.split('_')[0];
    if(!wordStats[w])wordStats[w]={c:0,w:0};
    wordStats[w].c+=catStats[k].c;
    wordStats[w].w+=catStats[k].w;
  }

  var html='<h2>Session Complete!</h2>';
  html+='<div class="finish-stat">Accuracy: <strong>'+pct+'%</strong> ('+cc+'/'+total+')</div>';
  html+='<h3>All-Time Accuracy by Word</h3>';

  for(var i=0;i<WORDS.length;i++){
    var w=WORDS[i];
    var s=wordStats[w]||{c:0,w:0};
    var t=s.c+s.w;
    var wpct=t>0?Math.round(s.c/t*100):0;
    html+='<div class="word-stat">';
    html+='<span class="word-label">'+w+'</span>';
    html+='<div class="word-bar"><div class="word-fill" style="width:'+wpct+'%"></div></div>';
    html+='<span class="word-pct">'+(t>0?wpct+'%':'\u2014')+'</span>';
    html+='</div>';
  }

  html+='<button onclick="startGame()" class="restart-btn">Play Again</button>';
  html+='<br><button onclick="clearStats()" class="reset-btn">Reset Stats</button>';

  document.getElementById('finish-container').innerHTML=html;
  document.getElementById('finish-container').style.display='block';
  document.getElementById('game-container').style.display='none';
}

function clearStats(){
  if(confirm('Reset all chameleon words stats?')){
    catStats={};saveStats();startGame();
  }
}

// === Keyboard ===
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    var nb=document.getElementById('next-btn');
    if(nb&&nb.style.display!=='none'){e.preventDefault();doAdvance();return}
    var cb=document.getElementById('wo-check');
    if(cb&&!cb.disabled){e.preventDefault();woCheck(deck[cur]);return}
  }
});

// === Init ===
startGame();
</script>
</body>
</html>
