<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>German Tricky Words Drill</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .app {
    max-width: 640px; margin: 0 auto;
    padding: 16px 16px 32px;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;

  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; color: #d0d6e0; }
  .stats { font-size: 12px; color: #8a93a3; display: flex; gap: 12px; }

  .progress-wrap {
    height: 4px; background: #1e232d;
    border-radius: 2px; overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar {
    height: 100%; background: linear-gradient(90deg, #4a9eff, #6ac4ff);

  }
  .card {
    background: #181c24; border: 1px solid #252b36;
    border-radius: 12px; padding: 20px;
    margin-bottom: 16px;
  }
  .prompt-label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; color: #6b7487;
    margin-bottom: 10px;
  }
  .sentence {
    font-size: 20px; line-height: 1.5;
    color: #f0f2f5; font-weight: 400;
  }
  .sentence .target {
    color: #ffb84a; font-weight: 600;
    padding: 1px 4px; background: rgba(255, 184, 74, 0.1);
    border-radius: 4px;
  }
  .options {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 16px;
  }
  .option {
    background: #181c24; border: 1px solid #2a303c;
    color: #e6e6e6;
    padding: 14px 16px; border-radius: 10px;
    font-size: 15px; text-align: left;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
    min-height: 52px;
    display: flex; align-items: center;
  }
  .option:hover:not(:disabled) { background: #1e232d; border-color: #3a4150; }
  .option:disabled { cursor: default; }
  .option.correct {
    background: rgba(80, 200, 120, 0.12);
    border-color: #50c878; color: #8be5a8;
  }
  .option.wrong {
    background: rgba(255, 90, 90, 0.1);
    border-color: #e55a5a; color: #ff8a8a;
  }
  .option.dimmed { opacity: 0.45; }
  .reveal {
    background: #181c24; border: 1px solid #252b36;
    border-radius: 12px; padding: 16px;
    margin-bottom: 16px;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .reveal-label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; color: #6b7487;
    margin-bottom: 6px;
  }
  .translation {
    font-size: 15px; color: #c8d0dc;
    line-height: 1.5; font-style: italic;
    margin-bottom: 12px;
  }
  .explanation {
    font-size: 13px; color: #8a93a3;
    line-height: 1.5; padding-top: 10px;
    border-top: 1px solid #252b36;
  }
  .explanation b { color: #ffb84a; font-weight: 600; }
  .overview {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #252b36;
  }
  .overview-label {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; color: #6b7487;
    margin-bottom: 10px;
  }
  .overview-label b { color: #ffb84a; font-weight: 600; }
  .use-item {
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #13171f;
    border: 1px solid #1e232d;
    border-radius: 8px;
    font-size: 13px;

  .use-item:last-child { margin-bottom: 0; }
  .use-item.this-use {
    background: rgba(255, 184, 74, 0.08);
    border-color: rgba(255, 184, 74, 0.35);
  }
  .use-meaning {
    color: #d0d6e0; font-weight: 500;
    margin-bottom: 3px;
  }
  .use-item.this-use .use-meaning { color: #ffb84a; }
  .use-example { color: #8a93a3; font-size: 12px; line-height: 1.4; }
  .use-example em { color: #a9b3c3; font-style: italic; }
  .use-translation {
    color: #6b7487; font-size: 11px;
    line-height: 1.4; margin-top: 3px;
    padding-left: 10px; border-left: 2px solid #252b36;
  }
  .this-use-tag {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #ffb84a;
    background: rgba(255, 184, 74, 0.15);
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 600;
  }
  .next-btn {
    width: 100%; padding: 14px;
    background: #4a9eff; color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    margin-top: auto;
  }
  .next-btn:hover { background: #3a8eef; }
  .next-btn:active { background: #2a7edf; }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
  .mini-btn {
    flex: 1; padding: 8px;
    background: transparent; color: #6b7487;
    border: 1px solid #252b36; border-radius: 8px;
    font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .mini-btn:hover { color: #e6e6e6; border-color: #3a4150; }
  .complete { text-align: center; padding: 40px 20px; }
  .complete h2 { color: #6ac4ff; margin: 0 0 8px; }
  .complete p { color: #8a93a3; margin: 4px 0; }
  .filler { flex: 1; }
</style>
</head>

<div class="app">

    <h1>Tricky Words</h1>

// ==== SRS logic ====
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  catch (e) {}
}
function initState() {
  var boxes = {};
  for (var i = 0; i < QUESTIONS.length; i++) {
    boxes[QUESTIONS[i].id] = 1;
  }
  return { boxes: boxes, sessionCorrect: 0, sessionTotal: 0, order: null, idx: 0 };
}
function buildOrder(boxes) {
  var ids = QUESTIONS.map(function(q){ return q.id; });
  for (var i = ids.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
  }
  ids.sort(function(a, b){
    var ba = boxes[a] || 1;
    var bb = boxes[b] || 1;
    return ba - bb;
  });
  return ids;
}

var state = loadState() || initState();
for (var i = 0; i < QUESTIONS.length; i++) {
  if (state.boxes[QUESTIONS[i].id] === undefined) {
    state.boxes[QUESTIONS[i].id] = 1;
  }
}
if (!state.order || state.idx >= state.order.length) {
  state.order = buildOrder(state.boxes);
  state.idx = 0;
  state.sessionCorrect = 0;
  state.sessionTotal = 0;
}

var currentQ = null;
var answered = false;

function byId(id) {
  for (var i = 0; i < QUESTIONS.length; i++) {
    if (QUESTIONS[i].id === id) return QUESTIONS[i];
  }
  return null;
}

function render() {
  var content = document.getElementById("content");
  if (state.idx >= state.order.length) {
    content.innerHTML =
      '<div class="complete">' +
        '<h2>Session complete</h2>' +
        '<p>You got <b>' + state.sessionCorrect + '</b> out of <b>' + state.sessionTotal + '</b> correct.</p>' +
        '<p style="margin-top:20px;"><button class="next-btn" onclick="newSession()">Start New Session</button></p>' +
      '</div>';
    updateStats();
    return;
  }

  currentQ = byId(state.order[state.idx]);
  answered = false;

  var sentenceHtml = currentQ.sentence.replace(/\[([^\]]+)\]/g, '<span class="target">$1</span>');
  var optsHtml = "";
  for (var i = 0; i < currentQ.options.length; i++) {
    optsHtml += '<button class="option" data-idx="' + i + '" onclick="selectAnswer(' + i + ')">' +
      currentQ.options[i] + '</button>';
  }

  content.innerHTML =
    '<div class="card">' +
      '<div class="prompt-label">What does <b style="color:#ffb84a">' + currentQ.word + '</b> mean here?</div>' +
      '<div class="sentence">' + sentenceHtml + '</div>' +
    '</div>' +
    '<div class="options">' + optsHtml + '</div>' +
    '<div id="reveal-slot"></div>';

  updateStats();
}

function buildOverviewHtml(word, testedIdx) {
  var uses = WORD_USES[word];
  if (!uses) return "";
  var html = '<div class="overview">' +
    '<div class="overview-label">All meanings of <b>' + word + '</b></div>';
  for (var i = 0; i < uses.length; i++) {
    var isThis = (i === testedIdx);
    var cls = isThis ? "use-item this-use" : "use-item";
    var tag = isThis ? '<span class="this-use-tag">this sentence</span>' : '';
    html += '<div class="' + cls + '">' +
      '<div class="use-meaning">' + (i + 1) + '. ' + uses[i].meaning + tag + '</div>' +
      '<div class="use-example"><em>' + uses[i].example + '</em></div>' +
      '<div class="use-translation">' + uses[i].en + '</div>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

function selectAnswer(chosen) {
  if (answered) return;
  answered = true;

  var correct = chosen === currentQ.correct;
  var btns = document.querySelectorAll(".option");
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    var bi = parseInt(btns[i].getAttribute("data-idx"), 10);
    if (bi === currentQ.correct) btns[i].className = "option correct";
    else if (bi === chosen) btns[i].className = "option wrong";
    else btns[i].className = "option dimmed";
  }

  if (correct) {
    state.boxes[currentQ.id] = Math.min(5, state.boxes[currentQ.id] + 1);
    state.sessionCorrect++;
  } else {
    state.boxes[currentQ.id] = 1;
  }
  state.sessionTotal++;

  var overviewHtml = buildOverviewHtml(currentQ.word, currentQ.useIdx);

  var revealHtml =
    '<div class="reveal">' +
      '<div class="reveal-label">Translation</div>' +
      '<div class="translation">' + currentQ.translation + '</div>' +
      '<div class="explanation">' + currentQ.explain + '</div>' +
      overviewHtml +
    '</div>' +
    '<button class="next-btn" onclick="nextQuestion()">Next →</button>';
  document.getElementById("reveal-slot").innerHTML = revealHtml;

  saveState(state);
  updateStats();
}

function nextQuestion() {
  state.idx++;
  saveState(state);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateStats() {
  document.getElementById("stat-correct").textContent = state.sessionCorrect;
  document.getElementById("stat-total").textContent = state.sessionTotal;
  var sum = 0, n = 0;
  for (var id in state.boxes) {
    if (state.boxes.hasOwnProperty(id)) { sum += state.boxes[id]; n++; }
  }
  var avg = n ? (sum / n).toFixed(1) : "1";
  document.getElementById("stat-box").textContent = avg;
  var pct = state.order.length ? (state.idx / state.order.length * 100) : 0;
  document.getElementById("progress").style.width = pct + "%";
}

function resetProgress() {
  if (!confirm("Reset all progress and boxes?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = initState();
  state.order = buildOrder(state.boxes);
  render();
}

function shuffleDeck() {
  state.order = buildOrder(state.boxes);
  state.idx = 0;
  state.sessionCorrect = 0;
  state.sessionTotal = 0;
  saveState(state);
  render();
}

function newSession() {
  state.order = buildOrder(state.boxes);
  state.idx = 0;
  state.sessionCorrect = 0;
  state.sessionTotal = 0;
  saveState(state);
  render();
}

render();
</script>
