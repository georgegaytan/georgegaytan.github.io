<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>German Drills</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f0f1a; color: #e0e0e0;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}

/* When a drill is open it sits fixed over everything; lock body scroll to
   prevent rubber-banding behind the overlay. Toggled by engine-ui.js. */
body.drill-open { overflow: hidden; height: 100vh; }

/* Menu */
.menu { padding: 0 16px 40px; display: flex; flex-direction: column; align-items: center; }
.menu.hidden { display: none; }
.logo { margin: 48px 0 8px; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #666; }
.title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #fff; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: #555; margin-bottom: 32px; font-family: 'DM Mono', monospace; }

.deck-list { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
.deck-card { position: relative; overflow: hidden; background: #16162a; border: 1px solid #1e1e3a; border-radius: 14px; padding: 20px; cursor: pointer; transition: transform 0.15s, border-color 0.2s; }
.deck-card:active { transform: scale(0.97); }
.deck-card:hover { border-color: #333; }
.deck-card .accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.deck-card .icon { font-size: 28px; margin-bottom: 10px; display: block; }
.deck-card .name { font-size: 17px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.deck-card .desc { font-size: 12px; color: #777; line-height: 1.5; font-family: 'DM Mono', monospace; }
.deck-card .progress-bar { margin-top: 12px; height: 4px; background: #1e1e3a; border-radius: 2px; overflow: hidden; }
.deck-card .progress-fill { height: 100%; transition: width 0.3s; }
.deck-card .progress-label { font-size: 10px; color: #555; margin-top: 4px; font-family: 'DM Mono', monospace; }

/* Drill view */
.drill { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f0f1a; display: none; flex-direction: column; padding: 16px; overscroll-behavior: contain; }
.drill.active { display: flex; }
.drill-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #1e1e3a; }
.drill-back { background: none; border: none; color: #888; cursor: pointer; padding: 6px 10px; font-size: 14px; }
.drill-progress { font-family: 'DM Mono', monospace; font-size: 12px; color: #666; }
.drill-body { flex: 1; overflow-y: auto; padding: 24px 8px; max-width: 560px; width: 100%; margin: 0 auto; }
.prompt { font-size: 22px; line-height: 1.6; color: #fff; margin-bottom: 24px; }
.blank { display: inline-block; min-width: 80px; border-bottom: 2px solid #555; padding: 2px 8px; margin: 0 4px; font-family: 'DM Mono', monospace; }
.blank.filled { border-bottom-color: #7f5af0; color: #fff; }
.blank.correct { border-bottom-color: #4ade80; }
.blank.wrong { border-bottom-color: #ef4444; color: #fca5a5; }
.blank input { background: transparent; border: none; color: inherit; font: inherit; outline: none; width: 100%; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { background: #1e1e3a; color: #ddd; border: 1px solid #2a2a4a; border-radius: 18px; padding: 8px 14px; cursor: pointer; font-size: 14px; user-select: none; }
.chip:hover { background: #2a2a4a; }
.chip.used { opacity: 0.3; pointer-events: none; }

.choice-options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.choice-btn { background: #16162a; border: 1px solid #2a2a4a; color: #ddd; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 16px; text-align: left; }
.choice-btn:hover { border-color: #444; }
.choice-btn.correct { border-color: #4ade80; color: #4ade80; }
.choice-btn.wrong { border-color: #ef4444; color: #ef4444; }

.feedback { margin-top: 24px; padding: 16px; border-radius: 10px; }
.feedback.correct { background: #143020; color: #86efac; }
.feedback.wrong { background: #301414; color: #fca5a5; }
.feedback .correct-form { font-family: 'DM Mono', monospace; font-weight: 600; }
.feedback .translation { color: #888; font-size: 13px; margin-top: 8px; }
.feedback .explanation { color: #b8b8c8; font-size: 13px; line-height: 1.5; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); }

.drill-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; padding: 16px 0; border-top: 1px solid #1e1e3a; }
.btn-primary { background: #7f5af0; color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; }
.btn-primary:hover { background: #9572f0; }
.btn-secondary { background: transparent; color: #888; border: 1px solid #333; padding: 12px 20px; border-radius: 10px; cursor: pointer; }

.session-end { text-align: center; padding: 40px 16px; }
.session-end .stat { font-family: 'DM Mono', monospace; color: #aaa; margin: 8px 0; }
.session-end .stat-val { font-size: 24px; font-weight: 700; color: #fff; }

/* Backup row */
.backup-row { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
.backup-btn { font-family: 'DM Mono', monospace; font-size: 11px; color: #555; border: 1px solid #333; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.backup-btn:hover { border-color: #555; color: #888; }

/* Degraded-storage banner (shown when IDB unavailable and we're on the
   localStorage fallback - Storage.isDegraded() is true). */
.storage-banner {
  width: 100%;
  max-width: 440px;
  margin: 24px auto 0;
  padding: 12px 14px;
  background: #2a1f10;
  border: 1px solid #5a4520;
  border-radius: 10px;
  color: #f0c060;
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.storage-banner.hidden { display: none; }
.storage-banner .body { flex: 1; }
.storage-banner .close {
  background: transparent;
  border: none;
  color: #f0c060;
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
</style>
</head>

","alts":[],"topic":"noch_still","scaffoldPool":"chameleon_particles"}],"translation":"He still lives in Berlin.","explanation":"*noch* meaning *still* — the living-in-Berlin continues at the time of speaking."},{"id":"cham_noch_not_yet_001","kind":"cloze","prompt":"Sie hat den Film {0} nicht gesehen.","blanks":[{"answer":"noch","alts":[],"topic":"noch_not_yet","scaffoldPool":"chameleon_particles"}],"translation":"She hasn't seen the movie yet.","explanation":"*noch nicht* = *not yet*; the *noch* extends a negation forward in time."},{"id":"cham_noch_another_001","kind":"cloze","prompt":"Möchtest du {0} ein Stück Kuchen?","blanks":[{"answer":"noch","alts":[],"topic":"noch_another","scaffoldPool":"chameleon_particles"}],"translation":"Would you like another piece of cake?","explanation":"*noch* asking for *another* (more of the same): *noch ein Stück* = *one more piece*."},{"id":"cham_noch_even_001","kind":"cloze","prompt":"Das Buch ist {0} besser als der Film.","blanks":[{"answer":"noch","alts":[],"topic":"noch_even","scaffoldPool":"chameleon_particles"}],"translation":"The book is even better than the film.","explanation":"*noch* intensifying a comparative: *noch besser* = *even better*."},{"id":"cham_noch_meaning_001","kind":"choice","prompt":"Der Chef sitzt noch im Büro. (Was bedeutet hier das Partikel?)","options":["still","not yet","another (additional)","even (intensifier)"],"answer":"still","topic":"noch_still","explanation":"*noch* meaning *still* — the boss's sitting in the office is ongoing at the moment of speaking."},{"id":"cham_noch_meaning_002","kind":"choice","prompt":"Das wäre noch interessanter. (Was bedeutet hier das Partikel?)","options":["still","not yet","another (additional)","even (intensifier)"],"answer":"even (intensifier)","topic":"noch_even","explanation":"*noch* intensifying the comparative *interessanter*: *even more interesting*."},{"id":"cham_schon_already_001","kind":"cloze","prompt":"Ich habe das Buch {0} gelesen.","blanks":[{"answer":"schon","alts":[],"topic":"schon_already","scaffoldPool":"chameleon_particles"}],"translation":"I have already read the book.","explanation":"*schon* = *already*; the reading happened earlier than the listener might expect."},{"id":"cham_schon_ever_001","kind":"cloze","prompt":"Bist du {0} mal in Japan gewesen?","blanks":[{"answer":"schon","alts":[],"topic":"schon_ever","scaffoldPool":"chameleon_particles"}],"translation":"Have you ever been to Japan?","explanation":"*schon* with a perfect-tense question asks *ever* / *yet*: *Warst du schon …?* = *Have you ever been …?*"},{"id":"cham_schon_yet_again_001","kind":"cloze","prompt":"Du bist {0} wieder zu spät gekommen.","blanks":[{"answer":"schon","alts":[],"topic":"schon_yet_again","scaffoldPool":"chameleon_particles"}],"translation":"You arrived late yet again.","explanation":"*schon wieder* = *yet again*, expressing mild exasperation at a repeat occurrence."},{"id":"cham_schon_reassurance_001","kind":"cloze","prompt":"Wir werden das {0} schaffen, keine Sorge.","blanks":[{"answer":"schon","alts":[],"topic":"schon_reassurance","scaffoldPool":"chameleon_particles"}],"translation":"We'll manage it, no worries.","explanation":"Modal-particle *schon* reassuring the listener: *wir werden das schon schaffen* = *it'll work out*."},{"id":"cham_schon_meaning_001","kind":"choice","prompt":"Die Kinder haben schon geschlafen. (Was bedeutet hier das Partikel?)","options":["already","ever (at any time)","yet again","reassurance (don't worry)"],"answer":"already","topic":"schon_already","explanation":"*schon* with the perfect *haben geschlafen* = *already slept*; the event is complete sooner than expected."},{"id":"cham_schon_meaning_002","kind":"choice","prompt":"Es wird schon klappen. (Was bedeutet hier das Partikel?)","options":["already","ever (at any time)","yet again","reassurance (don't worry)"],"answer":"reassurance (don't worry)","topic":"schon_reassurance","explanation":"Modal-particle *schon* in *es wird schon klappen* reassures: *it'll work out*."},{"id":"cham_doch_insistence_001","kind":"cloze","prompt":"Ich habe ihm {0} geholfen!","blanks":[{"answer":"doch","alts":[],"topic":"doch_insistence","scaffoldPool":"chameleon_particles"}],"translation":"I DID help him!","explanation":"Modal-particle *doch* insisting against a contrary assumption: *I DID help him* (despite what you think)."},{"id":"cham_doch_surprise_001","kind":"cloze","prompt":"Sie ist {0} gekommen!","blanks":[{"answer":"doch","alts":[],"topic":"doch_surprise","scaffoldPool":"chameleon_particles"}],"translation":"She came after all!","explanation":"*doch* expressing surprise / contradiction of an assumption — she came contrary to what was expected."},{"id":"cham_doch_encouragement_001","kind":"cloze","prompt":"Komm {0} einfach mit!","blanks":[{"answer":"doch","alts":[],"topic":"doch_encouragement","scaffoldPool":"chameleon_particles"}],"translation":"Just come along!","explanation":"*doch* in an imperative softens it into encouragement: *go ahead and come along*."},{"id":"cham_doch_meaning_001","kind":"choice","prompt":"Sie hat das doch gesagt! (Was bedeutet hier das Partikel?)","options":["insistence (DID do it)","after all (surprise)","soft encouragement","however"],"answer":"insistence (DID do it)","topic":"doch_insistence","explanation":"Modal-particle *doch* insisting against a contrary assumption: *she DID say that*."},{"id":"cham_doch_meaning_002","kind":"choice","prompt":"Er ist doch hier! (Was bedeutet hier das Partikel?)","options":["insistence (DID do it)","after all (surprise)","soft encouragement","frustration"],"answer":"after all (surprise)","topic":"doch_surprise","explanation":"*doch* expressing surprise / contradiction: *he's here after all*, contrary to what was assumed."},{"id":"cham_mal_softener_001","kind":"cloze","prompt":"Kannst du mir {0} helfen?","blanks":[{"answer":"mal","alts":[],"topic":"mal_softener","scaffoldPool":"chameleon_particles"}],"translation":"Could you help me?","explanation":"Modal-particle *mal* softening a request — *could you help me real quick*."},{"id":"cham_mal_once_more_001","kind":"cloze","prompt":"Kannst du das noch{0} erklären?","blanks":[{"answer":"mal","alts":[],"topic":"mal_once_more","scaffoldPool":"chameleon_particles"}],"translation":"Can you explain it once more?","explanation":"*noch mal* = *once more* (one additional time); *mal* here carries the repetition sense."},{"id":"cham_mal_meaning_001","kind":"choice","prompt":"Kannst du das Fenster mal öffnen? (Was bedeutet hier das Partikel?)","options":["request softener","once more (repetition)","after all","probably"],"answer":"request softener","topic":"mal_softener","explanation":"Modal-particle *mal* softening the request *open the window* — informal and brief."},{"id":"cham_erst_not_until_001","kind":"cloze","prompt":"Der Zug fährt {0} um 10 Uhr ab.","blanks":[{"answer":"erst","alts":[],"topic":"erst_not_until","scaffoldPool":"chameleon_particles"}],"translation":"The train doesn't leave until 10.","explanation":"*erst* with a time expression means *not until*: the departure is later than expected."},{"id":"cham_erst_only_just_001","kind":"cloze","prompt":"Sie ist {0} gestern angekommen.","blanks":[{"answer":"erst","alts":[],"topic":"erst_only_just","scaffoldPool":"chameleon_particles"}],"translation":"She only arrived yesterday.","explanation":"*erst* meaning *only just*: emphasis that her arrival happened only recently."},{"id":"cham_erst_first_001","kind":"cloze","prompt":"Ich muss {0} die E-Mail lesen.","blanks":[{"answer":"erst","alts":[],"topic":"erst_first","scaffoldPool":"chameleon_particles"}],"translation":"I have to read the email first.","explanation":"*erst* meaning *first* in sequence — read the email before doing anything else."},{"id":"cham_erst_meaning_001","kind":"choice","prompt":"Er kommt erst nächste Woche zurück. (Was bedeutet hier das Partikel?)","options":["not until (later than expected)","only just (recently)","first (before something else)","already"],"answer":"not until (later than expected)","topic":"erst_not_until","explanation":"*erst nächste Woche* = *not until next week*: *erst* with a time expression pushes the event later than expected."},{"id":"cham_erst_meaning_002","kind":"choice","prompt":"Er ist erst vor einer Stunde aufgewacht. (Was bedeutet hier das Partikel?)","options":["not until (later than expected)","only just (recently)","first (before something else)","still"],"answer":"only just (recently)","topic":"erst_only_just","explanation":"*erst vor einer Stunde* = *only an hour ago*: *erst* stresses that the waking happened only recently."},{"id":"cham_ja_shared_knowledge_001","kind":"cloze","prompt":"Er kommt {0} morgen, wie wir wissen.","blanks":[{"answer":"ja","alts":[],"topic":"ja_shared_knowledge","scaffoldPool":"chameleon_particles"}],"translation":"He's coming tomorrow, as we know.","explanation":"Modal-particle *ja* appealing to information the listener already knows — *as we both know*."},{"id":"cham_ja_warning_001","kind":"cloze","prompt":"Du darfst das {0} nicht vergessen!","blanks":[{"answer":"ja","alts":[],"topic":"ja_warning","scaffoldPool":"chameleon_particles"}],"translation":"You'd better not forget that!","explanation":"*ja* in a warning intensifies it: *make sure you don't forget that!*"},{"id":"cham_ja_meaning_001","kind":"choice","prompt":"Du hast ja keine Zeit. (Was bedeutet hier das Partikel?)","options":["as we both know (shared knowledge)","emphatic warning","expression of surprise","yes"],"answer":"as we both know (shared knowledge)","topic":"ja_shared_knowledge","explanation":"Modal-particle *ja* appealing to shared knowledge: *as we both know, you have no time*."},{"id":"cham_ja_meaning_002","kind":"choice","prompt":"Vergiss das ja nicht! (Was bedeutet hier das Partikel?)","options":["as we both know (shared knowledge)","emphatic warning","expression of surprise","probably"],"answer":"emphatic warning","topic":"ja_warning","explanation":"*ja* in a negative impe anks":[{"answer":"werde","alts":[],"topic":"futur_werden_1sg"},{"answer":"lesen","alts":[],"topic":"futur_inf_lesen"}],"translation":"Tonight I will read the book.","explanation":"Futur I uses conjugated *werden* (here *werde* for 1sg) plus the infinitive *lesen* at the end."},{"id":"future_futur1_lernen_1sg_031","kind":"cloze","prompt":"Im Herbst {0} ich Spanisch {1}.","blanks":[{"answer":"werde","alts":[],"topic":"futur_werden_1sg"},{"answer":"lernen","alts":[],"topic":"futur_inf_lernen"}],"translation":"In autumn I will learn Spanish.","explanation":"Futur I uses conjugated *werden* (here *werde* for 1sg) plus the infinitive *lernen* at the end."},{"id":"future_futur1_helfen_3sg_032","kind":"cloze","prompt":"Sie {0} dir gerne {1}.","blanks":[{"answer":"wird","alts":[],"topic":"futur_werden_3sg"},{"answer":"helfen","alts":[],"topic":"futur_inf_helfen"}],"translation":"She will gladly help you.","explanation":"Futur I uses conjugated *werden* (here *wird* for 3sg) plus the infinitive *helfen* at the end."},{"id":"past_aux_gehen_001","kind":"choice","prompt":"Ich ___ nach Hause gegangen.","options":["bin","habe"],"answer":"bin","topic":"aux_choice_motion","explanation":"*gehen* is a verb of motion, so it takes *sein* in the Perfekt."},{"id":"past_aux_fahren_002","kind":"choice","prompt":"Wir ___ nach Berlin gefahren.","options":["sind","haben"],"answer":"sind","topic":"aux_choice_motion","explanation":"*fahren* is a verb of motion, so it takes *sein* in the Perfekt."},{"id":"past_aux_kommen_003","kind":"choice","prompt":"Er ___ gestern gekommen.","options":["ist","hat"],"answer":"ist","topic":"aux_choice_motion","explanation":"*kommen* is a verb of motion, so it takes *sein* in the Perfekt."},{"id":"past_aux_sein_004","kind":"choice","prompt":"Ich ___ in Wien gewesen.","options":["bin","habe"],"answer":"bin","topic":"aux_choice_state","explanation":"*sein* is one of the irregular verbs (along with *bleiben*) that always takes *sein* as its auxiliary in the Perfekt."},{"id":"past_aux_machen_005","kind":"choice","prompt":"Er ___ das Essen gemacht.","options":["hat","ist"],"answer":"hat","topic":"aux_choice_transitive","explanation":"Transitive verbs like *machen* (with a direct object) take *haben* in the Perfekt."},{"id":"past_aux_lesen_006","kind":"choice","prompt":"Wir ___ das Buch gelesen.","options":["haben","sind"],"answer":"haben","topic":"aux_choice_transitive","explanation":"Transitive verbs like *lesen* (with a direct object) take *haben* in the Perfekt."},{"id":"past_aux_essen_007","kind":"choice","prompt":"Sie ___ Pizza gegessen.","options":["hat","ist"],"answer":"hat","topic":"aux_choice_transitive","explanation":"Transitive verbs like *essen* (with a direct object) take *haben* in the Perfekt."},{"id":"past_aux_arbeiten_008","kind":"choice","prompt":"Er ___ den ganzen Tag gearbeitet.","options":["hat","ist"],"answer":"hat","topic":"aux_choice_intransitive_non_motion","explanation":"Intransitive verbs that don't change location or state (like *arbeiten*) take *haben* in the Perfekt."}]},{"id":"pronouns","name":"Pronouns","icon":"👥","color":"#ec4899","description":"Personal, possessive, reflexive, interrogative, and demonstrative pronouns by case.","pools":{"personal_nom":{"category":"personal_pronoun","items":["ich","du","er","sie","es","wir","ihr","Sie"]},"personal_acc":{"category":"personal_pronoun","items":["mich","dich","ihn","sie","es","uns","euch","Sie"]},"personal_dat":{"category":"personal_pronoun","items":["mir","dir","ihm","ihr","uns","euch","ihnen","Ihnen"]},"reflexive_pronouns":{"category":"reflexive_pronoun","items":["mich","dich","sich","uns","euch"]},"interrogative_pronouns":{"category":"interrogative_pronoun","items":["wer","wen","wem","wessen","was"]},"demonstrative_pronouns":{"category":"demonstrative_pronoun","items":["dieser","diese","dieses","diesen","diesem"]},"possessive_nom_acc_fem":{"category":"possessive_pronoun","items":["meine","deine","seine","ihre","unsere","eure"]},"possessive_acc_masc":{"category":"possessive_pronoun","items":["meinen","deinen","seinen","ihren","unseren","euren"]},"possessive_dat_masc_neut":{"category":"possessive_pronoun","items":["meinem","deinem","seinem","ihrem","unserem","eurem"]},"possessive_dat_fem":{"category":"possessive_pronoun","items":["meiner","deiner","seiner","ihrer","unserer","eurer"]}},"items":[{"id":"pron_pers_nom_1sg_001","kind":"cloze","prompt":"{0} komme morgen um neun.","blanks":[{"answer":"Ich","alts":["ich"],"topic":"pers_nom_1_sg","scaffoldPool":"personal_nom"}],"translation":"I am coming tomorrow at nine.","explanation":"1st-person singular subject is *ich*."},{"id":"pron_pers_nom_2sg_001","kind":"cloze","prompt":"Wann kommst {0} nach Hause?","blanks":[{"answer":"du","alts":[],"topic":"pers_nom_2_sg","scaffoldPool":"personal_nom"}],"translation":"When are you coming home?","explanation":"Informal 2nd-person singular subject is *du*."},{"id":"pron_pers_nom_3m_sg_001","kind":"cloze","prompt":"Mein Bruder ist Lehrer. {0} arbeitet in Berlin.","blanks":[{"answer":"Er","alts":["er"],"topic":"pers_nom_3m_sg","scaffoldPool":"personal_nom"}],"translation":"My brother is a teacher. He works in Berlin.","explanation":"3rd-person masculine singular subject is *er* (referring to a male person or a masculine noun)."},{"id":"pron_pers_nom_3f_sg_001","kind":"cloze","prompt":"Meine Schwester ist Ärztin. {0} wohnt in München.","blanks":[{"answer":"Sie","alts":["sie"],"topic":"pers_nom_3f_sg","scaffoldPool":"personal_nom"}],"translation":"My sister is a doctor. She lives in Munich.","explanation":"3rd-person feminine singular subject is *sie* (referring to a female person or a feminine noun); capitalised here at the start of the sentence."},{"id":"pron_pers_nom_1pl_001","kind":"cloze","prompt":"{0} fahren am Wochenende ans Meer.","blanks":[{"answer":"Wir","alts":["wir"],"topic":"pers_nom_1_pl","scaffoldPool":"personal_nom"}],"translation":"We are going to the sea on the weekend.","explanation":"1st-person plural subject is *wir*."},{"id":"pron_pers_nom_3pl_001","kind":"choice","prompt":"Die Kinder spielen draussen. ___ haben viel Spass.","pool":"personal_nom","answer":"sie","topic":"pers_nom_3_pl","explanation":"3rd-person plural subject is *sie* (lowercase; not to be confused with formal *Sie*)."},{"id":"pron_pers_acc_1sg_001","kind":"cloze","prompt":"Kannst du {0} morgen anrufen?","blanks":[{"answer":"mich","alts":[],"topic":"pers_acc_1_sg","scaffoldPool":"personal_acc"}],"translation":"Can you call me tomorrow?","explanation":"1st-person singular accusative is *mich* (direct object of *anrufen*)."},{"id":"pron_pers_acc_2sg_001","kind":"cloze","prompt":"Ich verstehe {0} nicht ganz.","blanks":[{"answer":"dich","alts":[],"topic":"pers_acc_2_sg","scaffoldPool":"personal_acc"}],"translation":"I don't quite understand you.","explanation":"Informal 2nd-person singular accusative is *dich* (direct object)."},{"id":"pron_pers_acc_3m_sg_001","kind":"cloze","prompt":"Da ist Peter. Siehst du {0}?","blanks":[{"answer":"ihn","alts":[],"topic":"pers_acc_3m_sg","scaffoldPool":"personal_acc"}],"translation":"There is Peter. Do you see him?","explanation":"3rd-person masculine accusative is *ihn* (direct object referring to a male person or masculine noun)."},{"id":"pron_pers_acc_3f_sg_001","kind":"choice","prompt":"Anna ist meine Freundin. Ich besuche ___ am Samstag.","pool":"personal_acc","answer":"sie","topic":"pers_acc_3f_sg","explanation":"3rd-person feminine accusative is *sie* — same form as the nominative, distinguished by context."},{"id":"pron_pers_acc_1pl_001","kind":"cloze","prompt":"Der Lehrer fragt {0} oft auf Deutsch.","blanks":[{"answer":"uns","alts":[],"topic":"pers_acc_1_pl","scaffoldPool":"personal_acc"}],"translation":"The teacher often asks us in German.","explanation":"1st-person plural accusative is *uns* (same form serves the dative)."},{"id":"pron_pers_acc_2pl_001","kind":"cloze","prompt":"Eure Eltern haben angerufen. Sie suchen {0}.","blanks":[{"answer":"euch","alts":[],"topic":"pers_acc_2_pl","scaffoldPool":"personal_acc"}],"translation":"Your parents called. They are looking for you all.","explanation":"Informal 2nd-person plural accusative is *euch* (same form serves the dative)."},{"id":"pron_pers_dat_1sg_001","kind":"cloze","prompt":"Kannst du {0} bitte helfen?","blanks":[{"answer":"mir","alts":[],"topic":"pers_dat_1_sg","scaffoldPool":"personal_dat"}],"translation":"Can you please help me?","explanation":"1st-person singular dative is *mir* — *helfen* governs the dative."},{"id":"pron_pers_dat_2sg_001","kind":"cloze","prompt":"Ich gebe {0} morgen das Buch zurück.","blanks":[{"answer":"dir","alts":[],"topic":"pers_dat_2_sg","scaffoldPool":"personal_dat"}],"translation":"I'll give you back the book tomorrow.","explanation":"Informal 2nd-person singular dative is *dir* (indirect object of *geben*)."},{"id":"pron_pers_dat_3m_sg_001","kind":"cloze","prompt":"Tom hat Geburtstag. Wir schenken {0} ein Buch.","blanks":[{"answer":"ihm","alts":[],"topic":"pers_dat_3m_sg","scaffoldPool":"personal_dat"}],"translation":"Tom has a birthday. We're giving him a book.","explanation":"3rd-person masculine dative is *ihm* (indirect object of *schenken*)."},{"id":"pron_pers_dat_3f_sg_001","kind":"cloze","prompt":"Maria ist krank. Wie geht es {0}?","blanks":[{"answer":"ihr","alts":[],"topic":"pers_dat_3f_sg","scaffoldPool":"personal_dat"}],"translation":"Maria is sick. How is she doing?","explanation":"3rd-person feminine dative is *ihr* (here with the dative idiom *wie geht es …*)."},{"id":"pron_pers_dat_3pl_001","kind":"choice","prompt":"Die Kollegen brauchen Hilfe. Ich helfe ___ gleich.","pool":"personal_dat","answer":"ihnen","topic":"pers_dat_3_pl","explanation":"3rd-person plural dative is *ihnen* (lowercase; the formal *Ihnen* is capitalised). *Helfen* takes the dative."},{"id":"pron_pers_dat_formal_001","kind":"cloze","prompt":"Herr Schmidt, kann ich {0} etwas anbieten?","blanks":[{"answer":"Ihnen","alts":["ihnen"],"topic":"pers_dat_formal","scaffoldPool":"personal_dat"}],"translation":"Mr Schmidt, can I offer you something?","explanation":"Formal *Sie* in the dative is *Ihnen*, capitalised."},{"id":"pron_refl_1sg_001","kind":"choice","prompt":"Ich wasche ___ die Hände.","pool":"reflexive_pronouns","answer":"mich","topic":"refl_1_sg","explanation":"Reflexive 1st-person singular accusative is *mich* (same form as the personal accusative)."},{"id":"pron_refl_2sg_001","kind":"choice","prompt":"Setz ___ bitte hin!","pool":"reflexive_pronouns","answer":"dich","topic":"refl_2_sg","explanation":"Reflexive informal 2nd-person singular accusative is *dich* (same form as the personal accusative)."},{"id":"pron_refl_3sg_001","kind":"choice","prompt":"Er freut ___ auf den Urlaub.","pool":"reflexive_pronouns","answer":"sich","topic":"refl_3_sg","explanation":"All 3rd-person reflexives — singular and plural, all cases — collapse to *sich*."},{"id":"pron_refl_3pl_001","kind":"choice","prompt":"Die Gäste unterhalten ___ gut.","pool":"reflexive_pronouns","answer":"sich","topic":"refl_3_pl","explanation":"All 3rd-person reflexives — singular and plural, all cases — collapse to *sich*."},{"id":"pron_refl_1pl_001","kind":"choice","prompt":"Wir treffen ___ um sieben am Bahnhof.","pool":"reflexive_pronouns","answer":"uns","topic":"refl_1_pl","explanation":"Reflexive 1st-person plural is *uns* in both accusative and dative — identical to the personal pronoun."},{"id":"pron_refl_2pl_001","kind":"choice","prompt":"Beeilt ___, sonst kommt ihr zu spät!","pool":"reflexive_pronouns","answer":"euch","topic":"refl_2_pl","explanation":"Reflexive informal 2nd-person plural is *euch* in both accusative and dative — identical to the personal pronoun."},{"id":"pron_int_nom_001","kind":"choice","prompt":"___ kommt heute Abend zur Party?","pool":"interrogative_pronouns","answer":"wer","topic":"int_wer","explanation":"*Wer* asks about the subject (nominative): who?"},{"id":"pron_int_acc_001","kind":"choice","prompt":"___ hast du gestern auf der Strasse getroffen?","pool":"interrogative_pronouns","answer":"wen","topic":"int_wen","explanation":"*Wen* is the accusative interrogative: whom (direct object)?"},{"id":"pron_int_dat_001","kind":"choice","prompt":"Mit ___ sprichst du gerade am Telefon?","pool":"interrogative_pronouns","answer":"wem","topic":"int_wem","explanation":"*Wem* is the dative interrogative: to/for whom? *Mit* governs the dative."},{"id":"pron_int_gen_001","kind":"choice","prompt":"___ Auto steht da vor dem Haus?","pool":"interrogative_pronouns","answer":"wessen","topic":"int_wessen","explanation":"*Wessen* is the genitive interrogative: whose?"},{"id":"pron_int_was_001","kind":"choice","prompt":"___ machst du heute Nachmittag?","pool":"interrogative_pronouns","answer":"was","topic":"int_was","explanation":"*Was* asks about a thing: what? Used for both subject and direct object."},{"id":"pron_dem_nom_m_001","kind":"choice","prompt":"___ Mantel hier gehört mir.","pool":"demonstrative_pronouns","answer":"dieser","topic":"dem_nom_m_sg","explanation":"Demonstrative *dieser* before a masculine nominative noun — same *-er* ending as the definite article *der*."},{"id":"pron_dem_nom_f_001","kind":"choice","prompt":"___ Tasche ist sehr teuer.","pool":"demonstrative_pronouns","answer":"diese","topic":"dem_nom_f_sg","explanation":"Demonstrative *diese* before a feminine nominative noun — same *-e* ending as the definite article *die*."},{"id":"pron_dem_acc_m_001","kind":"choice","prompt":"Ich nehme ___ Kuchen, bitte.","pool":"demonstrative_pronouns","answer":"diesen","topic":"dem_acc_m_sg","explanation":"Demonstrative *diesen* before a masculine accusative noun — same *-en* ending as *den*."},{"id":"pron_dem_dat_m_001","kind":"choice","prompt":"Mit ___ Schlüssel öffnest du die Tür.","pool":"demonstrative_pronouns","answer":"diesem","topic":"dem_dat_m_sg","explanation":"Demonstrative *diesem* before a masculine dative noun — same *-em* ending as *dem*. *Mit* governs the dative."},{"id":"pron_poss_nom_f_001","kind":"choice","prompt":"Das ist ___ Schwester aus Hamburg.","pool":"possessive_nom_acc_fem","answer":"meine","topic":"poss_nom_1sg_f","explanation":"Possessive *mein* (my) gains *-e* before a feminine nominative noun (*meine Schwester*)."},{"id":"pron_poss_acc_m_001","kind":"choice","prompt":"Hast du ___ Schlüssel gesehen? Ich finde ihn nicht.","pool":"possessive_acc_masc","answer":"meinen","topic":"poss_acc_1sg_m","explanation":"Possessive *mein* (my) gains *-en* before a masculine accusative noun (*meinen Schlüssel*)."},{"id":"pron_poss_dat_m_001","kind":"choice","prompt":"Sie spricht oft mit ___ Bruder am Telefon.","pool":"possessive_dat_masc_neut","answer":"ihrem","topic":"poss_dat_3fsg_m","explanation":"Possessive *ihr* (her) gains *-em* before a masculine dative noun (*ihrem Bruder*). *Mit* governs the dative."},{"id":"pron_poss_dat_f_001","kind":"choice","prompt":"Er hilft ___ Mutter im Garten.","pool":"possessive_dat_fem","answer":"seiner","topic":"poss_dat_3msg_f","explanation":"Possessive *sein* (his) gains *-er* before a feminine dative noun (*seiner Mutter*). *Helfen* governs the dative."},{"id":"pron_poss_nom_2pl_001","kind":"choice","prompt":"Wie heisst ___ Tochter eigentlich?","pool":"possessive_nom_acc_fem","answer":"eure","topic":"poss_nom_2pl_f","explanation":"Possessive *euer* (your, informal plural) drops the second *e* and gains *-e* before a feminine nominative noun (*eure Tochter*)."}]},{"id":"tricky-words","name":"Tricky Words","icon":"🎭","color":"#ef4444","description":"34 German particles whose meaning depends on context: damit, doch, eben, halt, ja, mal, ruhig, schon, etc.","items":[{"id":"tricky_damit_with_it_001","kind":"choice","prompt":"Ich schreibe damit einen Brief. (damit means…)","options":["with it","so that","therefore"],"answer":"with it","topic":"damit_with_it","explanation":"Here *damit* is a pronominal adverb meaning *with it* — referring back to the writing instrument. Compare *damit* as a conjunction meaning *so that*."},{"id":"tricky_damit_so_that_001","kind":"choice","prompt":"Ich lerne Deutsch, damit ich in Zürich arbeiten kann. (damit means…)","options":["with it","so that","because"],"answer":"so that","topic":"damit_so_that","explanation":"*damit* introducing a purpose clause = *so that*. Different from pronominal *damit* = *with it/that*."},{"id":"tricky_damit_with_it_002","kind":"choice","prompt":"Was willst du damit sagen? (damit means…)","options":["so that","by that","about it"],"answer":"by that","topic":"damit_with_it","explanation":"Pronominal *damit* = *by that* — referring back to the prior statement. Different from conjunction *damit* = *so that*."},{"id":"tricky_damit_so_that_002","kind":"choice","prompt":"Er spart Geld, damit er reisen kann. (damit means…)","options":["with it","so that","although"],"answer":"so that","topic":"damit_so_that","explanation":"*damit* as a purpose conjunction = *so that*, sending the verb to the end. Different from pronominal *damit* = *with it*."},{"id":"tricky_dafuer_for_it_001","kind":"choice","prompt":"Wie viel hast du dafür bezahlt? (dafür means…)","options":["for it","in return","instead"],"answer":"for it","topic":"dafuer_for_it","explanation":"Pronominal *dafür* = *for it* — the price paid for the thing referenced. Different from contrastive *dafür* = *on the other hand*."},{"id":"tricky_dafuer_in_return_001","kind":"choice","prompt":"Er ist streng, dafür ist er fair. (dafür means…)","options":["for it","on the other hand","so that"],"answer":"on the other hand","topic":"dafuer_in_return","explanation":"Contrastive *dafür* = *on the other hand / to make up for it* — balancing a negative with a positive. Different from literal *dafür* = *for it*."},{"id":"tricky_dafuer_in_favor_001","kind":"choice","prompt":"Ich bin dafür. (dafür means…)","options":["against it","in favor of it","ready for it"],"answer":"in favor of it","topic":"dafuer_in_favor","explanation":"*dafür sein* = *to be in favor of it* — the standard pro/contra idiom. Different from compensatory *dafür* = *on the other hand*."},{"id":"tricky_dafuer_not_my_fault_001","kind":"choice","prompt":"Dafür kann ich nichts. (dafür means…)","options":["in return","about that / for that","because"],"answer":"about that / for that","topic":"dafuer_not_my_fault","explanation":"Idiomatic *dafür kann ich nichts* = *I can't help it / it's not my fault about that*. Different from literal *dafür* = *for it (in exchange)*."},{"id":"tricky_dazu_about_that_001","kind":"choice","prompt":"Was sagst du dazu? (dazu means…)","options":["about that","in addition","because of that"],"answer":"about that","topic":"dazu_about_that","explanation":"Pronominal *dazu* = *about that* — referring back to a topic just raised. Different from additive *dazu* = *in addition*."},{"id":"tricky_dazu_in_addition_001","kind":"choice","prompt":"Er kocht gut, und dazu singt er auch. (dazu means…)","options":["about it","in addition","for that purpose"],"answer":"in addition","topic":"dazu_in_addition","explanation":"Additive *dazu* = *in addition / on top of that*, stacking another quality. Different from *dazu* = *about that* (reference) or *for that purpose*."},{"id":"tricky_dazu_for_purpose_001","kind":"choice","prompt":"Dazu brauche ich mehr Zeit. (dazu means…)","options":["in addition","about it","for that purpose"],"answer":"for that purpose","topic":"dazu_for_purpose","explanation":"*dazu* = *for that purpose / to do that* — referring to a task to accomplish. Different from additive *dazu* = *in addition*."},{"id":"tricky_dazu_about_that_002","kind":"choice","prompt":"Ich habe keine Lust dazu. (dazu means…)","options":["to do that","in addition","instead of that"],"answer":"to do that","topic":"dazu_about_that","explanation":"*Lust dazu* — *dazu* refers back to the activity: *no desire to do that*. Different from additive *dazu* = *in addition*."},{"id":"tricky_schon_already_001","kind":"choice","prompt":"Bist du schon fertig? (schon means…)","options":["already","still","only just"],"answer":"already","topic":"schon_already","explanation":"*schon* meaning *already* (sooner than expected). Different from modal-particle *schon* reassuring the listener."},{"id":"tricky_schon_reassurance_001","kind":"choice","prompt":"Das wird schon klappen. (schon means…)","options":["already","surely / don't worry","just"],"answer":"surely / don't worry","topic":"schon_reassurance","explanation":"Modal-particle *schon* in a future statement = *surely / don't worry, it'll work out*. Different from temporal *schon* = *already*."},{"id":"tricky_schon_already_002","kind":"choice","prompt":"Ich habe schon drei Mal angerufen. (schon means…)","options":["only just","already","even"],"answer":"already","topic":"schon_already","explanation":"*schon* = *already*, marking that an action has occurred more times than expected. Different from reassuring *schon* = *don't worry*."},{"id":"tricky_schon_softener_001","kind":"choice","prompt":"Das ist schon okay. (schon means…)","options":["already","it's fine / alright","still"],"answer":"it's fine / alright","topic":"schon_softener","explanation":"Modal-particle *schon* softens the statement = *it's alright / fine really*. Different from temporal *schon* = *already*."},{"id":"tricky_noch_still_001","kind":"choice","prompt":"Er schläft noch. (noch means…)","options":["already","still","again"],"answer":"still","topic":"noch_still","explanation":"*noch* meaning *still* (the action continues). Compare *noch ein* = *another*, *noch nicht* = *not yet*."},{"id":"tricky_noch_another_001","kind":"choice","prompt":"Noch ein Bier, bitte! (noch means…)","options":["still","another","even"],"answer":"another","topic":"noch_another","explanation":"*noch ein* = *another / one more*. Different from *noch* = *still* (continuing action) or *noch* = *even* (intensifier)."},{"id":"tricky_noch_even_001","kind":"choice","prompt":"Das ist noch besser als das erste. (noch means…)","options":["still","already","even"],"answer":"even","topic":"noch_even","explanation":"*noch* before a comparative = *even (better)*, intensifying the comparison. Different from *noch* = *still* (continuing)."},{"id":"tricky_noch_any_more_001","kind":"choice","prompt":"Hast du noch Fragen? (noch means…)","options":["any more","already","only"],"answer":"any more","topic":"noch_any_more","explanation":"*noch* in a question = *any more / further* — checking for remaining items. Different from *noch* = *still* (continuing action)."},{"id":"tricky_erst_not_until_001","kind":"choice","prompt":"Er kommt erst morgen. (erst means…)","options":["already tomorrow","not until tomorrow","first tomorrow"],"answer":"not until tomorrow","topic":"erst_not_until","explanation":"Temporal *erst* = *not until* — later than expected. Opposite of *schon* = *already*. Different from sequential *erst* = *first*."},{"id":"tricky_erst_just_now_001","kind":"choice","prompt":"Ich bin erst angekommen. (erst means…)","options":["only just / just now","already","finally"],"answer":"only just / just now","topic":"erst_just_now","explanation":"*erst* = *only just / just now* — emphasising how recent the action is. Different from sequential *erst* = *first*."},{"id":"tricky_erst_first_001","kind":"choice","prompt":"Erst denken, dann handeln. (erst means…)","options":["only","first","not until"],"answer":"first","topic":"erst_first","explanation":"Sequential *erst … dann …* = *first … then …*. Different from temporal *erst* = *not until* or quantitative *erst* = *only*."},{"id":"tricky_erst_only_001","kind":"choice","prompt":"Sie ist erst fünf Jahre alt. (erst means…)","options":["already","only / just","first"],"answer":"only / just","topic":"erst_only","explanation":"Quantitative *erst* with an age or quantity = *only / just* (less than you'd think). Different from *erst* = *first* (sequential)."},{"id":"tricky_doch_contradiction_001","kind":"choice","prompt":"— Du kommst nicht mit? — Doch! (doch means…)","options":["yes, I am (after all)!","no way!","maybe!"],"answer":"yes, I am (after all)!","topic":"doch_contradiction","explanation":"Standalone *doch!* contradicts a negative statement = *yes, I am!*. Different from modal-particle *doch* softening an imperative."},{"id":"tricky_doch_insistence_001","kind":"choice","prompt":"Das weißt du doch! (doch means…)","options":["maybe","you know that! (insistence)","still"],"answer":"you know that! (insistence)","topic":"doch_insistence","explanation":"Modal-particle *doch* insisting on shared knowledge = *come on, you know that!*. Different from *doch* contradicting a negation."},{"id":"tricky_doch_softener_001","kind":"choice","prompt":"Komm doch mit! (doch means…)","options":["come along (softening)","don't come","come first"],"answer":"come along (softening)","topic":"doch_softener","explanation":"Modal-particle *doch* softening an imperative — *go ahead and come along*. Different from *doch* contradicting a negation."},{"id":"tricky_doch_after_all_001","kind":"choice","prompt":"Er kommt doch. (doch means…)","options":["not at all","after all / it turns out","sometimes"],"answer":"after all / it turns out","topic":"doch_after_all","explanation":"*doch* meaning *after all / yet* — contradicting a prior expectation that he wouldn't come. Different from softening *doch* in imperatives."},{"id":"tricky_ja_obviously_001","kind":"choice","prompt":"Das ist ja klar! (ja means…)","options":["maybe","obviously / as you can see","already"],"answer":"obviously / as you can see","topic":"ja_obviously","explanation":"Modal-particle *ja* marks shared/obvious knowledge = *obviously / as we both know*. Different from *ja* as a warning or as a literal *yes*."},{"id":"tricky_ja_warning_001","kind":"choice","prompt":"Komm ja nicht zu spät! (ja means…)","options":["please do","don't you dare","maybe"],"answer":"don't you dare","topic":"ja_warning","explanation":"Modal-particle *ja* in a negative imperative is a strong warning = *don't you dare*. Different from *ja* marking shared knowledge = *obviously*."},{"id":"tricky_mal_softener_001","kind":"choice","prompt":"Hör mal! (mal means…)","options":["once","just (softener)","always"],"answer":"just (softener)","topic":"mal_softener","explanation":"Modal-particle *mal* softens an imperative = *just listen for a sec*. Different from temporal *mal* = *once / at some point*."},{"id":"tricky_mal_once_001","kind":"choice","prompt":"Ich war mal in Berlin. (mal means…)","options":["once / at some point","often","never"],"answer":"once / at some point","topic":"mal_once","explanation":"Temporal *mal* with past tense = *once / at some point*, short for *einmal*. Different from softening *mal* in imperatives."},{"id":"tricky_denn_curiosity_001","kind":"choice","prompt":"Wo bist du denn? (denn means…)","options":["because","then / anyway (curious)","already"],"answer":"then / anyway (curious)","topic":"denn_curiosity","explanation":"Modal-particle *denn* in a question softens it and signals curiosity. Different from coordinating *denn* = *because*."},{"id":"tricky_denn_because_001","kind":"choice","prompt":"Ich bleibe zu Hause, denn ich bin müde. (denn means…)","options":["because (coordinating)","although","so that"],"answer":"because (coordinating)","topic":"denn_because","explanation":"Coordinating *denn* = *because* — note that the clause keeps verb-second order, unlike *weil*."},{"id":"tricky_wohl_probably_001","kind":"choice","prompt":"Er ist wohl krank. (wohl means…)","options":["definitely","probably / I suppose","never"],"answer":"probably / I suppose","topic":"wohl_probably","explanation":"*wohl* meaning *probably* — a hedged guess about the situation. Different from *wohl* in a question expressing wonder or disbelief."},{"id":"tricky_wohl_wonder_001","kind":"choice","prompt":"Was meint er wohl damit? (wohl means…)","options":["obviously","I wonder","never"],"answer":"I wonder","topic":"wohl_wonder","explanation":"*wohl* in a question marks musing = *I wonder*. Different from declarative *wohl* = *probably*."},{"id":"tricky_nach_to_001","kind":"choice","prompt":"Ich fahre nach Zürich. (nach means…)","options":["to","after","according to"],"answer":"to","topic":"nach_to","explanation":"*nach* + city/country = *to* (directional). Different from *nach* + dative time = *after*, or *nach + Meinung* = *according to*."},{"id":"tricky_nach_after_001","kind":"choice","prompt":"Nach dem Essen gehen wir spazieren. (nach means…)","options":["before","to","after"],"answer":"after","topic":"nach_after","explanation":"*nach* + dative for time *after*. Different from *nach* + city = *to*, or *nach + Meinung* = *according to*."},{"id":"tricky_nach_according_to_001","kind":"choice","prompt":"Meiner Meinung nach ist das falsch. (nach means…)","options":["to","according to","after"],"answer":"according to","topic":"nach_according_to","explanation":"Postposed *nach* in *Meinung nach* = *according to*. Different from *nach* + city = *to* or *nach* + time = *after*."},{"id":"tricky_nach_to_002","kind":"choice","prompt":"Wir fahren nach Hause. (nach means…)","options":["at home","to (home)","from home"],"answer":"to (home)","topic":"nach_to","explanation":"Idiomatic *nach Hause* = *(to) home* — direction. Different from locative *zu Hause* = *at home*, or *nach* = *after*."},{"id":"tricky_somit_therefore_001","kind":"choice","prompt":"Ich bin krank, somit kann ich nicht zur Arbeit kommen. (somit means…)","options":["because","therefore / thus","although"],"answer":"therefore / thus","topic":"somit_therefore","explanation":"*somit* drawing a logical conclusion = *therefore / thus*. Different from causal *weil* / *denn* = *because*, which give a reason rather than a result."},{"id":"tricky_somit_with_that_001","kind":"choice","prompt":"Alle Tests sind bestanden. Somit ist das Projekt abgeschlossen. (somit means…)","options":["afterwards","with that / and so","however"],"answer":"with that / and so","topic":"somit_with_that","explanation":"*somit* linking a closing consequence = *with that / and so*. Different from purely logical *somit* = *therefore*, this one wraps up a sequence."},{"id":"tricky_sowieso_anyway_001","kind":"choice","prompt":"Keine Sorge, ich komme sowieso vorbei. (sowieso means…)","options":["anyway / in any case","maybe later","of course not"],"answer":"anyway / in any case","topic":"sowieso_anyway","explanation":"*sowieso* = *anyway / in any case* — the action is happening regardless. Different from *sowieso* implying obvious shared knowledge."},{"id":"tricky_sowieso_obviously_001","kind":"choice","prompt":"Das weiß ich sowieso schon. (sowieso means…)","options":["barely","of course / obviously","almost"],"answer":"of course / obviously","topic":"sowieso_obviously","explanation":"*sowieso* here = *of course / obviously already*, dismissing the info as redundant. Different from plan-related *sowieso* = *I was going to anyway*."},{"id":"tricky_trotzdem_nevertheless_001","kind":"choice","prompt":"Es regnet, trotzdem gehe ich spazieren. (trotzdem means…)","options":["therefore","nevertheless / anyway","because"],"answer":"nevertheless / anyway","topic":"trotzdem_nevertheless","explanation":"*trotzdem* = *nevertheless* — going ahead despite an obstacle. Different from causal *deshalb* = *therefore*, which would mean rain made you go."},{"id":"tricky_trotzdem_all_the_same_001","kind":"choice","prompt":"Das war nicht nötig, aber trotzdem danke! (trotzdem means…)","options":["still / all the same","first","because"],"answer":"still / all the same","topic":"trotzdem_all_the_same","explanation":"*trotzdem* softened to *all the same / still* — gratitude despite the gift being unnecessary. Different from the stronger contrastive *trotzdem* = *nevertheless*."},{"id":"tricky_allerdings_however_001","kind":"choice","prompt":"Das Essen war gut, allerdings war es teuer. (allerdings means…)","options":["therefore","however / but","for example"],"answer":"however / but","topic":"allerdings_however","explanation":"*allerdings* introducing a qualification = *however / but*. Different from emphatic *allerdings!* = *absolutely!* as a standalone reply."},{"id":"tricky_allerdings_admittedly_001","kind":"choice","prompt":"Allerdings muss ich zugeben, dass er recht hat. (allerdings means…)","options":["admittedly","surprisingly","never"],"answer":"admittedly","topic":"allerdings_admittedly","explanation":"Sentence-initial *allerdings* conceding a point = *admittedly*. Different from mid-sentence *allerdings* = *however*, or exclamatory *allerdings!* = *absolutely!*."},{"id":"tricky_allerdings_absolutely_001","kind":"choice","prompt":"— Kommst du zur Party? — Allerdings! (allerdings means…)","options":["maybe","absolutely!","no chance"],"answer":"absolutely!","topic":"allerdings_absolutely","explanation":"Standalone *Allerdings!* as a reply = *absolutely!* — emphatic agreement. Different from connective *allerdings* = *however / admittedly*."},{"id":"tricky_zwar_admittedly_001","kind":"choice","prompt":"Er ist zwar klug, aber faul. (zwar means…)","options":["already","admittedly / it's true that","never"],"answer":"admittedly / it's true that","topic":"zwar_admittedly","explanation":"*zwar* meaning *admittedly* — paired with a later *aber* in the classic *zwar … aber …* construction. Different from *und zwar* = *specifically*."},{"id":"tricky_zwar_admittedly_002","kind":"choice","prompt":"Ich habe zwar wenig Zeit, aber ich helfe dir trotzdem. (zwar means…)","options":["a lot","granted / true","sometimes"],"answer":"granted / true","topic":"zwar_admittedly","explanation":"*zwar* conceding before an *aber* = *granted / true*. Different from *und zwar* = *namely / specifically*."},{"id":"tricky_zwar_specifically_001","kind":"choice","prompt":"Ich komme, und zwar morgen früh. (zwar means…)","options":["maybe","specifically / to be exact","never"],"answer":"specifically / to be exact","topic":"zwar_specifically","explanation":"*und zwar* introducing a specification = *specifically / to be exact*. Different from concessive *zwar … aber …* = *admittedly … but …*."},{"id":"tricky_naemlich_namely_001","kind":"choice","prompt":"Ich habe nur ein Problem, nämlich die Miete. (nämlich means…)","options":["namely / specifically","except","and also"],"answer":"namely / specifically","topic":"naemlich_namely","explanation":"*nämlich* spelling out a specific case = *namely*. Different from causal mid-sentence *nämlich* = *because / you see*."},{"id":"tricky_naemlich_because_001","kind":"choice","prompt":"Er kommt heute nicht. Er ist nämlich krank. (nämlich means…)","options":["namely","because / you see","also"],"answer":"because / you see","topic":"naemlich_because","explanation":"Mid-sentence *nämlich* gives an explanation = *because / you see*. Different from *nämlich* introducing a specific item = *namely*."},{"id":"tricky_eben_simply_001","kind":"choice","prompt":"So ist es eben. (eben means…)","options":["simply / just the way it is","not","again"],"answer":"simply / just the way it is","topic":"eben_simply","explanation":"Modal-particle *eben* expressing resignation = *simply / that's just how it is*. Compare temporal *eben* = *just now* or agreement *eben!* = *exactly!*."},{"id":"tricky_eben_just_now_001","kind":"choice","prompt":"Er ist eben angekommen. (eben means…)","options":["just now","never","slowly"],"answer":"just now","topic":"eben_just_now","explanation":"*eben* meaning *just now* (temporal). Compare *eben* meaning *exactly* (agreement) or *simply* (resignation)."},{"id":"tricky_eben_exactly_001","kind":"choice","prompt":"— Das ist unfair! — Eben! (eben means…)","options":["nonsense!","exactly!","maybe!"],"answer":"exactly!","topic":"eben_exactly","explanation":"Standalone *Eben!* = *exactly!* — emphatic agreement. Different from temporal *eben* = *just now* or resigned *eben* = *simply*."},{"id":"tricky_halt_simply_001","kind":"choice","prompt":"Das ist halt so in der Schweiz. (halt means…)","options":["simply / just the way it is","never","sometimes"],"answer":"simply / just the way it is","topic":"halt_simply","explanation":"Modal-particle *halt* (Southern German / Swiss equivalent of *eben*) expressing resignation = *that's just how it is*. Different from the imperative *Halt!* = *stop!*."},{"id":"tricky_halt_stop_001","kind":"choice","prompt":"Halt! Nicht weitergehen! (halt means…)","options":["hello","stop!","wait maybe"],"answer":"stop!","topic":"halt_stop","explanation":"Imperative *Halt!* = *stop!* — from the verb *halten*. Different from modal-particle *halt* = *simply / just the way it is*."},{"id":"tricky_eigentlich_actually_001","kind":"choice","prompt":"Was machst du eigentlich beruflich? (eigentlich means…)","options":["usually","actually / by the way","rarely"],"answer":"actually / by the way","topic":"eigentlich_actually","explanation":"Modal-particle *eigentlich* in a question = *actually / by the way*, broaching a new topic. Different from *eigentlich* = *originally* or *strictly speaking*."},{"id":"tricky_eigentlich_originally_001","kind":"choice","prompt":"Eigentlich wollte ich kommen, aber ich bin krank. (eigentlich means…)","options":["always","originally / I meant to","never"],"answer":"originally / I meant to","topic":"eigentlich_originally","explanation":"*eigentlich* + *wollte* = *originally / I had meant to* — a plan that didn't happen. Different from conversational *eigentlich* = *by the way*."},{"id":"tricky_eigentlich_strictly_speaking_001","kind":"choice","prompt":"Das ist eigentlich nicht erlaubt. (eigentlich means…)","options":["definitely","strictly speaking","probably"],"answer":"strictly speaking","topic":"eigentlich_strictly_speaking","explanation":"*eigentlich* qualifying a rule = *strictly speaking* (with an implied *but*). Different from *eigentlich* = *originally* or conversational *eigentlich* = *by the way*."},{"id":"tricky_sonst_otherwise_001","kind":"choice","prompt":"Beeil dich, sonst verpassen wir den Zug. (sonst means…)","options":["otherwise","however","first"],"answer":"otherwise","topic":"sonst_otherwise","explanation":"*sonst* meaning *otherwise* (consequence of not acting). Compare *sonst* = *else / any other* in questions, or *sonst* = *usually*."},{"id":"tricky_sonst_else_001","kind":"choice","prompt":"Haben Sie sonst noch Fragen? (sonst means…)","options":["again","any other / else","never"],"answer":"any other / else","topic":"sonst_else","explanation":"*sonst noch* in a question = *any other / else*. Different from *sonst* = *otherwise* (consequence) or *sonst* = *usually*."},{"id":"tricky_sonst_usually_001","kind":"choice","prompt":"Sonst trinke ich keinen Kaffee, aber heute brauche ich einen. (sonst means…)","options":["otherwise","usually / normally","finally"],"answer":"usually / normally","topic":"sonst_usually","explanation":"*sonst* contrasted with *heute* = *usually / normally*. Different from *sonst* = *otherwise* (warning) or *sonst* = *else*."},{"id":"tricky_ueberhaupt_at_all_001","kind":"choice","prompt":"Ich verstehe das überhaupt nicht. (überhaupt means…)","options":["at all","again","sometimes"],"answer":"at all","topic":"ueberhaupt_at_all","explanation":"*überhaupt* meaning *at all* — emphasising a negation. Different from *überhaupt* meaning *in general* or *in the first place*."},{"id":"tricky_ueberhaupt_even_001","kind":"choice","prompt":"Warst du überhaupt dort? (überhaupt means…)","options":["even / in the first place","already","still"],"answer":"even / in the first place","topic":"ueberhaupt_even","explanation":"*überhaupt* in a question challenging a premise = *even / in the first place*. Different from negation-intensifying *überhaupt* = *at all*."},{"id":"tricky_ueberhaupt_in_general_001","kind":"choice","prompt":"Überhaupt finde ich das eine gute Idee. (überhaupt means…)","options":["in general / on the whole","at least","barely"],"answer":"in general / on the whole","topic":"ueberhaupt_in_general","explanation":"Sentence-initial *überhaupt* = *in general / on the whole*. Different from negation-intensifying *überhaupt* = *at all*."},{"id":"tricky_ohnehin_anyway_001","kind":"choice","prompt":"Keine Sorge, ich gehe ohnehin einkaufen. (ohnehin means…)","options":["therefore","anyway / in any case","never"],"answer":"anyway / in any case","topic":"ohnehin_anyway","explanation":"*ohnehin* = *anyway / in any case* — the action is happening regardless. Near-synonym of *sowieso*. Different from *ohnehin* = *already / as it is*."},{"id":"tricky_ohnehin_already_001","kind":"choice","prompt":"Er ist ohnehin spät dran. (ohnehin means…)","options":["already / as it is","maybe","never"],"answer":"already / as it is","topic":"ohnehin_already","explanation":"*ohnehin* describing an existing situation = *already / as it is*. Different from plan-related *ohnehin* = *anyway*, this stresses the current state."},{"id":"tricky_jedenfalls_in_any_case_001","kind":"choice","prompt":"Ich komme jedenfalls. (jedenfalls means…)","options":["never","in any case / at any rate","therefore"],"answer":"in any case / at any rate","topic":"jedenfalls_in_any_case","explanation":"*jedenfalls* = *in any case / at any rate* — committing to an action regardless. Different from narrowing *jedenfalls* = *at least* (limiting a claim)."},{"id":"tricky_jedenfalls_at_least_001","kind":"choice","prompt":"Er hat es jedenfalls versucht. (jedenfalls means…)","options":["at least / anyway (narrowing claim)","first","definitely"],"answer":"at least / anyway (narrowing claim)","topic":"jedenfalls_at_least","explanation":"*jedenfalls* narrowing the scope of a claim = *at least he tried (whatever else is true)*. Different from commitment-style *jedenfalls* = *in any case*."},{"id":"tricky_immerhin_consolation_001","kind":"choice","prompt":"Es regnet, aber immerhin ist es warm. (immerhin means…)","options":["at least / after all (consolation)","always","barely"],"answer":"at least / after all (consolation)","topic":"immerhin_consolation","explanation":"*immerhin* as a silver lining = *at least* (consolation). Different from *immerhin* = *after all / considering*, which justifies leniency."},{"id":"tricky_immerhin_after_all_001","kind":"choice","prompt":"Immerhin ist er noch ein Kind. (immerhin means…)","options":["against expectation","after all / considering","never"],"answer":"after all / considering","topic":"immerhin_after_all","explanation":"*immerhin* introducing a mitigating fact = *after all / considering*. Different from *immerhin* offering a silver lining = *at least*."},{"id":"tricky_vielleicht_maybe_001","kind":"choice","prompt":"Vielleicht kommt er morgen. (vielleicht means…)","options":["definitely","maybe / perhaps","never"],"answer":"maybe / perhaps","topic":"vielleicht_maybe","explanation":"*vielleicht* meaning *maybe*. Modal-particle *vielleicht* can also express exasperation in exclamations or soften a suggestion."},{"id":"tricky_vielleicht_suggestion_001","kind":"choice","prompt":"Gehen wir vielleicht ins Kino? (vielleicht means…)","options":["definitely","maybe (suggestion softener)","again"],"answer":"maybe (suggestion softener)","topic":"vielleicht_suggestion","explanation":"Modal-particle *vielleicht* softening a proposal = *maybe we should …*. Different from epistemic *vielleicht* = *maybe / perhaps*."},{"id":"tricky_vielleicht_exclamation_001","kind":"choice","prompt":"Das ist vielleicht eine Frechheit! (vielleicht means…)","options":["maybe","quite some / really (exclamation)","not at all"],"answer":"quite some / really (exclamation)","topic":"vielleicht_exclamation","explanation":"Exclamatory *vielleicht* = *what a / really* — intensifying outrage, not hedging. Different from literal *vielleicht* = *maybe*."},{"id":"tricky_gerade_just_now_001","kind":"choice","prompt":"Er ist gerade angekommen. (gerade means…)","options":["never","just now / right now","eventually"],"answer":"just now / right now","topic":"gerade_just_now","explanation":"*gerade* meaning *just now / right now* — actions in progress at the moment of speech. Different from emphatic *gerade* = *exactly* or adjectival *gerade* = *straight*."},{"id":"tricky_gerade_exactly_001","kind":"choice","prompt":"Gerade das wollte ich sagen. (gerade means…)","options":["maybe","exactly / precisely (emphatic)","never"],"answer":"exactly / precisely (emphatic)","topic":"gerade_exactly","explanation":"Emphatic *gerade* highlighting a specific thing = *exactly / precisely that*. Different from temporal *gerade* = *just now*."},{"id":"tricky_gerade_straight_001","kind":"choice","prompt":"Der Weg ist gerade. (gerade means…)","options":["straight (geometric)","crooked","right now"],"answer":"straight (geometric)","topic":"gerade_straight","explanation":"*gerade* as an adjective/adverb = *straight*. Different from temporal *gerade* = *just now*."},{"id":"tricky_gerade_of_all_001","kind":"choice","prompt":"Warum gerade ich? (gerade means…)","options":["of all people (emphatic)","always","never"],"answer":"of all people (emphatic)","topic":"gerade_of_all","explanation":"*gerade* emphasising an unwelcome choice = *of all people*. Different from temporal *gerade* = *just now* or geometric *gerade* = *straight*."},{"id":"tricky_gleich_right_away_001","kind":"choice","prompt":"Ich komme gleich. (gleich means…)","options":["never","right away / in a moment","yesterday"],"answer":"right away / in a moment","topic":"gleich_right_away","explanation":"Temporal *gleich* = *right away / in a moment*. Different from comparative *gleich* = *the same* or idiomatic *mir gleich* = *doesn't matter*."},{"id":"tricky_gleich_same_001","kind":"choice","prompt":"Wir sind gleich alt. (gleich means…)","options":["the same age","already old","rarely"],"answer":"the same age","topic":"gleich_same","explanation":"*gleich* as a comparative adjective = *the same*. Different from temporal *gleich* = *in a moment*."},{"id":"tricky_gleich_doesnt_matter_001","kind":"choice","prompt":"Das ist mir gleich. (gleich means…)","options":["painful","all the same / doesn't matter","interesting"],"answer":"all the same / doesn't matter","topic":"gleich_doesnt_matter","explanation":"Idiomatic *mir gleich* = *all the same to me / doesn't matter*. Different from temporal *gleich* = *right away* or comparative *gleich* = *the same*."},{"id":"tricky_sogar_even_001","kind":"choice","prompt":"Er kann sogar Chinesisch. (sogar means…)","options":["never","even (adds surprise)","rarely"],"answer":"even (adds surprise)","topic":"sogar_even","explanation":"*sogar* adding a surprising extra = *even*. Compare *noch* = *even* (intensifying a comparative); *sogar* spotlights an unexpected item."},{"id":"tricky_sogar_even_002","kind":"choice","prompt":"Heute ist es sogar besser als gestern. (sogar means…)","options":["finally","even (intensifying comparative)","barely"],"answer":"even (intensifying comparative)","topic":"sogar_even","explanation":"*sogar* before a comparative = *even (better)*, marking surprise at the degree. Compare *noch besser* = *still better*, a more neutral intensifier."},{"id":"tricky_einfach_just_001","kind":"choice","prompt":"Du denkst zu viel — mach es einfach! (einfach means…)","options":["with difficulty","just do it (modal particle)","never"],"answer":"just do it (modal particle)","topic":"einfach_just","explanation":"Modal-particle *einfach* = *just (do it)* — urging direct action. Different from adjectival *einfach* = *easy* or ticket *einfach* = *one-way*."},{"id":"tricky_einfach_easy_001","kind":"choice","prompt":"Dieses Problem ist ziemlich einfach. (einfach means…)","options":["easy (not difficult)","just","one-way"],"answer":"easy (not difficult)","topic":"einfach_easy","explanation":"Adjectival *einfach* = *easy / simple*. Different from modal-particle *einfach* = *just (do it)* or ticket *einfach* = *one-way*."},{"id":"tricky_einfach_one_way_001","kind":"choice","prompt":"Eine einfache Fahrt nach Bern, bitte. (einfach means…)","options":["easy","one-way","expensive"],"answer":"one-way","topic":"einfach_one_way","explanation":"*einfache Fahrt* = *one-way trip* (vs. *Hin- und Rückfahrt*). Different from adjectival *einfach* = *easy* or modal-particle *einfach* = *just*."},{"id":"tricky_lediglich_merely_001","kind":"choice","prompt":"Es war lediglich ein Missverständnis. (lediglich means…)","options":["finally","merely / just","never"],"answer":"merely / just","topic":"lediglich_merely","explanation":"*lediglich* = *merely / just*, downplaying the seriousness — a formal cousin of *nur*. Different from softening *lediglich* used to make a request modest."},{"id":"tricky_lediglich_softening_001","kind":"choice","prompt":"Ich möchte lediglich eine Frage stellen. (lediglich means…)","options":["definitely","just / only (softening)","always"],"answer":"just / only (softening)","topic":"lediglich_softening","explanation":"*lediglich* softening a request = *just / only* — formal politeness marker. Different from dismissive *lediglich* = *merely* (downplaying an event)."},{"id":"tricky_wenigstens_at_least_001","kind":"choice","prompt":"Wenigstens du bist da! (wenigstens means…)","options":["finally","at least (relief)","maybe"],"answer":"at least (relief)","topic":"wenigstens_at_least","explanation":"*wenigstens* expressing relief = *at least* (small comfort). Different from *wenigstens* as a bare-minimum demand, and from quantitative *mindestens* = *at least N*."},{"id":"tricky_wenigstens_bare_minimum_001","kind":"choice","prompt":"Sag wenigstens Hallo! (wenigstens means…)","options":["also","at least (bare minimum ask)","never"],"answer":"at least (bare minimum ask)","topic":"wenigstens_bare_minimum","explanation":"*wenigstens* demanding the bare minimum = *at least say hello*. Different from consoling *wenigstens* = *at least (relief)*, and from numerical *mindestens*."},{"id":"tricky_mindestens_at_least_001","kind":"choice","prompt":"Das kostet mindestens 100 Euro. (mindestens means…)","options":["at least (quantitative)","at most","usually"],"answer":"at least (quantitative)","topic":"mindestens_at_least","explanation":"*mindestens* = *at least* with numbers — a lower bound. Different from emotional *wenigstens* = *at least (relief / minimum ask)*."},{"id":"tricky_mindestens_at_least_002","kind":"choice","prompt":"Wir brauchen mindestens drei Stunden. (mindestens means…)","options":["at most","at least (time/quantity)","never"],"answer":"at least (time/quantity)","topic":"mindestens_at_least","explanation":"*mindestens* with a duration = *at least N hours* — a quantitative floor. Different from emotive *wenigstens* = *at least (relief)*."}]},{"id":"vocabulary","name":"Vocabulary","icon":"📖","color":"#8b5cf6","description":"A1/A2 German vocabulary: gender, German→English, and English→German.","items":[{"id":"vocab_gender_mann","kind":"choice","prompt":"Mann","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Mann* — most male persons are masculine, no surprise."},{"id":"vocab_gender_hund","kind":"choice","prompt":"Hund","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Hund* — most larger animals default to masculine in German."},{"id":"vocab_gender_apfel","kind":"choice","prompt":"Apfel","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Apfel* — fruit names are mostly feminine, but *Apfel* is the classic exception."},{"id":"vocab_gender_tisch","kind":"choice","prompt":"Tisch","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Tisch* — common collocation *am Tisch sitzen* (to sit at the table)."},{"id":"vocab_gender_stuhl","kind":"choice","prompt":"Stuhl","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Stuhl* — pairs with *der Tisch*; plural is *die Stühle* with umlaut."},{"id":"vocab_gender_garten","kind":"choice","prompt":"Garten","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Garten* — collocation *im Garten arbeiten* (to work in the garden)."},{"id":"vocab_gender_tag","kind":"choice","prompt":"Tag","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: days of the week, months, and seasons are all masculine — *der Tag, der Montag, der Sommer*."},{"id":"vocab_gender_bruder","kind":"choice","prompt":"Bruder","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Bruder* — male family members are masculine; plural *die Brüder*."},{"id":"vocab_gender_vater","kind":"choice","prompt":"Vater","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Vater* — male family role; plural *die Väter* takes umlaut."},{"id":"vocab_gender_lehrer","kind":"choice","prompt":"Lehrer","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *-er* agent nouns are typically masculine — *der Lehrer* = (male) teacher."},{"id":"vocab_gender_kaffee","kind":"choice","prompt":"Kaffee","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Kaffee* — most hot drinks are masculine (*der Tee*, *der Kakao*)."},{"id":"vocab_gender_bahnhof","kind":"choice","prompt":"Bahnhof","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: compound takes the gender of its last part — *der Hof* → *der Bahnhof*."},{"id":"vocab_gender_frau","kind":"choice","prompt":"Frau","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Frau* — female persons are feminine, no surprise."},{"id":"vocab_gender_katze","kind":"choice","prompt":"Katze","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Katze* is the generic word for cat; the male is *der Kater*."},{"id":"vocab_gender_lampe","kind":"choice","prompt":"Lampe","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: most nouns ending in *-e* are feminine — *die Lampe, die Tasche, die Blume*."},{"id":"vocab_gender_tuer","kind":"choice","prompt":"Tür","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Tür* — collocation *die Tür öffnen / schließen* (to open / close the door)."},{"id":"vocab_gender_strasse","kind":"choice","prompt":"Straße","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: nouns ending in *-e* are typically feminine — *die Straße* (street, road)."},{"id":"vocab_gender_schule","kind":"choice","prompt":"Schule","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *-e* ending makes it feminine — *die Schule*; *in die Schule gehen* (to go to school)."},{"id":"vocab_gender_mutter","kind":"choice","prompt":"Mutter","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Mutter* — female family role; plural *die Mütter* with umlaut."},{"id":"vocab_gender_schwester","kind":"choice","prompt":"Schwester","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Schwester* — female family member; pairs with *der Bruder*."},{"id":"vocab_gender_milch","kind":"choice","prompt":"Milch","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Milch* — just memorize; uncountable in everyday use."},{"id":"vocab_gender_uhr","kind":"choice","prompt":"Uhr","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Uhr* — also used for clock time, as in *Wie viel Uhr ist es?*"},{"id":"vocab_gender_familie","kind":"choice","prompt":"Familie","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *-ie* ending is reliably feminine — *die Familie, die Industrie, die Linie*."},{"id":"vocab_gender_kind","kind":"choice","prompt":"Kind","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Kind* — children are grammatically neuter regardless of biological sex."},{"id":"vocab_gender_buch","kind":"choice","prompt":"Buch","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Buch* — plural *die Bücher* with umlaut and *-er*."},{"id":"vocab_gender_auto","kind":"choice","prompt":"Auto","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Auto* — short for *das Automobil*; most *-o* loanwords are neuter."},{"id":"vocab_gender_haus","kind":"choice","prompt":"Haus","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Haus* — collocation *nach Hause gehen* (to go home); plural *die Häuser*."},{"id":"vocab_gender_brot","kind":"choice","prompt":"Brot","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Brot* — most basic foods just need to be memorized."},{"id":"vocab_gender_wasser","kind":"choice","prompt":"Wasser","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Wasser* — like many liquids and elements, neuter by default."},{"id":"vocab_gender_fenster","kind":"choice","prompt":"Fenster","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Fenster* — exception to the *-er* masculine rule (it is not an agent noun)."},{"id":"vocab_gender_fahrrad","kind":"choice","prompt":"Fahrrad","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: compound takes gender of the last part — *das Rad* → *das Fahrrad*."},{"id":"vocab_gender_hotel","kind":"choice","prompt":"Hotel","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Hotel* — most foreign loanwords ending in *-el* are neuter."},{"id":"vocab_apfel_en","kind":"text","prompt":"Apfel","answer":"apple","alts":["the apple","an apple","Apple"],"topic":"vocab_a1_food","explanation":"Noun: *der Apfel* (masculine) — plural *die Äpfel* takes umlaut."},{"id":"vocab_brot_en","kind":"text","prompt":"Brot","answer":"bread","alts":["the bread","Bread"],"topic":"vocab_a1_food","explanation":"Noun: *das Brot* (neuter) — a *Brötchen* is a small bread roll."},{"id":"vocab_kaese_en","kind":"text","prompt":"Käse","answer":"cheese","alts":["the cheese","Cheese"],"topic":"vocab_a1_food","explanation":"Noun: *der Käse* (masculine) — usually uncountable, like English *cheese*."},{"id":"vocab_milch_en","kind":"text","prompt":"Milch","answer":"milk","alts":["the milk","Milk"],"topic":"vocab_a1_food","explanation":"Noun: *die Milch* (feminine) — uncountable; collocation *ein Glas Milch*."},{"id":"vocab_wasser_en","kind":"text","prompt":"Wasser","answer":"water","alts":["the water","Water"],"topic":"vocab_a1_food","explanation":"Noun: *das Wasser* (neuter) — common request *ein Glas Wasser, bitte*."},{"id":"vocab_haus_en","kind":"text","prompt":"Haus","answer":"house","alts":["the house","House"],"topic":"vocab_a1_home","explanation":"Noun: *das Haus* (neuter) — fixed phrase *nach Hause* (toward home)."},{"id":"vocab_tisch_en","kind":"text","prompt":"Tisch","answer":"table","alts":["the table","Table"],"topic":"vocab_a1_home","explanation":"Noun: *der Tisch* (masculine) — collocation *am Tisch* (at the table)."},{"id":"vocab_stuhl_en","kind":"text","prompt":"Stuhl","answer":"chair","alts":["the chair","Chair"],"topic":"vocab_a1_home","explanation":"Noun: *der Stuhl* (masculine) — plural *die Stühle*; contrast with *der Sessel* (armchair)."},{"id":"vocab_buch_en","kind":"text","prompt":"Buch","answer":"book","alts":["the book","Book"],"topic":"vocab_a1_school","explanation":"Noun: *das Buch* (neuter) — plural *die Bücher* with umlaut and *-er*."},{"id":"vocab_schule_en","kind":"text","prompt":"Schule","answer":"school","alts":["the school","School"],"topic":"vocab_a1_school","explanation":"Noun: *die Schule* (feminine) — *in die Schule gehen* (to go to school), no article in English idiom."},{"id":"vocab_mut <script>(function (global) {
  const DECK_KEY_PREFIX = 'gd_deck_';
  const GLOBAL_KEY = 'gd_global';
  const MIGRATED_MARKER = 'migrated_to_idb';

  let storageMap = new Map();
  let backend = null;
  let initPromise = null;
  let degraded = false;

  function ls() { return global.localStorage; }

  function isManagedKey(k) {

  function makeIdbBackend() {

    const STORE = 'kv';
    const VERSION = 1;

    function open() {

          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);

        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('indexedDB open blocked'));
      });
      return dbPromise;
    }

    function hydrate() {
      return open().then(db => new Promise((resolve, reject) => {
        const map = new Map();
        const tx = db.transaction(STORE, 'readonly');
        const store = tx.objectStore(STORE);
        const req = store.openCursor();
        req.onsuccess = () => {
          const c = req.result;
          if (!c) { resolve(map); return; }
          try {
            const v = typeof c.value === 'string' ? JSON.parse(c.value) : c.value;
            map.set(c.key, v);
          } catch (err) {
            console.warn('[gd-storage] malformed value on hydrate, key:', c.key, err);
          }
          c.continue();
        };
        req.onerror = () => reject(req.error);
      }));
    }

    function putOnce(key, value) {
      return open().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('transaction aborted'));
        tx.objectStore(STORE).put(JSON.stringify(value), key);
      }));
    }

    function put(key, value) {
      return putOnce(key, value).catch(err => {
        console.warn('[gd-storage] idb put failed, retrying in 500ms:', key, err);
        return new Promise(r => setTimeout(r, 500)).then(() => putOnce(key, value));
      }).catch(err => {
        console.warn('[gd-storage] idb put failed after retry:', key, err);
      });
    }

    function del(key) {
      return open().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.objectStore(STORE).delete(key);

  function makeLocalStorageBackend() {
    function hydrate() {
      const m = new Map();
      const store = ls();
      if (!store) return Promise.resolve(m);
      for (let i = 0; i < store.length; i++) {
        const k = store.key(i);
        if (!isManagedKey(k)) continue;
        try { m.set(k, JSON.parse(store.getItem(k))); }
        catch (err) { console.warn('[gd-storage] localStorage backend: malformed value, key:', k); }
      }
      return Promise.resolve(m);
    }
    function put(k, v) {
      try { ls().setItem(k, JSON.stringify(v)); } catch (err) { console.warn('[gd-storage] ls put failed:', k, err); }

    }
    function del(k) {
      try { ls().removeItem(k); } catch (err) { console.warn('[gd-storage] ls del failed:', k, err); }
      return Promise.resolve();
    }
    return { hydrate, put, del };

      if (p && typeof p.then === 'function') {

    }

    try {

      if (p && typeof p.catch === 'function') {
