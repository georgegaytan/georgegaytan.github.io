  /* ---------- pure logic (covered by tests/karteikasten.test.js) ---------- */

  // Progress keys on the German headword, not the card's position, so adding
  // or reordering cards in a lesson keeps the learner's progress intact.
  function keyOf(card) { return card[0]; }

  // Turns a stored record (or null) into a complete, valid state.
  function normalize(rec, lessons) {
    const r = rec || {};
    const known = {};
    if (r.known && typeof r.known === 'object') {
      for (const id of Object.keys(r.known)) {
        if (Array.isArray(r.known[id])) known[id] = r.known[id].filter(k => typeof k === 'string');
      }
    }
    return {
      lesson: lessons.some(l => l.id === r.lesson) ? r.lesson : lessons[0].id,
      dir: r.dir === 'en' ? 'en' : 'de',
      shuffle: r.shuffle !== false,
      known,
    };
  }

  // Counts the lesson's cards that are marked known. A stored key whose card
  // left the deck does not count.
  function knownCount(lesson, keys) {
    const k = new Set(keys);
    let n = 0;
    for (const c of lesson.cards) if (k.has(keyOf(c))) n++;
    return n;
  }

  // Fisher-Yates over a copy. `rnd` defaults to Math.random; tests inject one.
  function shuffle(arr, rnd) {
    const r = rnd || Math.random;
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  // Indices of the lesson's unknown cards, in book order or shuffled.
  function buildQueue(lesson, keys, shuffled, rnd) {
    const k = new Set(keys);
    const q = [];
    lesson.cards.forEach((c, i) => { if (!k.has(keyOf(c))) q.push(i); });
    return shuffled ? shuffle(q, rnd) : q;
  }

  function requeue(queue, i) {
    const out = queue.slice();
    out.splice(Math.min(AGAIN_GAP, out.length), 0, i);
    return out;
  }

  function markKnown(known, lesson, card) {
    const keys = known[lesson.id] || [];
    const k = keyOf(card);
    const out = Object.assign({}, known);
    out[lesson.id] = keys.includes(k) ? keys.slice() : keys.concat(k);
    return out;
  }

  function forget(known, lesson) {
    const out = Object.assign({}, known);
    delete out[lesson.id];
    return out;
  }

  function summarize(lessons, known) {
    let total = 0, n = 0;
    for (const l of lessons) {
      total += l.cards.length;
      n += knownCount(l, known[l.id] || []);
    }
    return { total, known: n, lessons: lessons.length };
  }

  /* ---------- persistence (through the app's storage seam) ---------- */

  function loadRecord() {
    const S = global.Storage;
    if (!S || !S.loadDeck) return null;
    return S.loadDeck(DECK_ID);
  }

  function save() {
    const S = global.Storage;
    if (!S || !S.saveDeck) return;
    S.saveDeck(DECK_ID, {
      deckId: DECK_ID, version: 1, kind: 'karteikasten',
      lesson: st.lesson, dir: st.dir, shuffle: st.shuffle, known: st.known,
    });
  }

  /* ---------- view ---------- */

  let view = null;          // the mounted root element, or null when closed
  let onCloseHook = null;
  let st = null;            // normalized state: { lesson, dir, shuffle, known }
  let queue = [];           // card indices still to show in this round
  let flipped = false;
  let card = null, front = null, back = null;
  let resetArmed = false;
  let resetTimer = null;

  function isOpen() { return view !== null; }
  function $k(id) { return view && view.querySelector('#' + id); }

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  function lessonIndex() { return LESSONS.findIndex(l => l.id === st.lesson); }
  function lesson() { return LESSONS[lessonIndex()]; }
  function knownKeys(L) { return st.known[L.id] || []; }

  function build() {
    queue = buildQueue(lesson(), knownKeys(lesson()), st.shuffle);
  }

  function renderBooks() {
    const box = $k('kk-books');
    box.textContent = '';
    for (const [book, label] of BOOKS) {
      const g = el('div');
      g.appendChild(el('div', 'kk-book-label', label));
      const row = el('div', 'kk-chips');
      LESSONS.forEach(L => {
        if (L.book !== book) return;
        const b = el('button', 'kk-chip');
        b.type = 'button';
        b.setAttribute('data-lesson', L.id);
        b.setAttribute('aria-pressed', String(L.id === st.lesson));
        b.setAttribute('aria-label', 'Lektion ' + L.n + ': ' + L.title);
        b.title = 'Lektion ' + L.n + ' · ' + L.title;
        b.appendChild(el('span', null, String(L.n)));
        const bar = el('span', 'kk-bar'), fill = el('i');
        fill.style.width = (100 * knownCount(L, knownKeys(L)) / L.cards.length) + '%';
        bar.appendChild(fill);
        b.appendChild(bar);
        row.appendChild(b);
      });
      g.appendChild(row);
      box.appendChild(g);
    }
  }

  function renderHead() {
    const L = lesson(), k = knownCount(L, knownKeys(L)), n = L.cards.length;
    $k('kk-eyebrow').textContent = 'Lektion ' + L.n + ' · ' + L.book;
    $k('kk-title').textContent = L.title;
    const c = $k('kk-count');
    c.textContent = '';
    c.append(el('strong', null, String(k)), ' von ' + n + ' gewusst');
    $k('kk-round').textContent = queue.length ? 'noch ' + queue.length + ' in dieser Runde' : '';
    $k('kk-bar').style.width = (100 * k / n) + '%';
    const dir = $k('kk-dir');
    dir.textContent = st.dir === 'de' ? 'Deutsch → Englisch' : 'Englisch → Deutsch';
    dir.setAttribute('aria-pressed', String(st.dir === 'en'));
    const shuf = $k('kk-shuf');
    shuf.textContent = st.shuffle ? 'Gemischt' : 'In Buchreihenfolge';
    shuf.setAttribute('aria-pressed', String(st.shuffle));
  }

  function faceHead(label, c) {
    const h = el('div', 'kk-face-head');
    h.appendChild(el('span', null, label));
    const b = el('span', 'kk-badges');
    if (c[5]) b.appendChild(el('span', 'kk-badge', 'CH'));
    h.appendChild(b);
    return h;
  }

  function germanFace(c, withRef) {
    const f = document.createDocumentFragment();
    f.appendChild(faceHead('Deutsch', c));
    const body = el('div', 'kk-face-body');
    body.appendChild(el('p', 'kk-word', c[0]));
    body.appendChild(el('p', 'kk-sentence', c[2]));
    if (c[4]) {
      const n = el('p', 'kk-note');
      n.append(el('b', null, 'Hinweis '), c[4]);
      body.appendChild(n);
    }
    if (withRef) body.appendChild(el('p', 'kk-ref', c[1]));
    f.appendChild(body);
    return f;
  }

  function englishFace(c, withRef) {
    const f = document.createDocumentFragment();
    f.appendChild(faceHead('English', c));
    const body = el('div', 'kk-face-body');
    body.appendChild(el('p', 'kk-word kk-en', c[1]));
    body.appendChild(el('p', 'kk-sentence kk-it', c[3]));
    if (withRef) body.appendChild(el('p', 'kk-ref', c[0]));
    f.appendChild(body);
    return f;
  }

  // Screen readers read only the face that is showing: the card's accessible
  // name comes from its content, and the hidden face is aria-hidden.
  function syncFaces() {
    card.classList.toggle('kk-flipped', flipped);
    front.setAttribute('aria-hidden', String(flipped));
    back.setAttribute('aria-hidden', String(!flipped));
  }

  function renderCard() {
    const study = $k('kk-study');
    if (!queue.length) { renderDone(); return; }
    if (!card.isConnected) {
      study.textContent = '';
      const stage = el('div', 'kk-stage');
      stage.appendChild(card);
      study.appendChild(stage);
    }
    const c = lesson().cards[queue[0]];
    // Turn the new card face-up without playing the flip animation backwards.
    card.classList.add('kk-no-anim');
    flipped = false;
    syncFaces();
    void card.offsetWidth;
    card.classList.remove('kk-no-anim');
    front.textContent = '';
    back.textContent = '';
    if (st.dir === 'de') { front.appendChild(germanFace(c, false)); back.appendChild(englishFace(c, true)); }
    else { front.appendChild(englishFace(c, false)); back.appendChild(germanFace(c, true)); }
    $k('kk-hint').hidden = false;
    renderActions();
  }

  function renderActions() {
    const a = $k('kk-actions');
    a.textContent = '';
    if (!queue.length) return;
    if (!flipped) {
      const b = el('button', 'kk-btn kk-flip', 'Umdrehen');
      b.type = 'button';
      b.setAttribute('data-act', 'flip');
      a.appendChild(b);
    } else {
      const again = el('button', 'kk-btn kk-again');
      again.type = 'button';
      again.setAttribute('data-act', 'again');
      again.append('Nochmal', el('small', null, 'kommt gleich wieder'));
      const good = el('button', 'kk-btn kk-good');
      good.type = 'button';
      good.setAttribute('data-act', 'good');
      good.append('Gewusst', el('small', null, 'aus dieser Runde'));
      a.append(again, good);
    }
  }

  function renderDone() {
    const L = lesson(), li = lessonIndex(), study = $k('kk-study');
    study.textContent = '';
    const d = el('div', 'kk-done');
    d.appendChild(el('h3', null, 'Lektion ' + L.n + ' geschafft'));
    d.appendChild(el('p', null, 'Du hast alle ' + L.cards.length + ' Karten als gewusst markiert.'));
    const row = el('div', 'kk-row');
    const again = el('button', 'kk-tool', 'Alle nochmal üben');
    again.type = 'button';
    again.setAttribute('data-act', 'restart');
    row.appendChild(again);
    if (li < LESSONS.length - 1) {
      const next = el('button', 'kk-tool', 'Weiter zu Lektion ' + LESSONS[li + 1].n);
      next.type = 'button';
      next.setAttribute('aria-pressed', 'true');
      next.setAttribute('data-lesson', LESSONS[li + 1].id);
      row.appendChild(next);
    }
    d.appendChild(row);
    study.appendChild(d);
    $k('kk-hint').hidden = true;
    $k('kk-actions').textContent = '';
  }

  function renderList() {
    const L = lesson(), k = new Set(knownKeys(L)), ul = $k('kk-list');
    $k('kk-listsum').textContent = 'Alle ' + L.cards.length + ' Wörter dieser Lektion';
    ul.textContent = '';
    if (!$k('kk-listbox').open) return;
    for (const c of L.cards) {
      const li = el('li');
      const de = el('span', k.has(keyOf(c)) ? 'kk-k' : null, c[0] + (c[5] ? '  · CH' : ''));
      li.append(de, el('span', null, c[1]));
      ul.appendChild(li);
    }
  }

  function renderAll() { renderBooks(); renderHead(); renderCard(); renderList(); }

  function flip() {
    if (!queue.length) return;
    flipped = !flipped;
    syncFaces();
    renderActions();
  }

  function answer(knew) {
    if (!flipped || !queue.length) return;
    const L = lesson(), i = queue.shift();
    if (knew) { st.known = markKnown(st.known, L, L.cards[i]); save(); }
    else queue = requeue(queue, i);
    renderBooks();
    renderHead();
    renderCard();
    if ($k('kk-listbox').open) renderList();
  }

  function restartLesson() {
    st.known = forget(st.known, lesson());
    save();
    build();
    renderAll();
  }

  function selectLesson(id) {
    st.lesson = id;
    save();
    disarmReset();
    build();
    renderAll();
    view.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function disarmReset() {
    resetArmed = false;
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    const b = $k('kk-reset');
    if (b) { b.textContent = 'Neu starten'; b.classList.remove('kk-warn'); }
  }

  function loadFonts() {
    if (document.getElementById('kk-fonts')) return;
    const l = document.createElement('link');
    l.id = 'kk-fonts';
    l.rel = 'stylesheet';
    l.href = FONTS_HREF;
    document.head.appendChild(l);
  }

  function onKey(ev) {
    if (!isOpen()) return;
    const t = ev.target;
    const tag = t && t.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (ev.key === 'Escape') { ev.preventDefault(); close(); return; }
    // Let buttons and the word list keep their native Enter/Space activation.
    if ((tag === 'BUTTON' || tag === 'SUMMARY') && (ev.key === ' ' || ev.key === 'Enter')) return;
    if (ev.key === ' ' || (ev.key === 'Enter' && t === card)) { ev.preventDefault(); flip(); }
    else if (ev.key === 'ArrowLeft' || ev.key === '1') answer(false);
    else if (ev.key === 'ArrowRight' || ev.key === '2') answer(true);
  }

  const SHELL =
    '<div class="kk-wrap">' +
      '<header class="kk-top">' +
        '<button type="button" class="kk-menu" id="kk-menu">← Menü</button>' +
        '<h1>B1 Karteikasten</h1>' +
        '<span class="kk-sub">Schritte plus Neu · Ausgabe Schweiz</span>' +
      '</header>' +
      '<nav class="kk-books" id="kk-books" aria-label="Lektion wählen"></nav>' +
      '<section class="kk-lhead" aria-live="polite">' +
        '<div class="kk-eyebrow" id="kk-eyebrow"></div>' +
        '<h2 id="kk-title"></h2>' +
        '<div class="kk-meta"><span id="kk-count"></span><span id="kk-round"></span></div>' +
        '<div class="kk-progress"><i id="kk-bar"></i></div>' +
        '<div class="kk-tools">' +
          '<button class="kk-tool" id="kk-dir" type="button"></button>' +
          '<button class="kk-tool" id="kk-shuf" type="button"></button>' +
          '<button class="kk-tool" id="kk-reset" type="button">Neu starten</button>' +
        '</div>' +
      '</section>' +
      '<section id="kk-study"></section>' +
      '<p class="kk-hint" id="kk-hint">Tippen zum Umdrehen · Leertaste, ← Nochmal, → Gewusst</p>' +
      '<div class="kk-actions" id="kk-actions"></div>' +
      '<details id="kk-listbox">' +
        '<summary id="kk-listsum"></summary>' +
        '<ul class="kk-list" id="kk-list"></ul>' +
      '</details>' +
    '</div>';

  function open(onClose) {
    if (view) return;
    onCloseHook = onClose || null;
    st = normalize(loadRecord(), LESSONS);
    loadFonts();
    view = document.createElement('div');
    view.id = 'kkView';
    view.innerHTML = SHELL;
    document.body.appendChild(view);
    document.body.classList.add('drill-open');

    card = el('div', 'kk-card');
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    front = el('article', 'kk-face kk-front');
    back = el('article', 'kk-face kk-back');
    card.append(front, back);
    card.addEventListener('click', flip);

    $k('kk-menu').onclick = () => close();
    $k('kk-books').addEventListener('click', ev => {
      const b = ev.target.closest('[data-lesson]');
      if (b) selectLesson(b.getAttribute('data-lesson'));
    });
    $k('kk-study').addEventListener('click', ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      if (b.getAttribute('data-act') === 'restart') restartLesson();
      else if (b.hasAttribute('data-lesson')) selectLesson(b.getAttribute('data-lesson'));
    });
    $k('kk-actions').addEventListener('click', ev => {
      const b = ev.target.closest('[data-act]');
      if (!b) return;
      const act = b.getAttribute('data-act');
      if (act === 'flip') flip();
      else answer(act === 'good');
    });
    $k('kk-dir').onclick = () => { st.dir = st.dir === 'de' ? 'en' : 'de'; save(); renderHead(); renderCard(); };
    $k('kk-shuf').onclick = () => { st.shuffle = !st.shuffle; save(); build(); renderHead(); renderCard(); };
    $k('kk-reset').onclick = () => {
      if (!resetArmed) {
        resetArmed = true;
        const b = $k('kk-reset');
        b.textContent = 'Fortschritt löschen? Tippen zum Bestätigen';
        b.classList.add('kk-warn');
        resetTimer = setTimeout(disarmReset, 4000);
        return;
      }
      disarmReset();
      restartLesson();
    };
    $k('kk-listbox').addEventListener('toggle', renderList);

    document.addEventListener('keydown', onKey);
    if (global.history && history.pushState) {
      history.pushState({ karteikasten: true }, '', '#karteikasten');
    }

    build();
    renderAll();
    // Move focus into the section. Otherwise focus stays on the menu button
    // behind the overlay, and Space presses that button instead of flipping
    // the card.
    (card.isConnected ? card : $k('kk-menu')).focus({ preventScroll: true });
  }

  function teardown() {
    document.removeEventListener('keydown', onKey);
    disarmReset();
    view.remove();
    view = null;
    card = front = back = null;
    document.body.classList.remove('drill-open');
    const hook = onCloseHook;
    onCloseHook = null;
    if (hook) hook();
  }

  function close() {
    if (!view) return;
    const pushed = global.history && history.state && history.state.karteikasten;
    teardown();
    if (pushed) history.back();
  }

  // Back-button support: engine-ui's popstate handler calls this after it has
  // ruled out an open drill. Tears down without touching history again.
  function handlePop() {
    if (!view) return false;
    teardown();
    return true;
  }

  // Summary for the menu entry, computed without mounting the view.
  function menuSummary() {
    return summarize(LESSONS, normalize(loadRecord(), LESSONS).known);
  }

  const Karteikasten = {
    DECK_ID, AGAIN_GAP, BOOKS, LESSONS,
    keyOf, normalize, knownCount, shuffle, buildQueue, requeue, markKnown, forget, summarize,
    open, close, isOpen, handlePop, menuSummary,
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = Karteikasten;
  } else {
    global.Karteikasten = Karteikasten;
  }
})(typeof window !== 'undefined' ? window : globalThis);

  const AIDED_INTERVAL_MULTIPLIER = 0.5;

  function srsUpdate(item, outcome) {
    const next = { box: item.box, ease: item.ease, interval: item.interval, lapses: item.lapses };
    if (outcome === 'correct') {
      next.box = item.box + 1;
      next.ease = Math.min(EASE_START, +(item.ease + EASE_GAIN_ON_RECALL).toFixed(2));
      next.interval = item.interval === 0
        ? 1
        : Math.max(1, Math.round(item.interval * item.ease));
    } else if (outcome === 'correct-aided') {
      // Aided recall still advances the box. It must: chips are shown at box
      // <= 1, so holding the box here made the ladder a closed loop - the card
      // could never reach box 2, never lose its chips, and never be mastered.
      // The halved interval is the penalty for needing the scaffold.
      next.box = item.box + 1;
      next.interval = item.interval === 0
        ? 1
        : Math.max(1, Math.round(item.interval * item.ease * AIDED_INTERVAL_MULTIPLIER));
    } else if (outcome === 'wrong') {
      next.box = 1;
      next.ease = Math.max(EASE_FLOOR, +(item.ease - EASE_DROP_ON_LAPSE).toFixed(2));
      next.interval = 1;
      next.lapses = item.lapses + 1;
    } else {
      throw new Error('unknown outcome: ' + outcome);
    }
    return next;
  }

  EngineCore.srsUpdate = srsUpdate;

  function normalizeAnswer(s, opts) {
    opts = opts || {};
    let out = String(s).trim().replace(/\s+/g, ' ');
    if (!opts.caseSensitive) out = out.toLowerCase();
    out = out
      .replace(/ae/g, 'ä')
      .replace(/oe/g, 'ö')
      .replace(/ue/g, 'ü')
      .replace(/ss/g, 'ß')
      .replace(/AE/g, 'Ä')
      .replace(/OE/g, 'Ö')
      .replace(/UE/g, 'Ü');

  function answersMatch(input, answer, alts, opts) {
    alts = alts || [];
    const candidates = [answer].concat(alts);

  EngineCore.normalizeAnswer = normalizeAnswer;
  EngineCore.answersMatch = answersMatch;

  // The complete combos a cloze accepts: the primary per-blank answers, plus
  // any authored acceptAny combos. The primary combo is included only when
  // every blank has a non-empty answer - with acceptAny an author may leave a
  // primary blank empty (validator C13's escape hatch), and an empty primary
  // would otherwise make an empty submission "correct".
  function clozeAcceptedCombos(item) {
    const blanks = item.blanks || [];
    const combos = [];
    const primary = blanks.map(b => b.answer);
    if (primary.length && primary.every(a => typeof a === 'string' && a.length > 0)) combos.push(primary);
    if (Array.isArray(item.acceptAny)) {
      for (const c of item.acceptAny) {
        if (Array.isArray(c) && c.length === blanks.length) combos.push(c);

  }
  EngineCore.clozeAcceptedCombos = clozeAcceptedCombos;

  // Does a set of typed values satisfy a cloze? Any accepted combo may match,
  // position by position. A blank's `alts` are alternatives for its *primary*
  // answer, so they apply at a position only when the combo expects that
  // primary answer there - not to whatever an acceptAny combo happens to put in
  // that slot. (The old UI code passed no alts at all on the acceptAny path.)
  function clozeMatches(item, values, opts) {
    const blanks = item.blanks || [];
    if (!Array.isArray(values) || values.length !== blanks.length) return false;
    return clozeAcceptedCombos(item).some(combo =>
      combo.every((expected, i) => {
        const b = blanks[i];
        const alts = (expected === b.answer && Array.isArray(b.alts)) ? b.alts : [];
        return answersMatch(values[i], expected, alts, opts);

  }
  EngineCore.clozeMatches = clozeMatches;

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const v0 = new Array(b.length + 1);
    const v1 = new Array(b.length + 1);
    for (let i = 0; i <= b.length; i++) v0[i] = i;
    for (let i = 0; i < a.length; i++) {
      v1[0] = i + 1;
      for (let j = 0; j < b.length; j++) {
        const cost = a[i] === b[j] ? 0 : 1;
        v1[j + 1] = Math.min(v1[j] + 1, v0[j + 1] + 1, v0[j] + cost);
      }
      for (let j = 0; j <= b.length; j++) v0[j] = v1[j];
    }
    return v1[b.length];
  }

  function rng(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  function selectDistractors(pool, answer, box, count, seed) {
    const ansKey = String(answer).toLowerCase();
    const eligible = pool.filter(p => String(p).toLowerCase() !== ansKey);
    if (eligible.length < count) {
      throw new Error('pool too small: need ' + count + ' distractors, have ' + eligible.length);
    }

    // Seed-derived tiebreaker keeps results deterministic but seed-varied.
    const rand = rng(seed);
    const tagged = eligible.map(p => ({ p, d: levenshtein(p, answer), tie: rand() }));

    let ranked;
    if (box >= 4) {
      // Adversarial: nearest first.
      ranked = tagged.slice().sort((a, b) => a.d - b.d || a.tie - b.tie);
    } else if (box <= 1) {
      // Easy: farthest first.
      ranked = tagged.slice().sort((a, b) => b.d - a.d || a.tie - b.tie);
    } else {
      // Middle: draw from the middle quartiles of the distance ranking,
      // then order by seed tiebreaker for variety across appearances.
      const byDist = tagged.slice().sort((a, b) => a.d - b.d || a.tie - b.tie);
      const start = Math.floor(byDist.length / 4);
      const end = Math.floor(byDist.length * 3 / 4);
      let mid = byDist.slice(start, end);
      if (mid.length < count) mid = byDist;
      mid.sort((a, b) => a.tie - b.tie);
      ranked = mid;
    }

    return ranked.slice(0, count).map(x => x.p);
  }

  EngineCore.selectDistractors = selectDistractors;
  EngineCore._levenshtein = levenshtein;

  // Fisher-Yates shuffle. rng defaults to Math.random so callers get fresh
  // variety each session; tests can pass a seeded rng for determinism.
  function shuffle(arr, rndFn) {
    const r = rndFn || Math.random;
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;

  EngineCore.shuffle = shuffle;

  function selectNextItem(deckState, today, options) {
    options = options || {};
    const sessionSeen = new Set(options.sessionSeen || []);
    const lastTopics = new Set(options.lastTopics || []);
    const newToday = options.newToday || 0;
    const newCap = options.newCap == null ? 5 : options.newCap;

    const items = deckState.items || {};
    const ids = Object.keys(items).filter(id => !sessionSeen.has(id));
    const rnd = options.rng || Math.random;

    function topicsDisjoint(id) {
      if (lastTopics.size === 0) return true;
      const ts = items[id].topics || [];
      for (const t of ts) if (lastTopics.has(t)) return false;
      return true;
    }

    // Each tier is shuffled before its priority sort so that items of equal
    // priority (same due date / same box / any new card) appear in a different
    // order every session instead of always following deck insertion order.
    // JS sort is stable, so the shuffle becomes the tiebreak.

    // Tier 1: overdue
    const overdue = shuffle(ids
      .filter(id => items[id].due && items[id].due <= today && items[id].box > 0), rnd)
      .sort((a, b) => items[a].due < items[b].due ? -1 : items[a].due > items[b].due ? 1 : 0);
    for (const id of overdue) if (topicsDisjoint(id)) return id;
    if (overdue.length) return overdue[0];

    // Tier 2: low-box not new, and not already seen today.
    // (The design calls this tier "low-box-not-seen-today". Previously the
    // "not seen today" part was enforced only via in-session sessionSeen, which
    // resets on every deck re-entry — so a card learned minutes ago, now due
    // tomorrow, would be served again the same day. lastSeen makes the
    // exclusion persist across sessions within the same day.)
    const lowBox = shuffle(ids
      .filter(id => items[id].box > 0 && items[id].box < 4)
      .filter(id => !(items[id].lastSeen && String(items[id].lastSeen).slice(0, 10) === today)), rnd)
      .sort((a, b) => items[a].box - items[b].box);
    for (const id of lowBox) if (topicsDisjoint(id)) return id;
    if (lowBox.length) return lowBox[0];

    if (newToday < newCap) {
      const fresh = shuffle(ids.filter(id => items[id].box === 0), rnd);
      for (const id of fresh) if (topicsDisjoint(id)) return id;
      if (fresh.length) return fresh[0];

    return null;
  }

  EngineCore.selectNextItem = selectNextItem;

  // Chip palette shown under a cloze at box 0/1.
  //
  // Two properties matter and neither is free:
  //   1. Every answer must survive the cap, so answers are seeded first.
  //   2. Each blank must get its own distractors. Taking the first N entries of
  //      the concatenated pools lets one large pool (say 15 participles) crowd
  //      out another blank's entirely, leaving that blank's answer as the only
  //      chip of its kind - trivially solvable, the exact failure the scaffold
  //      is meant to prevent. So pools are dealt round-robin, one chip per
  //      blank per round, until the cap is reached.
  // Each pool is shuffled with the item's seed first, so the distractors vary
  // per item instead of every item showing the same fixed prefix of the pool
  // (which a learner could game by picking the unfamiliar chip).
  function buildChipPalette(blanks, pools, seed, cap) {
    blanks = blanks || [];
    pools = pools || {};
    cap = cap == null ? 12 : cap;

    const seen = new Set();
    const chips = [];
    function add(w) {
      if (w == null || w === '') return false;
      const k = String(w).toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k);
      chips.push(w);
      return true;

    for (const b of blanks) add(b.answer);

    const rand = rng(seed >>> 0);
    const queues = blanks.map(b => {
      const p = b.scaffoldPool && pools[b.scaffoldPool];
      return p && Array.isArray(p.items) ? shuffle(p.items.slice(), rand) : [];
    });

    let dealt = true;
    while (chips.length < cap && dealt) {
      dealt = false;
      for (const q of queues) {
        if (chips.length >= cap) break;
        // Draw until this queue yields one chip that isn't already shown.
        while (q.length && chips.length < cap) {
          dealt = true;
          if (add(q.shift())) break;
        }

  EngineCore.buildChipPalette = buildChipPalette;

  // ---------------------------------------------------------------------------
  // Session logic lifted out of engine-ui so it can be tested without a DOM.
  // Everything below is pure: `today` is always passed in, never read from
  // the clock, and nothing here touches Storage.
  // ---------------------------------------------------------------------------

  const NEW_CARD_LIMIT = 15;
  EngineCore.NEW_CARD_LIMIT = NEW_CARD_LIMIT;

  // Calendar day in the *local* timezone, as 'YYYY-MM-DD'. The app used to
  // derive "today" from toISOString(), i.e. UTC, so the learning day rolled
  // over at 02:00 in Zurich and mid-afternoon on the US west coast - resetting
  // the new-card cap and un-marking "seen today" partway through a sitting.
  // Accepts a Date or anything Date can parse (the stored ISO lastSeen).
  function localDay(d) {
    const x = d instanceof Date ? d : new Date(d);
    if (isNaN(x.getTime())) return null;
    const m = x.getMonth() + 1, day = x.getDate();
    return x.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;

  EngineCore.localDay = localDay;

  // Pure calendar arithmetic on a 'YYYY-MM-DD' string; timezone-independent.
  function addDays(yyyymmdd, days) {
    const d = new Date(yyyymmdd + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);

  function freshItemState() {
    return { box: 0, ease: EASE_START, interval: 0, due: null, lapses: 0, lastSeen: null, seenCount: 0 };
  }

  // newToday is the only counter anything reads. Saved states from before
  // 2026-09 may still carry todayCount/firstTryCorrectToday; they were never
  // read and fall away the next time the meta is reset for a new day.
  function freshSessionMeta(today) {
    return { newToday: 0, todayDate: today };
  }

  // Bring a stored deck state up to date for `today`: create it if missing,
  // add entries for items authored since it was saved, and reset the daily
  // counters on a new day. Tolerates a state with no items/sessionMeta (an
  // imported or hand-edited backup) instead of throwing on first open.
  //
  // Mutates and returns `saved` when given one, because the caller keeps that
  // same object reference in Storage's map and saves it after each answer.
  function initDeckState(saved, deckDef, today) {
    const s = saved && typeof saved === 'object' ? saved : {};
    if (!s.deckId) s.deckId = deckDef.id;
    if (!s.version) s.version = 1;
    if (!s.items || typeof s.items !== 'object') s.items = {};
    for (const item of deckDef.items) {
      if (!s.items[item.id]) s.items[item.id] = freshItemState();
    }
    if (!s.sessionMeta || typeof s.sessionMeta !== 'object' || s.sessionMeta.todayDate !== today) {
      s.sessionMeta = freshSessionMeta(today);
    }
    return s;
  }
  EngineCore.initDeckState = initDeckState;

  function topicsOf(itemDef) {
    if (itemDef.kind === 'cloze' && Array.isArray(itemDef.blanks)) {
      const set = new Set();
      for (const b of itemDef.blanks) if (b.topic) set.add(b.topic);
      return Array.from(set);
    }
    return itemDef.topic ? [itemDef.topic] : [];
  }
  EngineCore.topicsOf = topicsOf;

  function hydratedStateView(state, deckDef) {
    const items = {};
    for (const def of deckDef.items) {
      const s = (state && state.items && state.items[def.id]) || {};
      items[def.id] = Object.assign({}, s, { topics: topicsOf(def) });
    }
    return { items };
  }
  EngineCore.hydratedStateView = hydratedStateView;

  function seenOn(itemState, today) {
    return !!(itemState && itemState.lastSeen && localDay(itemState.lastSeen) === today);
  }

  // A card is "introduced" the first time it leaves box 0 - whatever the
  // outcome. Counting only correct answers let wrong answers on new cards slip
  // past the daily cap: the card moved to box 1 but was never tallied, so a
  // learner who missed every new card could introduce an unlimited number.
  function isIntroduction(itemStateBefore) {
    return !!itemStateBefore && itemStateBefore.box === 0;
  }
  EngineCore.isIntroduction = isIntroduction;

  function deckProgress(state) {
    if (!state || !state.items) return null;
    const ids = Object.keys(state.items);
    if (ids.length === 0) return null;
    const mastered = ids.filter(id => state.items[id].box >= 4).length;
    return { mastered, total: ids.length, pct: Math.round(mastered / ids.length * 100), label: `${mastered}/${ids.length} mastered` };
  }
  EngineCore.deckProgress = deckProgress;

  // How many items a single-deck session can actually serve today: overdue +
  // low-box-not-seen-today + new up to the remaining daily allowance.
  function actionableCount(state, deckDef, today, newToday, newCap) {
    const view = hydratedStateView(state, deckDef).items;
    let overdue = 0, lowBox = 0, fresh = 0;
    for (const id in view) {
      const it = view[id];
      if (it.due && it.due <= today && it.box > 0) overdue++;
      else if (it.box > 0 && it.box < 4 && !seenOn(it, today)) lowBox++;
      else if (it.box === 0) fresh++;
    }
    const newAllowed = Math.max(0, newCap - newToday);
    return overdue + lowBox + Math.min(fresh, newAllowed);
  }
  EngineCore.actionableCount = actionableCount;

  // Cross-deck daily review. `statesById` must hold an (initDeckState'd) state
  // for every deck that should take part - a deck the learner has never opened
  // contributes its new cards like any other, which the old UI code silently
  // skipped, so a fresh install saw "No items due today".
  //
  // Due and struggling cards come first, oldest due first. New cards are
  // drawn per deck within that deck's remaining daily allowance (so a deck
  // drill plus a daily review can't introduce 30 from one deck), then capped
  // overall. The result is interleaved to avoid the same deck or topic twice
  // in a row wherever the pool allows it.
  function buildDailyReviewQueue(decks, statesById, today, opts) {
    opts = opts || {};
    const newCap = opts.newCap == null ? NEW_CARD_LIMIT : opts.newCap;
    const limit = opts.limit == null ? 30 : opts.limit;
    const rnd = opts.rng || Math.random;

    const due = [];
    const fresh = [];
    for (const deckDef of decks) {
      const state = statesById[deckDef.id];
      if (!state || !state.items) continue;
      const introduced = (state.sessionMeta && state.sessionMeta.newToday) || 0;
      const allowance = Math.max(0, newCap - introduced);
      const deckFresh = [];
      for (const itemDef of deckDef.items) {
        const s = state.items[itemDef.id];
        if (!s) continue;
        const entry = { deckId: deckDef.id, deckDef, itemDef, state, dueDate: s.due || '', topics: topicsOf(itemDef) };
        if (s.box > 0 && s.due && s.due <= today) due.push(entry);
        else if (s.box > 0 && s.box < 4 && !seenOn(s, today)) due.push(entry);
        else if (s.box === 0) deckFresh.push(entry);
      }
      Array.prototype.push.apply(fresh, shuffle(deckFresh, rnd).slice(0, allowance));
    }
    due.sort((a, b) => a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0);
    const remaining = due.concat(shuffle(fresh, rnd).slice(0, newCap));

    const queue = [];
    let lastDeck = null;
    let lastTopics = new Set();
    while (queue.length < limit && remaining.length > 0) {
      let pickIdx = remaining.findIndex(c =>
        c.deckId !== lastDeck && !c.topics.some(t => lastTopics.has(t))
      );
      if (pickIdx === -1) pickIdx = 0;
      const pick = remaining.splice(pickIdx, 1)[0];
      queue.push(pick);
      lastDeck = pick.deckId;
      lastTopics = new Set(pick.topics);
    }
    return queue;
  }
  EngineCore.buildDailyReviewQueue = buildDailyReviewQueue;

  // Display helpers that decide what the learner sees - kept here so the
  // decisions are testable even though the rendering is not.

  // If options disagree on first-letter case (one capitalized gloss among
  // lowercase ones), the odd one out silently flags the answer. Normalize the
  // display to one case so casing carries no signal; values are untouched.
  function uniformFirstCase(opts) {
    const isLetter = c => c && c.toLowerCase() !== c.toUpperCase();
    const firsts = opts.filter(o => o && o.length).map(o => o[0]);
    const anyUpper = firsts.some(c => isLetter(c) && c === c.toUpperCase());
    const anyLower = firsts.some(c => isLetter(c) && c === c.toLowerCase());
    if (anyUpper && anyLower) {
      return opts.map(o => (o && o.length) ? o[0].toLowerCase() + o.slice(1) : o);
    }
    return opts.slice();
  }
  EngineCore.uniformFirstCase = uniformFirstCase;

  function hashCode(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  EngineCore.hashCode = hashCode;

  // In-place seeded Fisher-Yates; same generator as selectDistractors.
  function shuffleDeterministic(arr, seed) {
    return shuffle(arr, rng(seed >>> 0));
  }
  EngineCore.shuffleDeterministic = shuffleDeterministic;

    module.exports = EngineCore;
  } else {
    global.EngineCore = EngineCore;
  }
})(typeof window !== 'undefined' ? window : globalThis);

      card.appendChild(el('span', { class: 'icon' }, d.icon));
      card.appendChild(el('div', { class: 'name' }, d.name));
      card.appendChild(el('div', { class: 'desc' }, d.description));
      if (prog) {
        const bar = el('div', { class: 'progress-bar' });
        bar.appendChild(el('div', { class: 'progress-fill', style: { width: prog.pct + '%', background: d.color } }));
        card.appendChild(bar);
        card.appendChild(el('div', { class: 'progress-label' }, prog.label));
      }
      list.appendChild(card);
    }
    menu.appendChild(list);
    if (Storage.isDegraded && Storage.isDegraded() && !bannerDismissed) {
      const banner = el('div', { class: 'storage-banner', id: 'storageBanner' });
      banner.appendChild(el('div', { class: 'body' },
        'Your browser couldn’t open persistent storage. Progress in this session may not survive a reload. Use Export below to back up.'
      ));
      banner.appendChild(el('button', {
        class: 'close',
        'aria-label': 'Dismiss',
        onclick: () => { bannerDismissed = true; const b = document.getElementById('storageBanner'); if (b) b.classList.add('hidden'); },
      }, '×'));
      menu.appendChild(banner);
    }
    const backup = el('div', { class: 'backup-row' },
      el('button', { class: 'backup-btn', onclick: exportProgress }, '↓ Export'),
      el('button', { class: 'backup-btn', onclick: importProgress }, '↑ Import')
    );
    const dailyBtn = el('button', { class: 'btn-primary', style: { marginTop: '20px', width: '100%', maxWidth: '440px' }, onclick: openDailyReview }, 'Daily Review (cross-deck)');
    menu.appendChild(dailyBtn);
    menu.appendChild(backup);
    const fileInput = el('input', { type: 'file', id: 'importFile', accept: '.json', style: { display: 'none' }, onchange: handleImport });
    menu.appendChild(fileInput);
    root.appendChild(menu);
  }

  function openExtraVocab() {
    // Progress lives under its own storage key; refresh the menu on the way
    // out so the "due" count reflects the session that just happened.
    window.ExtraVocab.open(renderMenu);
  }

  function openKarteikasten() {
    // Refresh the menu on the way out so the "known" count is current.
    window.Karteikasten.open(renderMenu);
  }

  // ----- Daily Review (cross-deck) -----
  function dailyReviewQueue() {
    const t = today();
    // Every deck takes part, opened before or not. initDeckState only creates
    // or refreshes the state object in memory; nothing is persisted until an
    // answer is committed, and that saves this same object.
    const statesById = {};
    for (const deckDef of window.DECKS) {
      statesById[deckDef.id] = loadOrInitDeckState(deckDef.id, deckDef);
    }
    return EngineCore.buildDailyReviewQueue(window.DECKS, statesById, t, { newCap: NEW_CARD_LIMIT, limit: 30 });
  }

  function openDailyReview() {
    const queue = dailyReviewQueue();
    if (queue.length === 0) {
      alert('No items due today. Come back tomorrow.');
      return;
    }
    DRILL = {
      mixed: true,
      queue,
      qIdx: 0,
      sessionCount: 0,
      sessionCap: queue.length,
      firstTryCorrect: 0,
      advanced: 0,
      lapsed: 0,
      attemptedThisItem: false,
      usedScaffolding: false,
      lastTopics: [],
      sessionSeen: [],
    };
    enterDrillView();
    renderDrillMixed();
  }

  function renderDrillMixed() {
    const root = $('#root');
    root.innerHTML = '';
    const top = el('div', { class: 'drill-top' },
      el('button', { class: 'drill-back', onclick: closeDrill }, '← Menu'),
      el('div', { class: 'drill-progress' }, `Daily Review · ${DRILL.sessionCount + 1} / ${DRILL.sessionCap}`)
    );
    const body = el('div', { class: 'drill-body', id: 'drillBody' });
    root.appendChild(el('div', { class: 'drill active' }, top, body));
    advanceMixed();
  }

  function advanceMixed() {
    if (DRILL.qIdx >= DRILL.queue.length) return endSession();
    setProgress(`Daily Review · ${Math.min(DRILL.sessionCount + 1, DRILL.sessionCap)} / ${DRILL.sessionCap}`);
    const entry = DRILL.queue[DRILL.qIdx];
    DRILL.deckId = entry.deckId;
    DRILL.deckDef = entry.deckDef;
    // The queue carries the hydrated state object per deck; a deck opened for
    // the first time here has no Storage entry yet until an answer saves it.
    DRILL.state = entry.state;
    DRILL.usedScaffolding = false;
    DRILL.attemptedThisItem = false;
    renderItem(entry.itemDef);
  }

  function exportProgress() {
    const backup = Storage.exportAll();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `german-drills-backup-${today()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Revoking synchronously can cancel the download in some browsers before
    // it has actually started reading the blob.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function importProgress() { $('#importFile').click(); }
  function handleImport(evt) {
    const f = evt.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = (e) => {
      try {
        const backup = JSON.parse(e.target.result);
        if (!confirm('Replace current progress with backup?')) return;
        // importAll returns false for a well-formed JSON file that isn't a
        // backup (wrong version / shape); that used to pass silently as success.
        if (!Storage.importAll(backup)) { alert('That file is not a German Drills backup.'); return; }
        renderMenu();
      } catch (ex) {
        alert('Could not parse backup file.');
      } finally {
        // Always clear, including after Cancel - otherwise choosing the same
        // file again fires no change event and the button appears dead.
        evt.target.value = '';
      }
    };
    r.readAsText(f);
  }

  // ----- Drill -----
  let DRILL = null;

  // Bug fix: the progress counter used to be written once at session start and
  // never updated. Refresh it on every item.
  function setProgress(text) {
    const p = document.querySelector('.drill-progress');
    if (p) p.textContent = text;
  }

  function enterDrillView() {
    document.body.classList.add('drill-open');
    if (typeof history !== 'undefined' && history.pushState) {
      // Push a sentinel state so the browser back button returns to the menu
      // instead of leaving the site. popstate handler below catches it.
      history.pushState({ drill: true }, '', '#drill');
    }
  }

  function exitDrillView() {
    document.body.classList.remove('drill-open');
    // If we still have the drill state in history, pop it so a subsequent
    // back press doesn't fire popstate again on an already-closed drill.
    if (typeof history !== 'undefined' && history.state && history.state.drill) {
      history.back();
    }
  }

  function openDeck(deckId) {
    const deckDef = window.DECKS.find(d => d.id === deckId);
    const state = loadOrInitDeckState(deckId, deckDef);
    const newToday = state.sessionMeta.newToday || 0;
    const newCap = NEW_CARD_LIMIT;
    const cap = Math.min(20, EngineCore.actionableCount(state, deckDef, today(), newToday, newCap));
    DRILL = {
      deckId,
      deckDef,
      state,
      sessionSeen: [],
      sessionCount: 0,
      sessionCap: Math.max(1, cap),
      newToday,
      newCap,
      lastTopics: [],
      firstTryCorrect: 0,
      advanced: 0,
      lapsed: 0,
      currentItemId: null,
      attemptedThisItem: false,
      usedScaffolding: false,
    };
    enterDrillView();
    renderDrill();
  }

  function closeDrill() {
    DRILL = null;
    exitDrillView();
    renderMenu();
  }

  function renderDrill() {
    const root = $('#root');
    root.innerHTML = '';
    const top = el('div', { class: 'drill-top' },
      el('button', { class: 'drill-back', onclick: closeDrill }, '← Menu'),
      el('div', { class: 'drill-progress' }, `${DRILL.sessionCount + 1} / ${DRILL.sessionCap}`)
    );
    const body = el('div', { class: 'drill-body', id: 'drillBody' });
    const drill = el('div', { class: 'drill active' }, top, body);
    root.appendChild(drill);
    advance();
  }

  function advance() {
    if (DRILL.sessionCount >= DRILL.sessionCap) return endSession();
    const view = EngineCore.hydratedStateView(DRILL.state, DRILL.deckDef);
    const id = EngineCore.selectNextItem(view, today(), {
      sessionSeen: DRILL.sessionSeen,
      lastTopics: DRILL.lastTopics,
      newToday: DRILL.newToday,
      newCap: DRILL.newCap,
    });
    if (!id) return endSession();
    DRILL.currentItemId = id;
    DRILL.attemptedThisItem = false;
    DRILL.usedScaffolding = false;
    setProgress(`${Math.min(DRILL.sessionCount + 1, DRILL.sessionCap)} / ${DRILL.sessionCap}`);
    const itemDef = DRILL.deckDef.items.find(it => it.id === id);
    renderItem(itemDef);
  }

  function renderItem(item) {
    const body = $('#drillBody');
    body.innerHTML = '';
    const state = DRILL.state.items[item.id];
    if (item.kind === 'cloze') renderCloze(body, item, state);
    else if (item.kind === 'text') renderText(body, item, state);
    else if (item.kind === 'choice') renderChoice(body, item, state);
  }

  function renderCloze(body, item, state) {
    const blanks = item.blanks;
    const promptHtml = el('div', { class: 'prompt' });
    const inputs = [];
    const parts = item.prompt.split(/(\{\d+\})/g);
    for (const p of parts) {
      const m = p.match(/^\{(\d+)\}$/);
      if (m) {
        const i = +m[1];
        const blank = el('span', { class: 'blank' });
        const ansLen = (blanks[i].answer || '').length || 4;
        const inp = el('input', { type: 'text', autocomplete: 'off', spellcheck: 'false', size: Math.max(4, ansLen + 2) });
        if (state.box <= 1) inp.placeholder = '_'.repeat(ansLen);
        else if (state.box === 2) inp.placeholder = (blanks[i].answer || '_')[0] + '_'.repeat(Math.max(0, ansLen - 1));
        else inp.placeholder = '';
        blank.appendChild(inp);
        inputs.push({ inp, blank, def: blanks[i] });
        promptHtml.appendChild(blank);
      } else {
        promptHtml.appendChild(document.createTextNode(p));
      }
    }
    body.appendChild(promptHtml);

    if (state.box <= 1) {
      // EngineCore.buildChipPalette handles case-insensitive de-duplication (so
      // a sentence-initial answer "Nach" and its lowercase pool twin "nach"
      // don't both appear) and fair per-blank distribution under the cap.
      // uniformFirstCase then normalizes the display so a lone capitalized chip
      // doesn't silently flag the answer.
      // Seeded per showing (seenCount), not per item, so the distractor set
      // and layout change between appearances - the same as choice options.
      const chipSeed = EngineCore.hashCode(item.id + ':' + (state.seenCount || 0));
      const chipRaw = EngineCore.buildChipPalette(blanks, DRILL.deckDef.pools, chipSeed, 12);
      const chipsEl = el('div', { class: 'chips' });
      const chipList = EngineCore.uniformFirstCase(chipRaw);
      EngineCore.shuffleDeterministic(chipList, chipSeed + 1);
      for (const w of chipList) {
        chipsEl.appendChild(el('div', { class: 'chip', onclick: (e) => fillFirstEmpty(inputs, w, e.target) }, w));
      }
      body.appendChild(chipsEl);
    }

    const submitBtn = el('button', { class: 'btn-primary', onclick: () => submitCloze(item, inputs) }, 'Check');
    body.appendChild(el('div', { class: 'drill-actions' }, submitBtn));

    setTimeout(() => inputs[0] && inputs[0].inp.focus(), 0);
  }

  function fillFirstEmpty(inputs, word, chipEl) {
    for (const i of inputs) {
      if (!i.inp.value) {
        i.inp.value = word;
        chipEl.classList.add('used');
        // The attempt counts as aided only once a chip is actually used.
        // Setting this merely because chips were rendered graded every
        // scaffolded answer as aided, including ones typed out unaided.
        DRILL.usedScaffolding = true;
        return;
      }
    }
  }

  function submitCloze(item, inputs) {
    // One rule for every cloze (EngineCore.clozeMatches): primary answers with
    // their alts, or any acceptAny combo. Per-blank highlighting follows the
    // primary answers so the learner sees which slot was off; the verdict is
    // the whole-combo match.
    const values = inputs.map(i => i.inp.value);
    const allCorrect = EngineCore.clozeMatches(item, values);
    for (const { inp, blank, def } of inputs) {
      const slotOk = allCorrect || EngineCore.answersMatch(inp.value, def.answer, def.alts || []);
      blank.classList.add(slotOk ? 'correct' : 'wrong');
    }
    finalizeAttempt(item, allCorrect, inputs);
  }

  function renderText(body, item, state) {
    body.appendChild(el('div', { class: 'prompt' }, item.prompt));
    const inp = el('input', { type: 'text', autocomplete: 'off', spellcheck: 'false', class: 'blank filled', style: { fontSize: '18px', minWidth: '200px' } });
    body.appendChild(inp);
    const submit = el('button', { class: 'btn-primary', onclick: () => {
      const ok = EngineCore.answersMatch(inp.value, item.answer, item.alts || []);
      inp.classList.add(ok ? 'correct' : 'wrong');
      finalizeAttempt(item, ok, [{ inp, blank: inp, def: { answer: item.answer } }]);
    } }, 'Check');
    body.appendChild(el('div', { class: 'drill-actions' }, submit));
    setTimeout(() => inp.focus(), 0);
  }

  function renderChoice(body, item, state) {
    const promptHtml = el('div', { class: 'prompt' }, item.prompt);
    body.appendChild(promptHtml);
    const seed = EngineCore.hashCode(item.id + ':' + (DRILL.state.items[item.id].seenCount || 0));
    let options;
    if (Array.isArray(item.options)) {
      options = item.options.slice();
    } else {
      const pool = DRILL.deckDef.pools[item.pool].items;
      const distractors = EngineCore.selectDistractors(pool, item.answer, state.box, 3, seed);
      options = [item.answer].concat(distractors);
    }
    // Always shuffle (inline options used to keep their authored order, which put
    // the answer in a predictable slot — e.g. always first in the past/future deck).
    EngineCore.shuffleDeterministic(options, seed + 1);
    const labels = EngineCore.uniformFirstCase(options);
    const wrap = el('div', { class: 'choice-options' });
    let answerBtn = null;
    options.forEach((opt, i) => {
      const btn = el('button', { class: 'choice-btn', onclick: () => {
        const ok = opt === item.answer;
        btn.classList.add(ok ? 'correct' : 'wrong');
        if (!ok && answerBtn) answerBtn.classList.add('correct');
        finalizeAttempt(item, ok, [{ inp: { value: opt }, blank: btn, def: { answer: item.answer } }]);
      } }, labels[i]);
      if (opt === item.answer) answerBtn = btn;
      wrap.appendChild(btn);
    });
    body.appendChild(wrap);
  }

  function finalizeAttempt(item, correct, inputs) {
    if (DRILL.attemptedThisItem) return;
    DRILL.attemptedThisItem = true;
    const state = DRILL.state.items[item.id];
    // Decide "was this card new?" before any outcome is committed, and tally
    // it on BOTH paths below. Counting only correct answers let a new card
    // answered wrong move to box 1 without ever hitting the daily cap.
    const wasNew = EngineCore.isIntroduction(state);
    const noteIntroduction = () => {
      if (!wasNew) return;
      DRILL.newToday = (DRILL.newToday || 0) + 1;
      DRILL.state.sessionMeta.newToday = (DRILL.state.sessionMeta.newToday || 0) + 1;
    };
    const body = $('#drillBody');
    const fb = el('div', { class: 'feedback ' + (correct ? 'correct' : 'wrong') });
    if (correct) {
      fb.appendChild(el('div', null, 'Correct.'));
      if (item.translation) fb.appendChild(el('div', { class: 'translation' }, item.translation));
    } else {
      // Show the correct answer in the same format the user is asked to type
      // below (space-joined words/endings), rather than a "word / ending" slash
      // form that doesn't match the expected input.
      let correctForm;
      if (item.kind === 'cloze') {
        correctForm = (Array.isArray(item.acceptAny) && item.acceptAny.length > 0)
          ? item.acceptAny[0].join(' ')
          : item.blanks.map(b => b.answer).join(' ');
      } else {
        correctForm = item.answer;
      }
      fb.appendChild(el('div', null, 'Correct answer: '));
      fb.appendChild(el('div', { class: 'correct-form' }, correctForm));
      if (item.translation) fb.appendChild(el('div', { class: 'translation' }, item.translation));
    }
    if (item.explanation) fb.appendChild(el('div', { class: 'explanation' }, item.explanation));
    body.appendChild(fb);

    if (!correct) {
      const corrLabel = el('div', { style: { marginTop: '20px', color: '#aaa', fontSize: '14px' } }, 'Type the correct answer to continue:');
      body.appendChild(corrLabel);
      let correctText;
      if (item.kind === 'cloze') {
        if (Array.isArray(item.acceptAny) && item.acceptAny.length > 0) {
          correctText = item.acceptAny[0].join(' ');
        } else {
          correctText = item.blanks.map(b => b.answer).join(' ');
        }
      } else {
        correctText = item.answer;
      }
      const corrInp = el('input', { type: 'text', class: 'blank filled', autocomplete: 'off', spellcheck: 'false', style: { fontSize: '16px', marginTop: '8px', minWidth: '300px' } });
      body.appendChild(corrInp);
      const advanceBtn = el('button', { class: 'btn-primary', style: { marginTop: '12px' }, onclick: () => {
        // The learner is retyping the form shown above, so compare the joined
        // string against every accepted combo (same source of truth as the
        // initial check), not just acceptAny[0] or the primary.
        let ok;
        if (item.kind === 'cloze') {
          const typed = EngineCore.normalizeAnswer(corrInp.value);
          ok = EngineCore.clozeAcceptedCombos(item)
            .some(combo => EngineCore.normalizeAnswer(combo.join(' ')) === typed);
        } else {
          ok = EngineCore.normalizeAnswer(corrInp.value) === EngineCore.normalizeAnswer(correctText);
        }
        if (ok) {
          commitOutcome(item, 'wrong');
          noteIntroduction();
          DRILL.lapsed++;
          nextItem(item);
        } else {
          corrInp.classList.add('wrong');
          setTimeout(() => corrInp.classList.remove('wrong'), 600);
        }
      } }, 'Continue');
      body.appendChild(el('div', { class: 'drill-actions' }, advanceBtn));
      setTimeout(() => corrInp.focus(), 0);
    } else {
      const outcome = DRILL.usedScaffolding ? 'correct-aided' : 'correct';
      commitOutcome(item, outcome);
      noteIntroduction();
      if (outcome === 'correct') DRILL.firstTryCorrect++;
      DRILL.advanced++;
      const advanceBtn = el('button', { class: 'btn-primary', onclick: () => nextItem(item) }, 'Next');
      body.appendChild(el('div', { class: 'drill-actions' }, advanceBtn));
      setTimeout(() => advanceBtn.focus(), 0);
    }
  }

  function commitOutcome(item, outcome) {
    const state = DRILL.state.items[item.id];
    const updated = EngineCore.srsUpdate(state, outcome);
    updated.due = EngineCore.addDays(today(), updated.interval);
    updated.lastSeen = nowIso();
    updated.seenCount = (state.seenCount || 0) + 1;
    DRILL.state.items[item.id] = updated;
    Storage.saveDeck(DRILL.deckId, DRILL.state);
  }

  var nextItem = function (prevItem) {
    if (DRILL.mixed) {
      DRILL.lastTopics = EngineCore.topicsOf(prevItem);
      DRILL.qIdx++;
      DRILL.sessionCount++;
      Storage.saveDeck(DRILL.deckId, DRILL.state);
      advanceMixed();
      return;
    }
    DRILL.sessionSeen.push(prevItem.id);
    DRILL.lastTopics = EngineCore.topicsOf(prevItem);
    DRILL.sessionCount++;
    Storage.saveDeck(DRILL.deckId, DRILL.state);
    advance();
  };

  function endSession() {
    const body = $('#drillBody');
    if (body) body.innerHTML = '';
    const newCap = DRILL.newCap || NEW_CARD_LIMIT;
    const capReached = !DRILL.mixed && (DRILL.newToday || 0) >= newCap;
    const note = (text) => el('div', {
      style: { marginTop: '16px', maxWidth: '340px', color: '#999', fontSize: '14px', lineHeight: '1.55' },
    }, text);

    if (DRILL.sessionCount === 0) {
      let headline, detail;
      if (DRILL.mixed) {
        headline = 'All caught up';
        detail = 'Nothing is due across your decks right now. New cards and due reviews show up here as they come up — check back later, or open a single deck to keep going.';
      } else if (capReached) {
        headline = 'Daily limit reached';
        detail = `You've already introduced today's ${newCap} new cards for this deck. The limit spaces new material out so it sticks instead of piling up. The cards you've studied will return for review on their scheduled days — come back tomorrow for ${newCap} more.`;
      } else {
        headline = 'Nothing due right now';
        detail = 'Everything you\u2019ve learned in this deck is scheduled for a later day. Check back when those cards come due.';
      }
      const empty = el('div', { class: 'session-end' },
        el('div', { class: 'stat-val' }, '✓'),
        el('div', { class: 'stat' }, headline),
        note(detail),
        el('button', { class: 'btn-primary', style: { marginTop: '24px' }, onclick: closeDrill }, 'Back to menu')
      );
      if (body) body.appendChild(empty);
      return;
    }
    const summary = el('div', { class: 'session-end' },
      el('div', { class: 'stat-val' }, String(DRILL.sessionCount)),
      el('div', { class: 'stat' }, 'items seen'),
      el('div', { class: 'stat-val' }, String(DRILL.firstTryCorrect)),
      el('div', { class: 'stat' }, 'first-try correct'),
      el('div', { class: 'stat-val' }, String(DRILL.advanced)),
      el('div', { class: 'stat' }, 'advanced'),
      el('div', { class: 'stat-val' }, String(DRILL.lapsed)),
      el('div', { class: 'stat' }, 'lapsed'),
      el('button', { class: 'btn-primary', style: { marginTop: '24px' }, onclick: closeDrill }, 'Back to menu')
    );
    if (capReached) {
      summary.insertBefore(
        note(`That's today's ${newCap} new cards for this deck. Come back tomorrow for ${newCap} more, and your studied cards will return for review when they're due.`),
        summary.lastChild
      );
    }
    if (body) body.appendChild(summary);
  }

  // ----- Boot -----
  if (typeof window !== 'undefined') {
    window.addEventListener('DOMContentLoaded', () => {
      Storage.init()
        .catch(err => console.warn('[gd-storage] init degraded:', err))
        .finally(renderMenu);
    });
    // Browser back button: close any open drill instead of leaving the site.
    window.addEventListener('popstate', () => {
      if (DRILL) {
        DRILL = null;
        document.body.classList.remove('drill-open');
        renderMenu();
        return;
      }
      if (window.ExtraVocab && window.ExtraVocab.handlePop()) return;
      if (window.Karteikasten) window.Karteikasten.handlePop();
    });
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { renderMenu, openDeck, openDailyReview };
  } else {
    global.EngineUI = { renderMenu, openDeck, openDailyReview };
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
// Offline support. Skipped on file:// (no service workers there, and the
// single file already works standalone) and harmless if registration fails.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
