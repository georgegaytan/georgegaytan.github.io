answer":"dieser","topic":"dem_nom_m_sg","explanation":"Demonstrative *dieser* before a masculine nominative noun — same *-er* ending as the definite article *der*."},{"id":"pron_dem_nom_f_001","kind":"choice","prompt":"___ Tasche ist sehr teuer.","pool":"demonstrative_pronouns","answer":"diese","topic":"dem_nom_f_sg","explanation":"Demonstrative *diese* before a feminine nominative noun — same *-e* ending as the definite article *die*."},{"id":"pron_dem_acc_m_001","kind":"choice","prompt":"Ich nehme ___ Kuchen, bitte.","pool":"demonstrative_pronouns","answer":"diesen","topic":"dem_acc_m_sg","explanation":"Demonstrative *diesen* before a masculine accusative noun — same *-en* ending as *den*."},{"id":"pron_dem_dat_m_001","kind":"choice","prompt":"Mit ___ Schlüssel öffnest du die Tür.","pool":"demonstrative_pronouns","answer":"diesem","topic":"dem_dat_m_sg","explanation":"Demonstrative *diesem* before a masculine dative noun — same *-em* ending as *dem*. *Mit* governs the dative."},{"id":"pron_poss_nom_f_001","kind":"choice","prompt":"Das ist ___ Schwester aus Hamburg.","pool":"possessive_nom_acc_fem","answer":"meine","topic":"poss_nom_1sg_f","explanation":"Possessive *mein* (my) gains *-e* before a feminine nominative noun (*meine Schwester*)."},{"id":"pron_poss_acc_m_001","kind":"choice","prompt":"Hast du ___ Schlüssel gesehen? Ich finde ihn nicht.","pool":"possessive_acc_masc","answer":"meinen","topic":"poss_acc_1sg_m","explanation":"Possessive *mein* (my) gains *-en* before a masculine accusative noun (*meinen Schlüssel*)."},{"id":"pron_poss_dat_m_001","kind":"choice","prompt":"Sie spricht oft mit ___ Bruder am Telefon.","pool":"possessive_dat_masc_neut","answer":"ihrem","topic":"poss_dat_3fsg_m","explanation":"Possessive *ihr* (her) gains *-em* before a masculine dative noun (*ihrem Bruder*). *Mit* governs the dative."},{"id":"pron_poss_dat_f_001","kind":"choice","prompt":"Er hilft ___ Mutter im Garten.","pool":"possessive_dat_fem","answer":"seiner","topic":"poss_dat_3msg_f","explanation":"Possessive *sein* (his) gains *-er* before a feminine dative noun (*seiner Mutter*). *Helfen* governs the dative."},{"id":"pron_poss_nom_2pl_001","kind":"choice","prompt":"Wie heisst ___ Tochter eigentlich?","pool":"possessive_nom_acc_fem","answer":"eure","topic":"poss_nom_2pl_f","explanation":"Possessive *euer* (your, informal plural) drops the second *e* and gains *-e* before a feminine nominative noun (*eure Tochter*)."}]},{"id":"tricky-words","name":"Tricky Words","icon":"🎭","color":"#ef4444","description":"34 German particles whose meaning depends on context: damit, doch, eben, halt, ja, mal, ruhig, schon, etc.","items":[{"id":"tricky_damit_with_it_001","kind":"choice","prompt":"Ich schreibe damit einen Brief. (damit means…)","options":["with it","so that","therefore"],"answer":"with it","topic":"damit_with_it","explanation":"Here *damit* is a pronominal adverb meaning *with it* — referring back to the writing instrument. Compare *damit* as a conjunction meaning *so that*."},{"id":"tricky_damit_so_that_001","kind":"choice","prompt":"Ich lerne Deutsch, damit ich in Zürich arbeiten kann. (damit means…)","options":["with it","so that","because"],"answer":"so that","topic":"damit_so_that","explanation":"*damit* introducing a purpose clause = *so that*. Different from pronominal *damit* = *with it/that*."},{"id":"tricky_damit_with_it_002","kind":"choice","prompt":"Was willst du damit sagen? (damit means…)","options":["so that","by that","about it"],"answer":"by that","topic":"damit_with_it","explanation":"Pronominal *damit* = *by that* — referring back to the prior statement. Different from conjunction *damit* = *so that*."},{"id":"tricky_damit_so_that_002","kind":"choice","prompt":"Er spart Geld, damit er reisen kann. (damit means…)","options":["with it","so that","although"],"answer":"so that","topic":"damit_so_that","explanation":"*damit* as a purpose conjunction = *so that*, sending the verb to the end. Different from pronominal *damit* = *with it*."},{"id":"tricky_dafuer_for_it_001","kind":"choice","prompt":"Wie viel hast du dafür bezahlt? (dafür means…)","options":["for it","in return","instead"],"answer":"for it","topic":"dafuer_for_it","explanation":"Pronominal *dafür* = *for it* — the price paid for the thing referenced. Different from contrastive *dafür* = *on the other hand*."},{"id":"tricky_dafuer_in_return_001","kind":"choice","prompt":"Er ist streng, dafür ist er fair. (dafür means…)","options":["for it","on the other hand","so that"],"answer":"on the other hand","topic":"dafuer_in_return","explanation":"Contrastive *dafür* = *on the other hand / to make up for it* — balancing a negative with a positive. Different from literal *dafür* = *for it*."},{"id":"tricky_dafuer_in_favor_001","kind":"choice","prompt":"Ich bin dafür. (dafür means…)","options":["against it","in favor of it","ready for it"],"answer":"in favor of it","topic":"dafuer_in_favor","explanation":"*dafür sein* = *to be in favor of it* — the standard pro/contra idiom. Different from compensatory *dafür* = *on the other hand*."},{"id":"tricky_dafuer_not_my_fault_001","kind":"choice","prompt":"Dafür kann ich nichts. (dafür means…)","options":["in return","about that / for that","because"],"answer":"about that / for that","topic":"dafuer_not_my_fault","explanation":"Idiomatic *dafür kann ich nichts* = *I can't help it / it's not my fault about that*. Different from literal *dafür* = *for it (in exchange)*."},{"id":"tricky_dazu_about_that_001","kind":"choice","prompt":"Was sagst du dazu? (dazu means…)","options":["about that","in addition","because of that"],"answer":"about that","topic":"dazu_about_that","explanation":"Pronominal *dazu* = *about that* — referring back to a topic just raised. Different from additive *dazu* = *in addition*."},{"id":"tricky_dazu_in_addition_001","kind":"choice","prompt":"Er kocht gut, und dazu singt er auch. (dazu means…)","options":["about it","in addition","for that purpose"],"answer":"in addition","topic":"dazu_in_addition","explanation":"Additive *dazu* = *in addition / on top of that*, stacking another quality. Different from *dazu* = *about that* (reference) or *for that purpose*."},{"id":"tricky_dazu_for_purpose_001","kind":"choice","prompt":"Dazu brauche ich mehr Zeit. (dazu means…)","options":["in addition","about it","for that purpose"],"answer":"for that purpose","topic":"dazu_for_purpose","explanation":"*dazu* = *for that purpose / to do that* — referring to a task to accomplish. Different from additive *dazu* = *in addition*."},{"id":"tricky_dazu_about_that_002","kind":"choice","prompt":"Ich habe keine Lust dazu. (dazu means…)","options":["to do that","in addition","instead of that"],"answer":"to do that","topic":"dazu_about_that","explanation":"*Lust dazu* — *dazu* refers back to the activity: *no desire to do that*. Different from additive *dazu* = *in addition*."},{"id":"tricky_schon_already_001","kind":"choice","prompt":"Bist du schon fertig? (schon means…)","options":["already","still","only just"],"answer":"already","topic":"schon_already","explanation":"*schon* meaning *already* (sooner than expected). Different from modal-particle *schon* reassuring the listener."},{"id":"tricky_schon_reassurance_001","kind":"choice","prompt":"Das wird schon klappen. (schon means…)","options":["already","surely / don't worry","just"],"answer":"surely / don't worry","topic":"schon_reassurance","explanation":"Modal-particle *schon* in a future statement = *surely / don't worry, it'll work out*. Different from temporal *schon* = *already*."},{"id":"tricky_schon_already_002","kind":"choice","prompt":"Ich habe schon drei Mal angerufen. (schon means…)","options":["only just","already","even"],"answer":"already","topic":"schon_already","explanation":"*schon* = *already*, marking that an action has occurred more times than expected. Different from reassuring *schon* = *don't worry*."},{"id":"tricky_schon_softener_001","kind":"choice","prompt":"Das ist schon okay. (schon means…)","options":["already","it's fine / alright","still"],"answer":"it's fine / alright","topic":"schon_softener","explanation":"Modal-particle *schon* softens the statement = *it's alright / fine really*. Different from temporal *schon* = *already*."},{"id":"tricky_noch_still_001","kind":"choice","prompt":"Er schläft noch. (noch means…)","options":["already","still","again"],"answer":"still","topic":"noch_still","explanation":"*noch* meaning *still* (the action continues). Compare *noch ein* = *another*, *noch nicht* = *not yet*."},{"id":"tricky_noch_another_001","kind":"choice","prompt":"Noch ein Bier, bitte! (noch means…)","options":["still","another","even"],"answer":"another","topic":"noch_another","explanation":"*noch ein* = *another / one more*. Different from *noch* = *still* (continuing action) or *noch* = *even* (intensifier)."},{"id":"tricky_noch_even_001","kind":"choice","prompt":"Das ist noch besser als das erste. (noch means…)","options":["still","already","even"],"answer":"even","topic":"noch_even","explanation":"*noch* before a comparative = *even (better)*, intensifying the comparison. Different from *noch* = *still* (continuing)."},{"id":"tricky_noch_any_more_001","kind":"choice","prompt":"Hast du noch Fragen? (noch means…)","options":["any more","already","only"],"answer":"any more","topic":"noch_any_more","explanation":"*noch* in a question = *any more / further* — checking for remaining items. Different from *noch* = *still* (continuing action)."},{"id":"tricky_erst_not_until_001","kind":"choice","prompt":"Er kommt erst morgen. (erst means…)","options":["already tomorrow","not until tomorrow","first tomorrow"],"answer":"not until tomorrow","topic":"erst_not_until","explanation":"Temporal *erst* = *not until* — later than expected. Opposite of *schon* = *already*. Different from sequential *erst* = *first*."},{"id":"tricky_erst_just_now_001","kind":"choice","prompt":"Ich bin erst angekommen. (erst means…)","options":["only just / just now","already","finally"],"answer":"only just / just now","topic":"erst_just_now","explanation":"*erst* = *only just / just now* — emphasising how recent the action is. Different from sequential *erst* = *first*."},{"id":"tricky_erst_first_001","kind":"choice","prompt":"Erst denken, dann handeln. (erst means…)","options":["only","first","not until"],"answer":"first","topic":"erst_first","explanation":"Sequential *erst … dann …* = *first … then …*. Different from temporal *erst* = *not until* or quantitative *erst* = *only*."},{"id":"tricky_erst_only_001","kind":"choice","prompt":"Sie ist erst fünf Jahre alt. (erst means…)","options":["already","only / just","first"],"answer":"only / just","topic":"erst_only","explanation":"Quantitative *erst* with an age or quantity = *only / just* (less than you'd think). Different from *erst* = *first* (sequential)."},{"id":"tricky_doch_contradiction_001","kind":"choice","prompt":"— Du kommst nicht mit? — Doch! (doch means…)","options":["yes, I am (after all)!","no way!","maybe!"],"answer":"yes, I am (after all)!","topic":"doch_contradiction","explanation":"Standalone *doch!* contradicts a negative statement = *yes, I am!*. Different from modal-particle *doch* softening an imperative."},{"id":"tricky_doch_insistence_001","kind":"choice","prompt":"Das weißt du doch! (doch means…)","options":["maybe","you know that! (insistence)","still"],"answer":"you know that! (insistence)","topic":"doch_insistence","explanation":"Modal-particle *doch* insisting on shared knowledge = *come on, you know that!*. Different from *doch* contradicting a negation."},{"id":"tricky_doch_softener_001","kind":"choice","prompt":"Komm doch mit! (doch means…)","options":["come along (softening)","don't come","come first"],"answer":"come along (softening)","topic":"doch_softener","explanation":"Modal-particle *doch* softening an imperative — *go ahead and come along*. Different from *doch* contradicting a negation."},{"id":"tricky_doch_after_all_001","kind":"choice","prompt":"Er kommt doch. (doch means…)","options":["not at all","after all / it turns out","sometimes"],"answer":"after all / it turns out","topic":"doch_after_all","explanation":"*doch* meaning *after all / yet* — contradicting a prior expectation that he wouldn't come. Different from softening *doch* in imperatives."},{"id":"tricky_ja_obviously_001","kind":"choice","prompt":"Das ist ja klar! (ja means…)","options":["maybe","obviously / as you can see","already"],"answer":"obviously / as you can see","topic":"ja_obviously","explanation":"Modal-particle *ja* marks shared/obvious knowledge = *obviously / as we both know*. Different from *ja* as a warning or as a literal *yes*."},{"id":"tricky_ja_warning_001","kind":"choice","prompt":"Komm ja nicht zu spät! (ja means…)","options":["please do","don't you dare","maybe"],"answer":"don't you dare","topic":"ja_warning","explanation":"Modal-particle *ja* in a negative imperative is a strong warning = *don't you dare*. Different from *ja* marking shared knowledge = *obviously*."},{"id":"tricky_mal_softener_001","kind":"choice","prompt":"Hör mal! (mal means…)","options":["once","just (softener)","always"],"answer":"just (softener)","topic":"mal_softener","explanation":"Modal-particle *mal* softens an imperative = *just listen for a sec*. Different from temporal *mal* = *once / at some point*."},{"id":"tricky_mal_once_001","kind":"choice","prompt":"Ich war mal in Berlin. (mal means…)","options":["once / at some point","often","never"],"answer":"once / at some point","topic":"mal_once","explanation":"Temporal *mal* with past tense = *once / at some point*, short for *einmal*. Different from softening *mal* in imperatives."},{"id":"tricky_denn_curiosity_001","kind":"choice","prompt":"Wo bist du denn? (denn means…)","options":["because","then / anyway (curious)","already"],"answer":"then / anyway (curious)","topic":"denn_curiosity","explanation":"Modal-particle *denn* in a question softens it and signals curiosity. Different from coordinating *denn* = *because*."},{"id":"tricky_denn_because_001","kind":"choice","prompt":"Ich bleibe zu Hause, denn ich bin müde. (denn means…)","options":["because (coordinating)","although","so that"],"answer":"because (coordinating)","topic":"denn_because","explanation":"Coordinating *denn* = *because* — note that the clause keeps verb-second order, unlike *weil*."},{"id":"tricky_wohl_probably_001","kind":"choice","prompt":"Er ist wohl krank. (wohl means…)","options":["definitely","probably / I suppose","never"],"answer":"probably / I suppose","topic":"wohl_probably","explanation":"*wohl* meaning *probably* — a hedged guess about the situation. Different from *wohl* in a question expressing wonder or disbelief."},{"id":"tricky_wohl_wonder_001","kind":"choice","prompt":"Was meint er wohl damit? (wohl means…)","options":["obviously","I wonder","never"],"answer":"I wonder","topic":"wohl_wonder","explanation":"*wohl* in a question marks musing = *I wonder*. Different from declarative *wohl* = *probably*."},{"id":"tricky_nach_to_001","kind":"choice","prompt":"Ich fahre nach Zürich. (nach means…)","options":["to","after","according to"],"answer":"to","topic":"nach_to","explanation":"*nach* + city/country = *to* (directional). Different from *nach* + dative time = *after*, or *nach + Meinung* = *according to*."},{"id":"tricky_nach_after_001","kind":"choice","prompt":"Nach dem Essen gehen wir spazieren. (nach means…)","options":["before","to","after"],"answer":"after","topic":"nach_after","explanation":"*nach* + dative for time *after*. Different from *nach* + city = *to*, or *nach + Meinung* = *according to*."},{"id":"tricky_nach_according_to_001","kind":"choice","prompt":"Meiner Meinung nach ist das falsch. (nach means…)","options":["to","according to","after"],"answer":"according to","topic":"nach_according_to","explanation":"Postposed *nach* in *Meinung nach* = *according to*. Different from *nach* + city = *to* or *nach* + time = *after*."},{"id":"tricky_nach_to_002","kind":"choice","prompt":"Wir fahren nach Hause. (nach means…)","options":["at home","to (home)","from home"],"answer":"to (home)","topic":"nach_to","explanation":"Idiomatic *nach Hause* = *(to) home* — direction. Different from locative *zu Hause* = *at home*, or *nach* = *after*."},{"id":"tricky_somit_therefore_001","kind":"choice","prompt":"Ich bin krank, somit kann ich nicht zur Arbeit kommen. (somit means…)","options":["because","therefore / thus","although"],"answer":"therefore / thus","topic":"somit_therefore","explanation":"*somit* drawing a logical conclusion = *therefore / thus*. Different from causal *weil* / *denn* = *because*, which give a reason rather than a result."},{"id":"tricky_somit_with_that_001","kind":"choice","prompt":"Alle Tests sind bestanden. Somit ist das Projekt abgeschlossen. (somit means…)","options":["afterwards","with that / and so","however"],"answer":"with that / and so","topic":"somit_with_that","explanation":"*somit* linking a closing consequence = *with that / and so*. Different from purely logical *somit* = *therefore*, this one wraps up a sequence."},{"id":"tricky_sowieso_anyway_001","kind":"choice","prompt":"Keine Sorge, ich komme sowieso vorbei. (sowieso means…)","options":["anyway / in any case","maybe later","of course not"],"answer":"anyway / in any case","topic":"sowieso_anyway","explanation":"*sowieso* = *anyway / in any case* — the action is happening regardless. Different from *sowieso* implying obvious shared knowledge."},{"id":"tricky_sowieso_obviously_001","kind":"choice","prompt":"Das weiß ich sowieso schon. (sowieso means…)","options":["barely","of course / obviously","almost"],"answer":"of course / obviously","topic":"sowieso_obviously","explanation":"*sowieso* here = *of course / obviously already*, dismissing the info as redundant. Different from plan-related *sowieso* = *I was going to anyway*."},{"id":"tricky_trotzdem_nevertheless_001","kind":"choice","prompt":"Es regnet, trotzdem gehe ich spazieren. (trotzdem means…)","options":["therefore","nevertheless / anyway","because"],"answer":"nevertheless / anyway","topic":"trotzdem_nevertheless","explanation":"*trotzdem* = *nevertheless* — going ahead despite an obstacle. Different from causal *deshalb* = *therefore*, which would mean rain made you go."},{"id":"tricky_trotzdem_all_the_same_001","kind":"choice","prompt":"Das war nicht nötig, aber trotzdem danke! (trotzdem means…)","options":["still / all the same","first","because"],"answer":"still / all the same","topic":"trotzdem_all_the_same","explanation":"*trotzdem* softened to *all the same / still* — gratitude despite the gift being unnecessary. Different from the stronger contrastive *trotzdem* = *nevertheless*."},{"id":"tricky_allerdings_however_001","kind":"choice","prompt":"Das Essen war gut, allerdings war es teuer. (allerdings means…)","options":["therefore","however / but","for example"],"answer":"however / but","topic":"allerdings_however","explanation":"*allerdings* introducing a qualification = *however / but*. Different from emphatic *allerdings!* = *absolutely!* as a standalone reply."},{"id":"tricky_allerdings_admittedly_001","kind":"choice","prompt":"Allerdings muss ich zugeben, dass er recht hat. (allerdings means…)","options":["admittedly","surprisingly","never"],"answer":"admittedly","topic":"allerdings_admittedly","explanation":"Sentence-initial *allerdings* conceding a point = *admittedly*. Different from mid-sentence *allerdings* = *however*, or exclamatory *allerdings!* = *absolutely!*."},{"id":"tricky_allerdings_absolutely_001","kind":"choice","prompt":"— Kommst du zur Party? — Allerdings! (allerdings means…)","options":["maybe","absolutely!","no chance"],"answer":"absolutely!","topic":"allerdings_absolutely","explanation":"Standalone *Allerdings!* as a reply = *absolutely!* — emphatic agreement. Different from connective *allerdings* = *however / admittedly*."},{"id":"tricky_zwar_admittedly_001","kind":"choice","prompt":"Er ist zwar klug, aber faul. (zwar means…)","options":["already","admittedly / it's true that","never"],"answer":"admittedly / it's true that","topic":"zwar_admittedly","explanation":"*zwar* meaning *admittedly* — paired with a later *aber* in the classic *zwar … aber …* construction. Different from *und zwar* = *specifically*."},{"id":"tricky_zwar_admittedly_002","kind":"choice","prompt":"Ich habe zwar wenig Zeit, aber ich helfe dir trotzdem. (zwar means…)","options":["a lot","granted / true","sometimes"],"answer":"granted / true","topic":"zwar_admittedly","explanation":"*zwar* conceding before an *aber* = *granted / true*. Different from *und zwar* = *namely / specifically*."},{"id":"tricky_zwar_specifically_001","kind":"choice","prompt":"Ich komme, und zwar morgen früh. (zwar means…)","options":["maybe","specifically / to be exact","never"],"answer":"specifically / to be exact","topic":"zwar_specifically","explanation":"*und zwar* introducing a specification = *specifically / to be exact*. Different from concessive *zwar … aber …* = *admittedly … but …*."},{"id":"tricky_naemlich_namely_001","kind":"choice","prompt":"Ich habe nur ein Problem, nämlich die Miete. (nämlich means…)","options":["namely / specifically","except","and also"],"answer":"namely / specifically","topic":"naemlich_namely","explanation":"*nämlich* spelling out a specific case = *namely*. Different from causal mid-sentence *nämlich* = *because / you see*."},{"id":"tricky_naemlich_because_001","kind":"choice","prompt":"Er kommt heute nicht. Er ist nämlich krank. (nämlich means…)","options":["namely","because / you see","also"],"answer":"because / you see","topic":"naemlich_because","explanation":"Mid-sentence *nämlich* gives an explanation = *because / you see*. Different from *nämlich* introducing a specific item = *namely*."},{"id":"tricky_eben_simply_001","kind":"choice","prompt":"So ist es eben. (eben means…)","options":["simply / just the way it is","not","again"],"answer":"simply / just the way it is","topic":"eben_simply","explanation":"Modal-particle *eben* expressing resignation = *simply / that's just how it is*. Compare temporal *eben* = *just now* or agreement *eben!* = *exactly!*."},{"id":"tricky_eben_just_now_001","kind":"choice","prompt":"Er ist eben angekommen. (eben means…)","options":["just now","never","slowly"],"answer":"just now","topic":"eben_just_now","explanation":"*eben* meaning *just now* (temporal). Compare *eben* meaning *exactly* (agreement) or *simply* (resignation)."},{"id":"tricky_eben_exactly_001","kind":"choice","prompt":"— Das ist unfair! — Eben! (eben means…)","options":["nonsense!","exactly!","maybe!"],"answer":"exactly!","topic":"eben_exactly","explanation":"Standalone *Eben!* = *exactly!* — emphatic agreement. Different from temporal *eben* = *just now* or resigned *eben* = *simply*."},{"id":"tricky_halt_simply_001","kind":"choice","prompt":"Das ist halt so in der Schweiz. (halt means…)","options":["simply / just the way it is","never","sometimes"],"answer":"simply / just the way it is","topic":"halt_simply","explanation":"Modal-particle *halt* (Southern German / Swiss equivalent of *eben*) expressing resignation = *that's just how it is*. Different from the imperative *Halt!* = *stop!*."},{"id":"tricky_halt_stop_001","kind":"choice","prompt":"Halt! Nicht weitergehen! (halt means…)","options":["hello","stop!","wait maybe"],"answer":"stop!","topic":"halt_stop","explanation":"Imperative *Halt!* = *stop!* — from the verb *halten*. Different from modal-particle *halt* = *simply / just the way it is*."},{"id":"tricky_eigentlich_actually_001","kind":"choice","prompt":"Was machst du eigentlich beruflich? (eigentlich means…)","options":["usually","actually / by the way","rarely"],"answer":"actually / by the way","topic":"eigentlich_actually","explanation":"Modal-particle *eigentlich* in a question = *actually / by the way*, broaching a new topic. Different from *eigentlich* = *originally* or *strictly speaking*."},{"id":"tricky_eigentlich_originally_001","kind":"choice","prompt":"Eigentlich wollte ich kommen, aber ich bin krank. (eigentlich means…)","options":["always","originally / I meant to","never"],"answer":"originally / I meant to","topic":"eigentlich_originally","explanation":"*eigentlich* + *wollte* = *originally / I had meant to* — a plan that didn't happen. Different from conversational *eigentlich* = *by the way*."},{"id":"tricky_eigentlich_strictly_speaking_001","kind":"choice","prompt":"Das ist eigentlich nicht erlaubt. (eigentlich means…)","options":["definitely","strictly speaking","probably"],"answer":"strictly speaking","topic":"eigentlich_strictly_speaking","explanation":"*eigentlich* qualifying a rule = *strictly speaking* (with an implied *but*). Different from *eigentlich* = *originally* or conversational *eigentlich* = *by the way*."},{"id":"tricky_sonst_otherwise_001","kind":"choice","prompt":"Beeil dich, sonst verpassen wir den Zug. (sonst means…)","options":["otherwise","however","first"],"answer":"otherwise","topic":"sonst_otherwise","explanation":"*sonst* meaning *otherwise* (consequence of not acting). Compare *sonst* = *else / any other* in questions, or *sonst* = *usually*."},{"id":"tricky_sonst_else_001","kind":"choice","prompt":"Haben Sie sonst noch Fragen? (sonst means…)","options":["again","any other / else","never"],"answer":"any other / else","topic":"sonst_else","explanation":"*sonst noch* in a question = *any other / else*. Different from *sonst* = *otherwise* (consequence) or *sonst* = *usually*."},{"id":"tricky_sonst_usually_001","kind":"choice","prompt":"Sonst trinke ich keinen Kaffee, aber heute brauche ich einen. (sonst means…)","options":["otherwise","usually / normally","finally"],"answer":"usually / normally","topic":"sonst_usually","explanation":"*sonst* contrasted with *heute* = *usually / normally*. Different from *sonst* = *otherwise* (warning) or *sonst* = *else*."},{"id":"tricky_ueberhaupt_at_all_001","kind":"choice","prompt":"Ich verstehe das überhaupt nicht. (überhaupt means…)","options":["at all","again","sometimes"],"answer":"at all","topic":"ueberhaupt_at_all","explanation":"*überhaupt* meaning *at all* — emphasising a negation. Different from *überhaupt* meaning *in general* or *in the first place*."},{"id":"tricky_ueberhaupt_even_001","kind":"choice","prompt":"Warst du überhaupt dort? (überhaupt means…)","options":["even / in the first place","already","still"],"answer":"even / in the first place","topic":"ueberhaupt_even","explanation":"*überhaupt* in a question challenging a premise = *even / in the first place*. Different from negation-intensifying *überhaupt* = *at all*."},{"id":"tricky_ueberhaupt_in_general_001","kind":"choice","prompt":"Überhaupt finde ich das eine gute Idee. (überhaupt means…)","options":["in general / on the whole","at least","barely"],"answer":"in general / on the whole","topic":"ueberhaupt_in_general","explanation":"Sentence-initial *überhaupt* = *in general / on the whole*. Different from negation-intensifying *überhaupt* = *at all*."},{"id":"tricky_ohnehin_anyway_001","kind":"choice","prompt":"Keine Sorge, ich gehe ohnehin einkaufen. (ohnehin means…)","options":["therefore","anyway / in any case","never"],"answer":"anyway / in any case","topic":"ohnehin_anyway","explanation":"*ohnehin* = *anyway / in any case* — the action is happening regardless. Near-synonym of *sowieso*. Different from *ohnehin* = *already / as it is*."},{"id":"tricky_ohnehin_already_001","kind":"choice","prompt":"Er ist ohnehin spät dran. (ohnehin means…)","options":["already / as it is","maybe","never"],"answer":"already / as it is","topic":"ohnehin_already","explanation":"*ohnehin* describing an existing situation = *already / as it is*. Different from plan-related *ohnehin* = *anyway*, this stresses the current state."},{"id":"tricky_jedenfalls_in_any_case_001","kind":"choice","prompt":"Ich komme jedenfalls. (jedenfalls means…)","options":["never","in any case / at any rate","therefore"],"answer":"in any case / at any rate","topic":"jedenfalls_in_any_case","explanation":"*jedenfalls* = *in any case / at any rate* — committing to an action regardless. Different from narrowing *jedenfalls* = *at least* (limiting a claim)."},{"id":"tricky_jedenfalls_at_least_001","kind":"choice","prompt":"Er hat es jedenfalls versucht. (jedenfalls means…)","options":["at least / anyway (narrowing claim)","first","definitely"],"answer":"at least / anyway (narrowing claim)","topic":"jedenfalls_at_least","explanation":"*jedenfalls* narrowing the scope of a claim = *at least he tried (whatever else is true)*. Different from commitment-style *jedenfalls* = *in any case*."},{"id":"tricky_immerhin_consolation_001","kind":"choice","prompt":"Es regnet, aber immerhin ist es warm. (immerhin means…)","options":["at least / after all (consolation)","always","barely"],"answer":"at least / after all (consolation)","topic":"immerhin_consolation","explanation":"*immerhin* as a silver lining = *at least* (consolation). Different from *immerhin* = *after all / considering*, which justifies leniency."},{"id":"tricky_immerhin_after_all_001","kind":"choice","prompt":"Immerhin ist er noch ein Kind. (immerhin means…)","options":["against expectation","after all / considering","never"],"answer":"after all / considering","topic":"immerhin_after_all","explanation":"*immerhin* introducing a mitigating fact = *after all / considering*. Different from *immerhin* offering a silver lining = *at least*."},{"id":"tricky_vielleicht_maybe_001","kind":"choice","prompt":"Vielleicht kommt er morgen. (vielleicht means…)","options":["definitely","maybe / perhaps","never"],"answer":"maybe / perhaps","topic":"vielleicht_maybe","explanation":"*vielleicht* meaning *maybe*. Modal-particle *vielleicht* can also express exasperation in exclamations or soften a suggestion."},{"id":"tricky_vielleicht_suggestion_001","kind":"choice","prompt":"Gehen wir vielleicht ins Kino? (vielleicht means…)","options":["definitely","maybe (suggestion softener)","again"],"answer":"maybe (suggestion softener)","topic":"vielleicht_suggestion","explanation":"Modal-particle *vielleicht* softening a proposal = *maybe we should …*. Different from epistemic *vielleicht* = *maybe / perhaps*."},{"id":"tricky_vielleicht_exclamation_001","kind":"choice","prompt":"Das ist vielleicht eine Frechheit! (vielleicht means…)","options":["maybe","quite some / really (exclamation)","not at all"],"answer":"quite some / really (exclamation)","topic":"vielleicht_exclamation","explanation":"Exclamatory *vielleicht* = *what a / really* — intensifying outrage, not hedging. Different from literal *vielleicht* = *maybe*."},{"id":"tricky_gerade_just_now_001","kind":"choice","prompt":"Er ist gerade angekommen. (gerade means…)","options":["never","just now / right now","eventually"],"answer":"just now / right now","topic":"gerade_just_now","explanation":"*gerade* meaning *just now / right now* — actions in progress at the moment of speech. Different from emphatic *gerade* = *exactly* or adjectival *gerade* = *straight*."},{"id":"tricky_gerade_exactly_001","kind":"choice","prompt":"Gerade das wollte ich sagen. (gerade means…)","options":["maybe","exactly / precisely (emphatic)","never"],"answer":"exactly / precisely (emphatic)","topic":"gerade_exactly","explanation":"Emphatic *gerade* highlighting a specific thing = *exactly / precisely that*. Different from temporal *gerade* = *just now*."},{"id":"tricky_gerade_straight_001","kind":"choice","prompt":"Der Weg ist gerade. (gerade means…)","options":["straight (geometric)","crooked","right now"],"answer":"straight (geometric)","topic":"gerade_straight","explanation":"*gerade* as an adjective/adverb = *straight*. Different from temporal *gerade* = *just now*."},{"id":"tricky_gerade_of_all_001","kind":"choice","prompt":"Warum gerade ich? (gerade means…)","options":["of all people (emphatic)","always","never"],"answer":"of all people (emphatic)","topic":"gerade_of_all","explanation":"*gerade* emphasising an unwelcome choice = *of all people*. Different from temporal *gerade* = *just now* or geometric *gerade* = *straight*."},{"id":"tricky_gleich_right_away_001","kind":"choice","prompt":"Ich komme gleich. (gleich means…)","options":["never","right away / in a moment","yesterday"],"answer":"right away / in a moment","topic":"gleich_right_away","explanation":"Temporal *gleich* = *right away / in a moment*. Different from comparative *gleich* = *the same* or idiomatic *mir gleich* = *doesn't matter*."},{"id":"tricky_gleich_same_001","kind":"choice","prompt":"Wir sind gleich alt. (gleich means…)","options":["the same age","already old","rarely"],"answer":"the same age","topic":"gleich_same","explanation":"*gleich* as a comparative adjective = *the same*. Different from temporal *gleich* = *in a moment*."},{"id":"tricky_gleich_doesnt_matter_001","kind":"choice","prompt":"Das ist mir gleich. (gleich means…)","options":["painful","all the same / doesn't matter","interesting"],"answer":"all the same / doesn't matter","topic":"gleich_doesnt_matter","explanation":"Idiomatic *mir gleich* = *all the same to me / doesn't matter*. Different from temporal *gleich* = *right away* or comparative *gleich* = *the same*."},{"id":"tricky_sogar_even_001","kind":"choice","prompt":"Er kann sogar Chinesisch. (sogar means…)","options":["never","even (adds surprise)","rarely"],"answer":"even (adds surprise)","topic":"sogar_even","explanation":"*sogar* adding a surprising extra = *even*. Compare *noch* = *even* (intensifying a comparative); *sogar* spotlights an unexpected item."},{"id":"tricky_sogar_even_002","kind":"choice","prompt":"Heute ist es sogar besser als gestern. (sogar means…)","options":["finally","even (intensifying comparative)","barely"],"answer":"even (intensifying comparative)","topic":"sogar_even","explanation":"*sogar* before a comparative = *even (better)*, marking surprise at the degree. Compare *noch besser* = *still better*, a more neutral intensifier."},{"id":"tricky_einfach_just_001","kind":"choice","prompt":"Du denkst zu viel — mach es einfach! (einfach means…)","options":["with difficulty","just do it (modal particle)","never"],"answer":"just do it (modal particle)","topic":"einfach_just","explanation":"Modal-particle *einfach* = *just (do it)* — urging direct action. Different from adjectival *einfach* = *easy* or ticket *einfach* = *one-way*."},{"id":"tricky_einfach_easy_001","kind":"choice","prompt":"Dieses Problem ist ziemlich einfach. (einfach means…)","options":["easy (not difficult)","just","one-way"],"answer":"easy (not difficult)","topic":"einfach_easy","explanation":"Adjectival *einfach* = *easy / simple*. Different from modal-particle *einfach* = *just (do it)* or ticket *einfach* = *one-way*."},{"id":"tricky_einfach_one_way_001","kind":"choice","prompt":"Eine einfache Fahrt nach Bern, bitte. (einfach means…)","options":["easy","one-way","expensive"],"answer":"one-way","topic":"einfach_one_way","explanation":"*einfache Fahrt* = *one-way trip* (vs. *Hin- und Rückfahrt*). Different from adjectival *einfach* = *easy* or modal-particle *einfach* = *just*."},{"id":"tricky_lediglich_merely_001","kind":"choice","prompt":"Es war lediglich ein Missverständnis. (lediglich means…)","options":["finally","merely / just","never"],"answer":"merely / just","topic":"lediglich_merely","explanation":"*lediglich* = *merely / just*, downplaying the seriousness — a formal cousin of *nur*. Different from softening *lediglich* used to make a request modest."},{"id":"tricky_lediglich_softening_001","kind":"choice","prompt":"Ich möchte lediglich eine Frage stellen. (lediglich means…)","options":["definitely","just / only (softening)","always"],"answer":"just / only (softening)","topic":"lediglich_softening","explanation":"*lediglich* softening a request = *just / only* — formal politeness marker. Different from dismissive *lediglich* = *merely* (downplaying an event)."},{"id":"tricky_wenigstens_at_least_001","kind":"choice","prompt":"Wenigstens du bist da! (wenigstens means…)","options":["finally","at least (relief)","maybe"],"answer":"at least (relief)","topic":"wenigstens_at_least","explanation":"*wenigstens* expressing relief = *at least* (small comfort). Different from *wenigstens* as a bare-minimum demand, and from quantitative *mindestens* = *at least N*."},{"id":"tricky_wenigstens_bare_minimum_001","kind":"choice","prompt":"Sag wenigstens Hallo! (wenigstens means…)","options":["also","at least (bare minimum ask)","never"],"answer":"at least (bare minimum ask)","topic":"wenigstens_bare_minimum","explanation":"*wenigstens* demanding the bare minimum = *at least say hello*. Different from consoling *wenigstens* = *at least (relief)*, and from numerical *mindestens*."},{"id":"tricky_mindestens_at_least_001","kind":"choice","prompt":"Das kostet mindestens 100 Euro. (mindestens means…)","options":["at least (quantitative)","at most","usually"],"answer":"at least (quantitative)","topic":"mindestens_at_least","explanation":"*mindestens* = *at least* with numbers — a lower bound. Different from emotional *wenigstens* = *at least (relief / minimum ask)*."},{"id":"tricky_mindestens_at_least_002","kind":"choice","prompt":"Wir brauchen mindestens drei Stunden. (mindestens means…)","options":["at most","at least (time/quantity)","never"],"answer":"at least (time/quantity)","topic":"mindestens_at_least","explanation":"*mindestens* with a duration = *at least N hours* — a quantitative floor. Different from emotive *wenigstens* = *at least (relief)*."}]},{"id":"vocabulary","name":"Vocabulary","icon":"📖","color":"#8b5cf6","description":"A1/A2 German vocabulary: gender, German→English, and English→German.","items":[{"id":"vocab_gender_mann","kind":"choice","prompt":"Mann","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Mann* — most male persons are masculine, no surprise."},{"id":"vocab_gender_hund","kind":"choice","prompt":"Hund","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Hund* — most larger animals default to masculine in German."},{"id":"vocab_gender_apfel","kind":"choice","prompt":"Apfel","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Apfel* — fruit names are mostly feminine, but *Apfel* is the classic exception."},{"id":"vocab_gender_tisch","kind":"choice","prompt":"Tisch","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Tisch* — common collocation *am Tisch sitzen* (to sit at the table)."},{"id":"vocab_gender_stuhl","kind":"choice","prompt":"Stuhl","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Stuhl* — pairs with *der Tisch*; plural is *die Stühle* with umlaut."},{"id":"vocab_gender_garten","kind":"choice","prompt":"Garten","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Garten* — collocation *im Garten arbeiten* (to work in the garden)."},{"id":"vocab_gender_tag","kind":"choice","prompt":"Tag","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: days of the week, months, and seasons are all masculine — *der Tag, der Montag, der Sommer*."},{"id":"vocab_gender_bruder","kind":"choice","prompt":"Bruder","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Bruder* — male family members are masculine; plural *die Brüder*."},{"id":"vocab_gender_vater","kind":"choice","prompt":"Vater","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Vater* — male family role; plural *die Väter* takes umlaut."},{"id":"vocab_gender_lehrer","kind":"choice","prompt":"Lehrer","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *-er* agent nouns are typically masculine — *der Lehrer* = (male) teacher."},{"id":"vocab_gender_kaffee","kind":"choice","prompt":"Kaffee","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: *der Kaffee* — most hot drinks are masculine (*der Tee*, *der Kakao*)."},{"id":"vocab_gender_bahnhof","kind":"choice","prompt":"Bahnhof","options":["der","die","das"],"answer":"der","topic":"gender_m","explanation":"Masculine: compound takes the gender of its last part — *der Hof* → *der Bahnhof*."},{"id":"vocab_gender_frau","kind":"choice","prompt":"Frau","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Frau* — female persons are feminine, no surprise."},{"id":"vocab_gender_katze","kind":"choice","prompt":"Katze","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Katze* is the generic word for cat; the male is *der Kater*."},{"id":"vocab_gender_lampe","kind":"choice","prompt":"Lampe","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: most nouns ending in *-e* are feminine — *die Lampe, die Tasche, die Blume*."},{"id":"vocab_gender_tuer","kind":"choice","prompt":"Tür","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Tür* — collocation *die Tür öffnen / schließen* (to open / close the door)."},{"id":"vocab_gender_strasse","kind":"choice","prompt":"Straße","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: nouns ending in *-e* are typically feminine — *die Straße* (street, road)."},{"id":"vocab_gender_schule","kind":"choice","prompt":"Schule","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *-e* ending makes it feminine — *die Schule*; *in die Schule gehen* (to go to school)."},{"id":"vocab_gender_mutter","kind":"choice","prompt":"Mutter","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Mutter* — female family role; plural *die Mütter* with umlaut."},{"id":"vocab_gender_schwester","kind":"choice","prompt":"Schwester","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Schwester* — female family member; pairs with *der Bruder*."},{"id":"vocab_gender_milch","kind":"choice","prompt":"Milch","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Milch* — just memorize; uncountable in everyday use."},{"id":"vocab_gender_uhr","kind":"choice","prompt":"Uhr","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *die Uhr* — also used for clock time, as in *Wie viel Uhr ist es?*"},{"id":"vocab_gender_familie","kind":"choice","prompt":"Familie","options":["der","die","das"],"answer":"die","topic":"gender_f","explanation":"Feminine: *-ie* ending is reliably feminine — *die Familie, die Industrie, die Linie*."},{"id":"vocab_gender_kind","kind":"choice","prompt":"Kind","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Kind* — children are grammatically neuter regardless of biological sex."},{"id":"vocab_gender_buch","kind":"choice","prompt":"Buch","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Buch* — plural *die Bücher* with umlaut and *-er*."},{"id":"vocab_gender_auto","kind":"choice","prompt":"Auto","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Auto* — short for *das Automobil*; most *-o* loanwords are neuter."},{"id":"vocab_gender_haus","kind":"choice","prompt":"Haus","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Haus* — collocation *nach Hause gehen* (to go home); plural *die Häuser*."},{"id":"vocab_gender_brot","kind":"choice","prompt":"Brot","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Brot* — most basic foods just need to be memorized."},{"id":"vocab_gender_wasser","kind":"choice","prompt":"Wasser","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Wasser* — like many liquids and elements, neuter by default."},{"id":"vocab_gender_fenster","kind":"choice","prompt":"Fenster","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Fenster* — exception to the *-er* masculine rule (it is not an agent noun)."},{"id":"vocab_gender_fahrrad","kind":"choice","prompt":"Fahrrad","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: compound takes gender of the last part — *das Rad* → *das Fahrrad*."},{"id":"vocab_gender_hotel","kind":"choice","prompt":"Hotel","options":["der","die","das"],"answer":"das","topic":"gender_n","explanation":"Neuter: *das Hotel* — most foreign loanwords ending in *-el* are neuter."},{"id":"vocab_apfel_en","kind":"text","prompt":"Apfel","answer":"apple","alts":["the apple","an apple","Apple"],"topic":"vocab_a1_food","explanation":"Noun: *der Apfel* (masculine) — plural *die Äpfel* takes umlaut."},{"id":"vocab_brot_en","kind":"text","prompt":"Brot","answer":"bread","alts":["the bread","Bread"],"topic":"vocab_a1_food","explanation":"Noun: *das Brot* (neuter) — a *Brötchen* is a small bread roll."},{"id":"vocab_kaese_en","kind":"text","prompt":"Käse","answer":"cheese","alts":["the cheese","Cheese"],"topic":"vocab_a1_food","explanation":"Noun: *der Käse* (masculine) — usually uncountable, like English *cheese*."},{"id":"vocab_milch_en","kind":"text","prompt":"Milch","answer":"milk","alts":["the milk","Milk"],"topic":"vocab_a1_food","explanation":"Noun: *die Milch* (feminine) — uncountable; collocation *ein Glas Milch*."},{"id":"vocab_wasser_en","kind":"text","prompt":"Wasser","answer":"water","alts":["the water","Water"],"topic":"vocab_a1_food","explanation":"Noun: *das Wasser* (neuter) — common request *ein Glas Wasser, bitte*."},{"id":"vocab_haus_en","kind":"text","prompt":"Haus","answer":"house","alts":["the house","House"],"topic":"vocab_a1_home","explanation":"Noun: *das Haus* (neuter) — fixed phrase *nach Hause* (toward home)."},{"id":"vocab_tisch_en","kind":"text","prompt":"Tisch","answer":"table","alts":["the table","Table"],"topic":"vocab_a1_home","explanation":"Noun: *der Tisch* (masculine) — collocation *am Tisch* (at the table)."},{"id":"vocab_stuhl_en","kind":"text","prompt":"Stuhl","answer":"chair","alts":["the chair","Chair"],"topic":"vocab_a1_home","explanation":"Noun: *der Stuhl* (masculine) — plural *die Stühle*; contrast with *der Sessel* (armchair)."},{"id":"vocab_buch_en","kind":"text","prompt":"Buch","answer":"book","alts":["the book","Book"],"topic":"vocab_a1_school","explanation":"Noun: *das Buch* (neuter) — plural *die Bücher* with umlaut and *-er*."},{"id":"vocab_schule_en","kind":"text","prompt":"Schule","answer":"school","alts":["the school","School"],"topic":"vocab_a1_school","explanation":"Noun: *die Schule* (feminine) — *in die Schule gehen* (to go to school), no article in English idiom."},{"id":"vocab_mutter_en","kind":"text","prompt":"Mutter","answer":"mother","alts":["the mother","mom","Mother"],"topic":"vocab_a1_family","explanation":"Noun: *die Mutter* (feminine) — informal *Mama*; plural *die Mütter*."},{"id":"vocab_vater_en","kind":"text","prompt":"Vater","answer":"father","alts":["the father","dad","Father"],"topic":"vocab_a1_family","explanation":"Noun: *der Vater* (masculine) — informal *Papa*; plural *die Väter*."},{"id":"vocab_bruder_en","kind":"text","prompt":"Bruder","answer":"brother","alts":["the brother","Brother"],"topic":"vocab_a1_family","explanation":"Noun: *der Bruder* (masculine) — plural *die Brüder*; pairs with *die Schwester*."},{"id":"vocab_schwester_en","kind":"text","prompt":"Schwester","answer":"sister","alts":["the sister","Sister"],"topic":"vocab_a1_family","explanation":"Noun: *die Schwester* (feminine) — plural *die Schwestern* (no umlaut)."},{"id":"vocab_hund_en","kind":"text","prompt":"Hund","answer":"dog","alts":["the dog","Dog"],"topic": <script>(function (global) {
  const DECK_KEY_PREFIX = 'gd_deck_';
  const GLOBAL_KEY = 'gd_global';
  const MIGRATED_MARKER = 'migrated_to_idb';

  let storageMap = new Map();
  let backend = null;
  let initPromise = null;
  let degraded = false;

  function ls() { return global.localStorage; }

  function isManagedKey(k) {
    return k === GLOBAL_KEY || k === MIGRATED_MARKER || (typeof k === 'string' && k.startsWith(DECK_KEY_PREFIX));
  }

  function makeIdbBackend() {
    const DB_NAME = 'gd_storage';
    const STORE = 'kv';
    const VERSION = 1;
    let dbPromise = null;

    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open(DB_NAME, VERSION); } catch (e) { reject(e); return; }
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('indexedDB open blocked'));
      });
      return dbPromise;
    }

    function hydrate() {
      return open().then(db => new Promise((resolve, reject) => {
        const map = new Map();
        const tx = db.transaction(STORE, 'readonly');
        const store = tx.objectStore(STORE);
        const req = store.openCursor();
        req.onsuccess = () => {
          const c = req.result;
          if (!c) { resolve(map); return; }
          try {
            const v = typeof c.value === 'string' ? JSON.parse(c.value) : c.value;
            map.set(c.key, v);
          } catch (err) {
            console.warn('[gd-storage] malformed value on hydrate, key:', c.key, err);
          }
          c.continue();
        };
        req.onerror = () => reject(req.error);
      }));
    }

    function putOnce(key, value) {
      return open().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('transaction aborted'));
        tx.objectStore(STORE).put(JSON.stringify(value), key);
      }));
    }

    function put(key, value) {
      return putOnce(key, value).catch(err => {
        console.warn('[gd-storage] idb put failed, retrying in 500ms:', key, err);
        return new Promise(r => setTimeout(r, 500)).then(() => putOnce(key, value));
      }).catch(err => {
        console.warn('[gd-storage] idb put failed after retry:', key, err);
      });
    }

    function del(key) {
      return open().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.objectStore(STORE).delete(key);
      })).catch(err => console.warn('[gd-storage] idb del failed:', key, err));
    }

    return { hydrate, put, del };
  }

  function makeLocalStorageBackend() {
    function hydrate() {
      const m = new Map();
      const store = ls();
      if (!store) return Promise.resolve(m);
      for (let i = 0; i < store.length; i++) {
        const k = store.key(i);
        if (!isManagedKey(k)) continue;
        try { m.set(k, JSON.parse(store.getItem(k))); }
        catch (err) { console.warn('[gd-storage] localStorage backend: malformed value, key:', k); }
      }
      return Promise.resolve(m);
    }
    function put(k, v) {
      try { ls().setItem(k, JSON.stringify(v)); } catch (err) { console.warn('[gd-storage] ls put failed:', k, err); }
      return Promise.resolve();
    }
    function del(k) {
      try { ls().removeItem(k); } catch (err) { console.warn('[gd-storage] ls del failed:', k, err); }
      return Promise.resolve();
    }
    return { hydrate, put, del };
  }

  function requestPersistentStorage() {
    if (typeof navigator === 'undefined') return;
    if (!navigator.storage || typeof navigator.storage.persist !== 'function') return;
    try {
      const p = navigator.storage.persist();
      if (p && typeof p.then === 'function') {
        p.then(granted => console.log('[gd-storage] persistent storage:', granted ? 'granted' : 'denied'))
         .catch(err => console.warn('[gd-storage] persist() rejected:', err));
      }
    } catch (err) {
      console.warn('[gd-storage] persist() threw:', err);
    }
  }

  function pickDefaultBackend() {
    if (typeof indexedDB !== 'undefined') {
      try { return makeIdbBackend(); } catch (e) { console.warn('[gd-storage] idb constructor threw:', e); }
    }
    return makeLocalStorageBackend();
  }

  function safePut(key, value) {
    if (!backend) return;
    try {
      const p = backend.put(key, value);
      if (p && typeof p.catch === 'function') {
        p.catch(err => console.warn('[gd-storage] put failed:', key, err));
      }
    } catch (err) {
      console.warn('[gd-storage] put threw:', key, err);
    }
  }

  function loadDeck(deckId) {
    const v = storageMap.get(DECK_KEY_PREFIX + deckId);
    return v == null ? null : v;
  }

  function saveDeck(deckId, state) {
    const key = DECK_KEY_PREFIX + deckId;
    storageMap.set(key, state);
    safePut(key, state);
  }

  function loadGlobal() {
    const v = storageMap.get(GLOBAL_KEY);
    return v == null ? null : v;
  }

  function saveGlobal(state) {
    storageMap.set(GLOBAL_KEY, state);
    safePut(GLOBAL_KEY, state);
  }

  function listDeckIds() {
    const ids = [];
    for (const key of storageMap.keys()) {
      if (typeof key === 'string' && key.startsWith(DECK_KEY_PREFIX)) {
        ids.push(key.slice(DECK_KEY_PREFIX.length));
      }
    }
    return ids;
  }

  function exportAll() {
    const data = {};
    const g = storageMap.get(GLOBAL_KEY);
    if (g != null) data[GLOBAL_KEY] = g;
    for (const id of listDeckIds()) {
      const v = storageMap.get(DECK_KEY_PREFIX + id);
      if (v != null) data[DECK_KEY_PREFIX + id] = v;
    }
    return { version: 1, exported: new Date().toISOString(), data: data };
  }

  function importAll(backup) {
    if (!backup || typeof backup !== 'object') return false;
    if (backup.version !== 1) return false;
    if (!backup.data || typeof backup.data !== 'object') return false;
    for (const key in backup.data) {
      if (isManagedKey(key) && key !== MIGRATED_MARKER) {
        storageMap.set(key, backup.data[key]);
        safePut(key, backup.data[key]);
      }
    }
    return true;
  }

  function isDegraded() { return degraded; }

  function readLegacyLocalStorageEntries() {
    const out = [];
    const store = ls();
    if (!store) return out;
    const keysToCheck = [];
    for (let i = 0; i < store.length; i++) {
      const k = store.key(i);
      if (k === GLOBAL_KEY || (typeof k === 'string' && k.startsWith(DECK_KEY_PREFIX))) {
        keysToCheck.push(k);
      }
    }
    for (const k of keysToCheck) {
      const raw = store.getItem(k);
      try {
        out.push({ key: k, value: JSON.parse(raw) });
      } catch (err) {
        console.warn('[gd-storage] malformed legacy key, skipping:', k);
      }
    }
    return out;
  }

  function clearLegacyLocalStorageKeys() {
    const store = ls();
    if (!store) return;
    const keys = [];
    for (let i = 0; i < store.length; i++) {
      const k = store.key(i);
      if (k === GLOBAL_KEY || (typeof k === 'string' && k.startsWith(DECK_KEY_PREFIX))) {
        keys.push(k);
      }
    }
    for (const k of keys) store.removeItem(k);
  }

  async function migrateLegacyIntoBackend() {
    const entries = readLegacyLocalStorageEntries();
    if (entries.length === 0) {
      const marker = { at: new Date().toISOString(), count: 0 };
      storageMap.set(MIGRATED_MARKER, marker);
      try { await backend.put(MIGRATED_MARKER, marker); } catch (err) { console.warn('[gd-storage] marker put failed:', err); }
      return;
    }
    for (const { key, value } of entries) {
      storageMap.set(key, value);
      try { await backend.put(key, value); } catch (err) { console.warn('[gd-storage] migrate put failed:', key, err); }
    }
    const marker = { at: new Date().toISOString(), count: entries.length };
    storageMap.set(MIGRATED_MARKER, marker);
    try { await backend.put(MIGRATED_MARKER, marker); } catch (err) { console.warn('[gd-storage] marker put failed:', err); }
    clearLegacyLocalStorageKeys();
    console.log('[gd-storage] migrated', entries.length, 'legacy key(s) from localStorage');
  }

  function init() {
    if (initPromise) return initPromise;
    initPromise = (async () => {
      if (!backend) backend = pickDefaultBackend();
      try {
        storageMap = await backend.hydrate();
      } catch (err) {
        console.warn('[gd-storage] primary backend hydrate failed, falling back to localStorage:', err);
        degraded = true;
        backend = makeLocalStorageBackend();
        try {
          storageMap = await backend.hydrate();
        } catch (err2) {
          console.warn('[gd-storage] fallback hydrate failed too - starting empty:', err2);
          storageMap = new Map();
        }
      }
      if (!storageMap.has(MIGRATED_MARKER)) {
        await migrateLegacyIntoBackend();
      }
      requestPersistentStorage();
    })();
    return initPromise;
  }

  function _reset() {
    storageMap = new Map();
    backend = null;
    initPromise = null;
    degraded = false;
  }
  function _setBackend(b) { backend = b; }
  function _getBackend() { return backend; }
  function _getMap() { return storageMap; }

  const Storage = {
    loadDeck, saveDeck, loadGlobal, saveGlobal,
    listDeckIds, exportAll, importAll,
    init, isDegraded,
    _reset, _setBackend, _getBackend, _getMap,
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = Storage;
  } else {
    global.Storage = Storage;
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>

    [13, 'Vergiss nicht, …!', "Don't forget to …!", 'Und vergiss nicht, es deiner Mutter zu sagen.', "And don't forget to tell your mother."],
    [13, 'froh', 'glad', 'Ich bin so froh, dass wir nicht heiraten.', "I'm so glad that we're not getting married."],
    [13, 'unmöglich', 'impossible', 'Heute war es wirklich, wirklich … unmöglich.', 'Today it was really, really … impossible.'],
  ];

  /* Headwords that are core vocabulary at CEFR level A2 (Goethe-Institut A2 word
     list). A1 words are not in the deck at all. The "hide A2" toggle skips these
     cards for learners who already know A2 or want a shorter round. Cards whose
     word is on the list but whose card teaches a different sense, an idiom, or
     a particle are deliberately NOT tagged. */
  const A2_CORE = new Set([
    'verliebt sein in (+Akk)', 'Es ist vorbei!', 'süß', 'nebenan', 'Pass auf!', 'reich',
    'sich erinnern (an +Akk)', 'komisch', 'blöd', '…, nicht wahr?', 'schrecklich', 'arm', 'nennen',
    'verpassen', 'tragen', 'statt', 'Kann ich Ihnen helfen?', 'erkältet sein', 'Am besten …', 'echt',
    'bestellen', 'genug', 'schon mal (schon einmal)', 'ausgehen', 'die Pflanze, -n', 'noch nie',
    'leer', 'Wer war das?', 'Wäsche waschen', 'Nicht ganz.', 'die Rechnung, -en',
    'der Chef, die Chefin', 'kündigen', 'Geld ausgeben', 'sparen', 'fleißig', 'hart gekocht',
    'Das geht nicht!', 'sogar', 'Das macht nichts.', 'deshalb', 'als … arbeiten', 'reden über (+Akk)',
    'die Zeitschrift, -en', 'Es geht um …', 'probieren', 'spannend', 'Gut gemacht!',
    'sich (Dat) etwas ansehen', 'sauber, schmutzig', 'der Unterschied, -e', 'Das heißt, …',
    'spazieren gehen', 'weg sein', 'sich (Dat) eine Wohnung teilen', 'die Reinigung', 'die Ampel, -n',
    'der Müll', 'niemand', 'kein … mehr', 'unternehmen', 'jemand anders', 'endlich',
    'das Gepäck verlieren', 'Ich war es nicht!', 'ausgehen mit (+Dat)', 'ein Paar sein', 'sich ändern',
    'der Rücken, -', 'streng', 'So geht das nicht!', 'sich (Dat) etwas leihen', 'die Heizung, -en',
    'der Zettel, -', 'das Stück, -e', 'berichten über (+Akk)', 'Recht haben', 'berühmt', 'sterben',
    'der Unfall, -fälle', 'erstens, zweitens', 'das Plakat', 'aufpassen auf (+Akk)',
    'jemandem Bescheid sagen', 'außer (+Dat)', 'unbedingt', 'denken an (+Akk)',
    'Ich kann das erklären!', 'fast', 'weil', 'furchtbar', 'zuhören (+Dat)', 'überall', 'noch mal',
    'einpacken', 'übersetzen', 'Man weiß nie, was passiert.', 'dort drüben', 'Das kann nicht sein!',
    'am liebsten', 'schwierig', 'üben', 'Wem …?', 'die Mannschaft', 'gewinnen, verlieren',
    'vorbereiten', 'wenigstens', 'langweilig', 'besonders', 'schlimm', 'jeden Moment', 'Wen …?',
    'die Feier, feiern', 'buchen', 'Was steht in …?', 'mieten', 'dafür', 'plötzlich', 'merken',
    'hoffen', 'stark', 'noch nicht', 'froh',
  ]);

  /* ---------- pure logic (exercised directly by tests) ---------- */

  // Stable per-card identity. Episode is part of the key so a term that
  // genuinely recurs in two episodes is scheduled independently.
  function keyOf(row) { return row[0] + '|' + row[1]; }

  // Indices into `data` for the current episode filter. `sel` is a set-like
  // object of episode number -> truthy. `hide` is an optional Set of German
  // headwords to skip (the A2 filter passes A2_CORE).
  function activeIndices(data, all, sel, hide) {
    const out = [];
    for (let i = 0; i < data.length; i++) {
      if (hide && hide.has(data[i][1])) continue;
      if (all || (sel && sel[data[i][0]])) out.push(i);
    }
    return out;
  }

  function isDue(entry, now) { return !entry || entry.d <= now; }

  // Leitner step. A miss drops all the way back to box 0 (due immediately);
  // a hit moves one box further out, capped at the last interval.
  function nextEntry(entry, correct, now) {
    const box = correct ? Math.min((entry ? entry.b : 0) + 1, INTERVALS.length - 1) : 0;
    return { b: box, d: now + INTERVALS[box] * DAY };
  }

  function dueIndices(data, indices, progress, now) {
    return indices.filter(i => isDue(progress[keyOf(data[i])], now));
  }

  // Fisher-Yates over a copy. `rnd` defaults to Math.random; tests inject one.
  function shuffle(arr, rnd) {
    const r = rnd || Math.random;
    const out = arr.slice();
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  function summarize(data, indices, progress, now) {
    let fresh = 0, learning = 0, solid = 0, due = 0;
    for (const i of indices) {
      const p = progress[keyOf(data[i])];
      if (!p) fresh++;
      else if (p.b >= MASTERED_BOX) solid++;
      else learning++;
      if (isDue(p, now)) due++;
    }
    return { total: indices.length, fresh, learning, solid, due };
  }

  // Anki-friendly TSV: German, English, example, translation, tag.
  function toTSV(data, indices) {
    return indices.map(i => {
      const r = data[i];
      const ep = r[0] < 10 ? '0' + r[0] : String(r[0]);
      return [r[1], r[2], r[3], r[4], 'extra ep' + ep].join('\t');
    }).join('\n');
  }

  /* ---------- persistence (through the app's storage seam) ---------- */

  function loadRecord() {
    const S = global.Storage;
    if (!S || !S.loadDeck) return null;
    return S.loadDeck(DECK_ID);
  }

  // The A2 filter setting rides in the same record as the card progress, so it
  // survives reloads and Export / Import like everything else.
  function saveProgress(progress) {
    const S = global.Storage;
    if (!S || !S.saveDeck) return;
    S.saveDeck(DECK_ID, { deckId: DECK_ID, version: 1, kind: 'extra-vocab', cards: progress, hideA2: hideA2 });
  }

  /* ---------- view ---------- */

  let view = null;          // the mounted root element, or null when closed
  let onCloseHook = null;
  let all = true;
  let sel = {};
  let dir = 'de';           // 'de' = German first, 'en' = English first
  let hideA2 = false;       // true = skip cards tagged in A2_CORE
  let progress = {};
  let queue = [];
  let current = null;       // index into DATA, or null
  let shown = false;
  let resetArmed = false;
  let resetTimer = null;

  function isOpen() { return view !== null; }
  function $x(id) { return view && view.querySelector('#' + id); }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function indices() { return activeIndices(DATA, all, sel, hideA2 ? A2_CORE : null); }

  function build() {
    queue = shuffle(dueIndices(DATA, indices(), progress, Date.now()));
    current = null;
    shown = false;
  }

  function next() {
    shown = false;
    current = queue.length ? queue.shift() : null;
    render();
  }

  function renderPicker() {
    let h = '<button type="button" class="xv-ep xv-ep-all' + (all ? ' xv-on' : '') +
            '" data-ep="all" aria-pressed="' + all + '">Alle Folgen</button>';
    for (let e = 1; e <= EPISODES.length; e++) {
      const on = !all && !!sel[e];
      h += '<button type="button" class="xv-ep' + (on ? ' xv-on' : '') + '" data-ep="' + e +
           '" aria-pressed="' + on + '"><b>' + (e < 10 ? '0' + e : e) + '</b><span>' +
           esc(EPISODES[e - 1]) + '</span></button>';
    }
    $x('ex-eps').innerHTML = h;
  }

  function renderStats() {
    const s = summarize(DATA, indices(), progress, Date.now());
    $x('ex-count').textContent = s.total + (s.total === 1 ? ' Karte' : ' Karten');
    $x('ex-stats').textContent =
      'Diese Runde noch: ' + (queue.length + (current === null ? 0 : 1)) +
      ' · neu: ' + s.fresh + ' · im Lernen: ' + s.learning + ' · gefestigt: ' + s.solid;
  }

  function gradesHTML() {
    return '<div class="xv-gradehead">Wusstest du es?</div><div class="xv-grades">' +
      '<button type="button" class="xv-g0" data-g="0">Nein' +
        '<small><kbd>1</kbd>kommt in dieser Runde wieder</small></button>' +
      '<button type="button" class="xv-g1" data-g="1">Ja' +
        '<small><kbd>2</kbd>für heute erledigt</small></button></div>';
  }

  function render() {
    const c = $x('ex-card');
    if (!c) return;
    if (current === null) {
      c.className = 'xv-idle';
      c.removeAttribute('role');
      c.removeAttribute('tabindex');
      c.innerHTML = '<div class="xv-empty">Für diese Auswahl ist gerade nichts fällig.<br>' +
        'Wähl weitere Folgen dazu oder komm später wieder.</div>';
      $x('ex-controls').innerHTML = '';
      renderStats();
      return;
    }
    c.setAttribute('role', 'button');
    c.setAttribute('tabindex', '0');
    const row = DATA[current];
    const front = dir === 'de' ? row[1] : row[2];
    const back = dir === 'de' ? row[2] : row[1];
    let h = '<div class="xv-term' + (front.length > 26 ? ' xv-small' : '') + '">' + esc(front) + '</div>';
    if (shown) {
      h += '<div class="xv-answer"><div class="xv-gloss">' + esc(back) + '</div>' +
           '<div class="xv-ex">' + esc(row[3]) + '</div>' +
           '<div class="xv-ex-en">' + esc(row[4]) + '</div></div>' +
           '<div class="xv-tag">Folge ' + row[0] + ' · ' + esc(EPISODES[row[0] - 1]) +
           (A2_CORE.has(row[1]) ? ' · A2' : '') + '</div>';
      c.className = 'xv-rev';
    } else {
      h += '<div class="xv-hint">Antippen oder Leertaste zum Umdrehen</div>';
      c.className = '';
    }
    c.innerHTML = h;
    $x('ex-controls').innerHTML = shown
      ? gradesHTML()
      : '<div class="xv-flipbar"><button type="button" id="ex-flip">Umdrehen</button></div>';
    renderStats();
  }

  function flip() {
    if (current !== null && !shown) { shown = true; render(); }
  }

  function grade(g) {
    if (current === null || !shown) return;
    const k = keyOf(DATA[current]);
    progress[k] = nextEntry(progress[k], g === 1, Date.now());
    // A miss comes back a few cards later in the same round.
    if (g === 0) queue.splice(Math.min(queue.length, 4), 0, current);
    saveProgress(progress);
    next();
  }

  function closePanel() { const p = $x('ex-panel'); if (p) p.innerHTML = ''; }

  function disarmReset() {
    resetArmed = false;
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    const b = $x('ex-reset');
    if (b) { b.textContent = 'Fortschritt löschen'; b.className = ''; }
  }

  function dirLabel() {
    $x('ex-dir').textContent = dir === 'de' ? 'Richtung: DE → EN' : 'Richtung: EN → DE';
  }

  function levelLabel() {
    const b = $x('ex-lvl');
    b.textContent = hideA2 ? 'A2-Wörter: ausgeblendet' : 'A2-Wörter: sichtbar';
    b.setAttribute('aria-pressed', String(hideA2));
    b.title = 'Blendet Grundwortschatz auf Niveau A2 aus – für Fortgeschrittene oder wenn es schnell gehen soll.';
  }

  function openExport() {
    const p = $x('ex-panel');
    if (p.innerHTML) { closePanel(); return; }
    const idx = indices();
    const tsv = toTSV(DATA, idx);
    p.innerHTML = '<div class="xv-panel"><p>' + idx.length + ' Karten, tab-getrennt: Deutsch · Englisch · ' +
      'Beispiel · Übersetzung · Tag. In Anki über „Datei → Importieren“ einlesen, Feldtrenner Tab, letzte Spalte als Tags.</p>' +
      '<textarea id="ex-tsv" readonly></textarea>' +
      '<p style="margin:8px 0 0"><button type="button" id="ex-copy">Kopieren</button> ' +
      '<button type="button" id="ex-dl">Als Datei speichern</button></p></div>';
    $x('ex-tsv').value = tsv;
    $x('ex-copy').onclick = function () {
      const btn = this;
      const done = ok => {
        btn.textContent = ok ? 'Kopiert' : 'Bitte manuell kopieren';
        setTimeout(() => { btn.textContent = 'Kopieren'; }, 2500);
      };
      const ta = $x('ex-tsv');
      ta.focus();
      ta.select();
      if (global.navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tsv).then(() => done(true), () => done(legacyCopy()));
        return;
      }
      done(legacyCopy());
    };
    $x('ex-dl').onclick = function () {
      const btn = this;
      try {
        const blob = new Blob([tsv], { type: 'text/tab-separated-values' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'extra-vokabeln.tsv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        btn.textContent = 'Download blockiert – bitte kopieren';
      }
    };
  }

  function legacyCopy() {
    try { return document.execCommand('copy'); } catch (e) { return false; }
  }

  function onKey(ev) {
    if (!isOpen()) return;
    const t = ev.target;
    const tag = t && t.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (ev.key === 'Escape') { ev.preventDefault(); close(); return; }
    // Let buttons keep their native Enter/Space activation.
    if (tag === 'BUTTON' && (ev.key === ' ' || ev.key === 'Enter')) return;
    if (ev.key === ' ' || ev.key === 'Enter') {
      if (current !== null && !shown) { ev.preventDefault(); flip(); }
      return;
    }
    if (!shown) return;
    if (ev.key === '1' || ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); grade(0); }
    else if (ev.key === '2' || ev.key === 'j' || ev.key === 'J') { ev.preventDefault(); grade(1); }
  }

  const SHELL =
    '<div class="xv-wrap">' +
      '<div class="xv-mast">' +
        '<button type="button" class="xv-ex-back" id="ex-back">← Menü</button>' +
        '<div class="xv-logo">extr@</div>' +
        '<h1>Vokabelkarten zur Serie</h1>' +
        '<div class="xv-count" id="ex-count"></div>' +
      '</div>' +
      '<div class="xv-picker">' +
        '<div class="xv-picker-head">Folgen auswählen</div>' +
        '<div class="xv-eps" id="ex-eps"></div>' +
      '</div>' +
      '<div class="xv-stage"><div id="ex-card" role="button" tabindex="0" aria-live="polite"></div></div>' +
      '<div id="ex-controls"></div>' +
      '<div class="xv-tools">' +
        '<button id="ex-dir" type="button"></button>' +
        '<button id="ex-lvl" type="button"></button>' +
        '<button id="ex-shuffle" type="button">Neu mischen</button>' +
        '<button id="ex-export" type="button">Exportieren</button>' +
        '<span class="xv-spacer"></span>' +
        '<button id="ex-reset" type="button">Fortschritt löschen</button>' +
      '</div>' +
      '<div class="xv-stats" id="ex-stats"></div>' +
      '<div id="ex-panel"></div>' +
    '</div>';

  function open(onClose) {
    if (view) return;
    onCloseHook = onClose || null;
    const rec = loadRecord();
    progress = (rec && rec.cards) || {};
    hideA2 = !!(rec && rec.hideA2);
    view = document.createElement('div');
    view.id = 'extraView';
    view.innerHTML = SHELL;
    document.body.appendChild(view);
    document.body.classList.add('drill-open');

    $x('ex-eps').addEventListener('click', ev => {
      const b = ev.target.closest('[data-ep]');
      if (!b) return;
      const v = b.getAttribute('data-ep');
      if (v === 'all') { all = true; sel = {}; }
      else {
        const e = parseInt(v, 10);
        if (all) { all = false; sel = {}; sel[e] = true; }
        else {
          sel[e] = !sel[e];
          if (!Object.keys(sel).some(k => sel[k])) all = true;
        }
      }
      closePanel();
      renderPicker();
      build();
      next();
    });
    $x('ex-card').addEventListener('click', flip);
    $x('ex-controls').addEventListener('click', ev => {
      const flipBtn = ev.target.closest('#ex-flip');
      if (flipBtn) { flip(); return; }
      const b = ev.target.closest('[data-g]');
      if (b) grade(parseInt(b.getAttribute('data-g'), 10));
    });
    $x('ex-back').onclick = () => close();
    $x('ex-dir').onclick = () => { dir = dir === 'de' ? 'en' : 'de'; dirLabel(); render(); };
    $x('ex-lvl').onclick = () => {
      hideA2 = !hideA2;
      saveProgress(progress);
      levelLabel();
      closePanel();
      build();
      next();
    };
    $x('ex-shuffle').onclick = () => { build(); next(); };
    $x('ex-export').onclick = openExport;
    $x('ex-reset').onclick = function () {
      if (!resetArmed) {
        resetArmed = true;
        this.textContent = 'Wirklich löschen?';
        this.className = 'xv-armed';
        resetTimer = setTimeout(() => { if (resetArmed) disarmReset(); }, 4000);
        return;
      }
      disarmReset();
      progress = {};
      saveProgress(progress);
      build();
      next();
    };

    document.addEventListener('keydown', onKey);
    if (global.history && history.pushState) {
      history.pushState({ extra: true }, '', '#extra');
    }

    renderPicker();
    dirLabel();
    levelLabel();
    build();
    next();
    // Move focus into the section. Otherwise focus stays on the menu button
    // behind the overlay, and Space presses that button instead of flipping
    // the card.
    const c = $x('ex-card');
    (c.hasAttribute('tabindex') ? c : $x('ex-back')).focus({ preventScroll: true });
  }

  function close() {
    if (!view) return;
    document.removeEventListener('keydown', onKey);
    disarmReset();
    view.remove();
    view = null;
    document.body.classList.remove('drill-open');
    if (global.history && history.state && history.state.extra) history.back();
    const hook = onCloseHook;
    onCloseHook = null;
    if (hook) hook();
  }

  // Back-button support: engine-ui's popstate handler calls this after it has
  // ruled out an open drill. Tears down without touching history again.
  function handlePop() {
    if (!view) return false;
    document.removeEventListener('keydown', onKey);
    disarmReset();
    view.remove();
    view = null;
    document.body.classList.remove('drill-open');
    const hook = onCloseHook;
    onCloseHook = null;
    if (hook) hook();
    return true;
  }

  // Summary for the menu entry, computed without mounting the view.
  function menuSummary() {
    const rec = loadRecord();
    const hide = rec && rec.hideA2 ? A2_CORE : null;
    return summarize(DATA, activeIndices(DATA, true, {}, hide), (rec && rec.cards) || {}, Date.now());
  }

  const ExtraVocab = {
    DECK_ID, DAY, INTERVALS, MASTERED_BOX, EPISODES, DATA, A2_CORE,
    keyOf, activeIndices, isDue, nextEntry, dueIndices, shuffle, summarize, toTSV,
    open, close, isOpen, handlePop, menuSummary,
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = ExtraVocab;
  } else {
    global.ExtraVocab = ExtraVocab;
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>

      ["das Erlebnis, -se", "experience (event)", "Das war das schönste Erlebnis in meinen Ferien.", "That was the best experience of my holidays.", "", 0],
      ["der Gewinn, -e", "win; winnings, prize", "Mit dem Gewinn kaufte er sich ein neues Velo.", "With the winnings he bought himself a new bike.", "", 0],

      ["die Religion, -en", "religion", "In vielen Religionen gibt es Rituale für Glück.", "Many religions have rituals for luck.", "", 0],

      ["das Spielcasino, -s", "casino", "Im Spielcasino verlor er sein ganzes Geld.", "He lost all his money at the casino.", "", 0],
      ["die Steuer, -n", "tax", "Muss man auf den Gewinn Steuern zahlen?", "Do you have to pay tax on the winnings?", "", 0],
      ["steuerfrei", "tax-free", "Kleine Gewinne sind oft steuerfrei.", "Small winnings are often tax-free.", "", 0],

      ["die Überraschung, -en", "surprise", "Zum Geburtstag bekam sie eine schöne Überraschung.", "She got a nice surprise for her birthday.", "", 0],
