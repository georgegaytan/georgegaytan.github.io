<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f0f1a">
<meta name="color-scheme" content="dark">
<title>German Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded as print media so it never blocks first paint, then promoted to
     all once it arrives. The body font stack falls back to the system UI font,
     so text is readable immediately and offline. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"></noscript>
<style>* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f0f1a; color: #e0e0e0;
  color-scheme: dark;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
  /* Suppresses double-tap-to-zoom (and its 300ms tap delay) without disabling
     pinch-zoom, which user-scalable=no used to block outright. */
  touch-action: manipulation;
}

/* When a drill is open it sits fixed over everything; lock body scroll to
   prevent rubber-banding behind the overlay. Toggled by engine-ui.js. */
body.drill-open { overflow: hidden; height: 100vh; }

/* Menu */
.menu { padding: 0 16px 40px; display: flex; flex-direction: column; align-items: center; }
.menu.hidden { display: none; }
.logo { margin: 48px 0 8px; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #666; }
.title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: #fff; margin-bottom: 6px; }
.subtitle { font-size: 13px; color: #555; margin-bottom: 32px; font-family: 'DM Mono', monospace; }

.deck-list { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
.deck-card { position: relative; overflow: hidden; background: #16162a; border: 1px solid #1e1e3a; border-radius: 14px; padding: 20px; cursor: pointer; transition: transform 0.15s, border-color 0.2s; }
.deck-card:active { transform: scale(0.97); }
.deck-card:hover { border-color: #333; }
.deck-card .accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.deck-card .icon { font-size: 28px; margin-bottom: 10px; display: block; }
.deck-card .name { font-size: 17px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.deck-card .desc { font-size: 12px; color: #777; line-height: 1.5; font-family: 'DM Mono', monospace; }
.deck-card .progress-bar { margin-top: 12px; height: 4px; background: #1e1e3a; border-radius: 2px; overflow: hidden; }
.deck-card .progress-fill { height: 100%; transition: width 0.3s; }
.deck-card .progress-label { font-size: 10px; color: #555; margin-top: 4px; font-family: 'DM Mono', monospace; }

/* Drill view */
.drill { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0f0f1a; display: none; flex-direction: column; padding: 16px; overscroll-behavior: contain; }
.drill.active { display: flex; }
.drill-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #1e1e3a; }
.drill-back { background: none; border: none; color: #888; cursor: pointer; padding: 6px 10px; font-size: 14px; }
.drill-progress { font-family: 'DM Mono', monospace; font-size: 12px; color: #666; }
.drill-body { flex: 1; overflow-y: auto; padding: 24px 8px; max-width: 560px; width: 100%; margin: 0 auto; }
.prompt { font-size: 22px; line-height: 1.6; color: #fff; margin-bottom: 24px; }
.blank { display: inline-block; min-width: 80px; border-bottom: 2px solid #555; padding: 2px 8px; margin: 0 4px; font-family: 'DM Mono', monospace; }
.blank.filled { border-bottom-color: #7f5af0; color: #fff; }
.blank.correct { border-bottom-color: #4ade80; }
.blank.wrong { border-bottom-color: #ef4444; color: #fca5a5; }
.blank input { background: transparent; border: none; color: inherit; font: inherit; outline: none; width: 100%; }
/* Standalone inputs (the "type the correct answer" box and text-answer field)
   carry the .blank class directly rather than wrapping one, so the rule above
   doesn't reach them — without this they keep the browser's default white
   background and render white-on-white. */
input.blank { -webkit-appearance: none; appearance: none; background-color: #16162a; color: #fff; caret-color: #fff; border: 1px solid #2a2a4a; border-radius: 8px; padding: 8px 12px; }
input.blank::placeholder { color: #6b6b8a; }
input.blank:focus { border-color: #7f5af0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { background: #1e1e3a; color: #ddd; border: 1px solid #2a2a4a; border-radius: 18px; padding: 8px 14px; cursor: pointer; font-size: 14px; user-select: none; }
.chip:hover { background: #2a2a4a; }
.chip.used { opacity: 0.3; pointer-events: none; }

.choice-options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.choice-btn { background: #16162a; border: 1px solid #2a2a4a; color: #ddd; padding: 14px; border-radius: 10px; cursor: pointer; font-size: 16px; text-align: left; }
.choice-btn:hover { border-color: #444; }
.choice-btn.correct { border-color: #4ade80; color: #4ade80; }
.choice-btn.wrong { border-color: #ef4444; color: #ef4444; }

.feedback { margin-top: 24px; padding: 16px; border-radius: 10px; }
.feedback.correct { background: #143020; color: #86efac; }
.feedback.wrong { background: #301414; color: #fca5a5; }
.feedback .correct-form { font-family: 'DM Mono', monospace; font-weight: 600; }
.feedback .translation { color: #888; font-size: 13px; margin-top: 8px; }
.feedback .explanation { color: #b8b8c8; font-size: 13px; line-height: 1.5; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); }

.drill-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; padding: 16px 0; border-top: 1px solid #1e1e3a; }
.btn-primary { background: #7f5af0; color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; }
.btn-primary:hover { background: #9572f0; }
.btn-secondary { background: transparent; color: #888; border: 1px solid #333; padding: 12px 20px; border-radius: 10px; cursor: pointer; }

.session-end { text-align: center; padding: 40px 16px; }
.session-end .stat { font-family: 'DM Mono', monospace; color: #aaa; margin: 8px 0; }
.session-end .stat-val { font-size: 24px; font-weight: 700; color: #fff; }

/* Backup row */
.backup-row { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
.backup-btn { font-family: 'DM Mono', monospace; font-size: 11px; color: #555; border: 1px solid #333; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.backup-btn:hover { border-color: #555; color: #888; }

/* Degraded-storage banner (shown when IDB unavailable and we're on the
   localStorage fallback - Storage.isDegraded() is true). */
.storage-banner {
  width: 100%;
  max-width: 440px;
  margin: 24px auto 0;
  padding: 12px 14px;
  background: #2a1f10;
  border: 1px solid #5a4520;
  border-radius: 10px;
  color: #f0c060;
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.storage-banner.hidden { display: none; }
.storage-banner .body { flex: 1; }
.storage-banner .close {
  background: transparent;
  border: none;
  color: #f0c060;
  font-size: 18px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
</style>
<style>/* extr@ Vokabelkarten — a self-contained section that deliberately does not
   share the drill app's visual language. Every selector is scoped under
   #extraView so the app's dark palette and this one never collide. */

#extraView {
  --ex-ink: #14211e;
  --ex-ink-soft: #5a6a64;
  --ex-paper: #e7eae2;
  --ex-card: #fbfcf9;
  --ex-line: #c8cec3;
  --ex-teal: #0e5c58;
  --ex-magenta: #c92a63;
  --ex-mustard: #d99400;
  --ex-radius: 2px;

  position: fixed;
  inset: 0;
  z-index: 50;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  color-scheme: light dark;
  background: var(--ex-paper);
  color: var(--ex-ink);
  font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  padding: 20px 16px 48px;
}
@media (prefers-color-scheme: dark) {
  #extraView {
    --ex-ink: #e8ece6;
    --ex-ink-soft: #93a09a;
    --ex-paper: #141a18;
    --ex-card: #1d2523;
    --ex-line: #33403c;
    --ex-teal: #5bbfae;
    --ex-magenta: #ff6d9c;
    --ex-mustard: #f2b53a;
  }
}
#extraView .xv-wrap { max-width: 760px; margin: 0 auto; }

#extraView .xv-mast { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 3px solid var(--ex-ink); padding-bottom: 8px; }
#extraView .xv-ex-back { font: inherit; font-size: 13px; background: transparent; border: 1px solid var(--ex-line); border-radius: var(--ex-radius); color: var(--ex-ink); padding: 5px 9px; cursor: pointer; }
#extraView .xv-ex-back:hover { border-color: var(--ex-ink-soft); }
#extraView .xv-logo { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--ex-magenta); }
#extraView .xv-mast h1 { font-size: 16px; font-weight: 600; margin: 0; }
#extraView .xv-count { margin-left: auto; font-size: 13px; color: var(--ex-ink-soft); font-variant-numeric: tabular-nums; }

#extraView .xv-picker { margin: 18px 0 4px; }
#extraView .xv-picker-head { font-size: 13px; color: var(--ex-ink-soft); margin-bottom: 8px; }
#extraView .xv-eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
#extraView .xv-ep {
  display: flex; gap: 8px; align-items: baseline;
  background: transparent; border: 1px solid var(--ex-line); border-radius: var(--ex-radius);
  color: var(--ex-ink); font: inherit; font-size: 13px; text-align: left;
  padding: 7px 8px; cursor: pointer;
}
#extraView .xv-ep:hover { border-color: var(--ex-ink-soft); }
#extraView .xv-ep b { font-variant-numeric: tabular-nums; color: var(--ex-ink-soft); font-weight: 700; font-size: 12px; }
#extraView .xv-ep.xv-on { background: var(--ex-teal); border-color: var(--ex-teal); color: #fff; }
#extraView .xv-ep.xv-on b { color: rgba(255, 255, 255, 0.72); }
#extraView .xv-ep-all { grid-column: 1 / -1; justify-content: center; font-weight: 600; }
#extraView .xv-ep-all.xv-on { background: var(--ex-magenta); border-color: var(--ex-magenta); color: #fff; }
#extraView button:focus-visible, #extraView #ex-card:focus-visible { outline: 3px solid var(--ex-mustard); outline-offset: 2px; }

#extraView .xv-stage { margin: 22px 0 14px; }
#extraView #ex-card {
  background: var(--ex-card); border: 1px solid var(--ex-line);
  border-top: 6px solid var(--ex-teal); border-radius: var(--ex-radius);
  padding: 34px 26px; min-height: 230px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; cursor: pointer;
}
#extraView #ex-card.xv-rev { border-top-color: var(--ex-magenta); cursor: default; }
#extraView #ex-card.xv-idle { cursor: default; }
#extraView .xv-term { font-size: 29px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
#extraView .xv-term.xv-small { font-size: 23px; }
#extraView .xv-answer { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--ex-line); width: 100%; max-width: 460px; }
#extraView .xv-gloss { font-size: 20px; color: var(--ex-teal); font-weight: 600; }
#extraView .xv-ex { margin-top: 12px; font-size: 15px; color: var(--ex-ink-soft); font-style: italic; line-height: 1.45; }
#extraView .xv-ex-en { margin-top: 5px; font-size: 14px; color: var(--ex-ink-soft); opacity: 0.82; line-height: 1.4; }
#extraView .xv-hint { margin-top: 20px; font-size: 13px; color: var(--ex-ink-soft); }
#extraView .xv-tag { margin-top: 16px; font-size: 12px; color: var(--ex-ink-soft); }

#extraView .xv-gradehead { margin-bottom: 7px; font-size: 13.5px; font-weight: 600; color: var(--ex-ink-soft); }
#extraView .xv-grades { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
#extraView .xv-grades button {
  font: inherit; font-size: 16px; font-weight: 600; padding: 14px 6px; cursor: pointer;
  border: 1px solid var(--ex-line); border-radius: var(--ex-radius);
  background: var(--ex-card); color: var(--ex-ink);
}
#extraView .xv-grades button:hover { border-color: var(--ex-ink-soft); }
#extraView .xv-grades button small { display: block; margin-top: 3px; font-weight: 400; font-size: 11px; color: var(--ex-ink-soft); font-variant-numeric: tabular-nums; }
#extraView .xv-grades button kbd { display: inline-block; font: inherit; font-size: 10px; padding: 0 3px; margin-right: 5px; border: 1px solid var(--ex-line); border-radius: 2px; opacity: 0.7; }
#extraView .xv-g0 { border-bottom: 3px solid var(--ex-magenta); }
#extraView .xv-g1 { border-bottom: 3px solid var(--ex-teal); }
#extraView .xv-flipbar button {
  width: 100%; font: inherit; font-size: 15px; font-weight: 600; padding: 13px; cursor: pointer;
  background: var(--ex-teal); color: #fff; border: 0; border-radius: var(--ex-radius);
}

#extraView .xv-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--ex-line); }
#extraView .xv-tools button {
  font: inherit; font-size: 13px; padding: 7px 11px; cursor: pointer;
  background: transparent; border: 1px solid var(--ex-line); border-radius: var(--ex-radius); color: var(--ex-ink);
}
#extraView .xv-tools button:hover { border-color: var(--ex-ink-soft); }
#extraView .xv-tools .xv-spacer { margin-left: auto; }
#extraView #ex-reset.xv-armed { border-color: var(--ex-magenta); color: var(--ex-magenta); font-weight: 600; }
#extraView .xv-stats { margin-top: 10px; font-size: 12.5px; color: var(--ex-ink-soft); font-variant-numeric: tabular-nums; }
#extraView .xv-panel { margin-top: 14px; border: 1px solid var(--ex-line); border-radius: var(--ex-radius); padding: 12px; background: var(--ex-card); }
#extraView .xv-panel textarea { width: 100%; height: 170px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; border: 1px solid var(--ex-line); border-radius: var(--ex-radius); background: var(--ex-paper); color: var(--ex-ink); padding: 8px; }
#extraView .xv-panel p { margin: 0 0 8px; font-size: 13px; color: var(--ex-ink-soft); }
#extraView .xv-panel button { font: inherit; font-size: 13px; padding: 6px 10px; cursor: pointer; background: transparent; border: 1px solid var(--ex-line); border-radius: var(--ex-radius); color: var(--ex-ink); }
#extraView .xv-empty { color: var(--ex-ink-soft); padding: 40px 10px; line-height: 1.6; }
@media (max-width: 520px) {
  #extraView .xv-term { font-size: 24px; }
}

/* Menu entry — sits above the deck list and reads as a different kind of
   thing: square corners, editorial colours, no progress bar. */
.extra-entry {
  width: 100%; max-width: 440px; margin-bottom: 22px;
  display: flex; align-items: center; gap: 14px;
  background: #16162a; border: 1px solid #2a2a4a; border-left: 4px solid #c92a63;
  border-radius: 4px; padding: 16px 18px; cursor: pointer; text-align: left;
  font: inherit; color: inherit;
  transition: transform 0.15s, border-color 0.2s;
}
.extra-entry:active { transform: scale(0.97); }
.extra-entry:hover { border-color: #444; border-left-color: #c92a63; }
.extra-entry .mark { font-size: 26px; font-weight: 800; letter-spacing: -0.04em; color: #ff6d9c; line-height: 1; }
.extra-entry .body { flex: 1; }
.extra-entry .name { font-size: 17px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.extra-entry .desc { font-size: 12px; color: #777; line-height: 1.5; font-family: 'DM Mono', monospace; }
.extra-entry .go { color: #555; font-size: 18px; }

/* Separator between the standalone section and the drill decks. */
.menu-divider {
  width: 100%; max-width: 440px; margin: 0 0 18px;
  display: flex; align-items: center; gap: 10px;
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: #444;
}
.menu-divider::before, .menu-divider::after { content: ''; flex: 1; height: 1px; background: #1e1e3a; }
</style>
<style>/* B1 Karteikasten — a self-contained section in its own visual language: one
   centred column with the lesson picker, the lesson header, a ruled index card
   (Karteikarte) with a red header line, then a thumb-reachable action bar.
   Every selector is scoped under #kkView so it never collides with the drill
   app or with extr@. */

#kkView {
  --kk-page: #e7ebf2;
  --kk-card: #fdfdfb;
  --kk-ink: #1c2230;
  --kk-muted: #5a6377;
  --kk-rule: #d6e0ef;
  --kk-redline: #cf4a43;
  --kk-accent: #1f4fb4;
  --kk-accent-ink: #ffffff;
  --kk-good: #23774a;
  --kk-again: #a95a17;
  --kk-chip: #f5f7fb;
  --kk-line: #c8d0dd;
  --kk-f-display: "Bitter", Georgia, "Times New Roman", serif;
  --kk-f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --kk-f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --kk-radius: 10px;

  position: fixed;
  inset: 0;
  z-index: 50;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  color-scheme: light;
  background: var(--kk-page);
  color: var(--kk-ink);
  font-family: var(--kk-f-body);
  font-size: 16px;
  line-height: 1.5;
}
@media (prefers-color-scheme: dark) {
  #kkView {
    --kk-page: #10141c; --kk-card: #1a202c; --kk-ink: #e7eaf1; --kk-muted: #9ca5b7; --kk-rule: #27324a;
    --kk-redline: #cf645e; --kk-accent: #93acff; --kk-accent-ink: #0f1626; --kk-good: #5cc08a; --kk-again: #e39b5c;
    --kk-chip: #1f2737; --kk-line: #313d55;
    color-scheme: dark;
  }
}

#kkView [hidden] { display: none !important; }
#kkView .kk-wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 18px;
}
#kkView button { font: inherit; color: inherit; cursor: pointer; }
#kkView button:focus-visible, #kkView summary:focus-visible, #kkView .kk-card:focus-visible {
  outline: 2px solid var(--kk-accent); outline-offset: 2px;
}

/* top */
#kkView .kk-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
#kkView .kk-menu {
  align-self: center; background: transparent; border: 1px solid var(--kk-line); border-radius: 999px;
  padding: 4px 11px; font-size: 0.85rem; color: var(--kk-ink);
}
#kkView .kk-top h1 { font-family: var(--kk-f-display); font-weight: 700; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
#kkView .kk-top .kk-sub { color: var(--kk-muted); font-size: 0.85rem; }

/* lesson picker */
#kkView .kk-books { display: grid; gap: 12px; }
#kkView .kk-book-label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--kk-muted); margin-bottom: 6px; }
#kkView .kk-chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
#kkView .kk-chip {
  background: var(--kk-chip); border: 1px solid var(--kk-line); border-radius: 8px;
  padding: 6px 0 7px; display: grid; gap: 5px; justify-items: center;
  font-family: var(--kk-f-mono); font-size: 0.95rem; font-variant-numeric: tabular-nums;
}
#kkView .kk-chip[aria-pressed="true"] { border-color: var(--kk-accent); box-shadow: inset 0 0 0 1px var(--kk-accent); color: var(--kk-accent); }
#kkView .kk-chip .kk-bar { width: 70%; height: 3px; border-radius: 2px; background: var(--kk-line); overflow: hidden; }
#kkView .kk-chip .kk-bar i { display: block; height: 100%; background: var(--kk-good); width: 0; }

/* lesson head */
#kkView .kk-lhead { display: grid; gap: 8px; }
#kkView .kk-eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--kk-muted); }
#kkView .kk-lhead h2 { font-family: var(--kk-f-display); font-weight: 700; font-size: 1.6rem; line-height: 1.15; margin: 0; text-wrap: balance; }
#kkView .kk-meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.88rem; color: var(--kk-muted); font-variant-numeric: tabular-nums; }
#kkView .kk-meta strong { color: var(--kk-good); font-weight: 700; }
#kkView .kk-progress { height: 6px; border-radius: 3px; background: var(--kk-line); overflow: hidden; }
#kkView .kk-progress i { display: block; height: 100%; width: 0; background: var(--kk-good); transition: width .3s ease; }
#kkView .kk-tools { display: flex; gap: 8px; flex-wrap: wrap; }
#kkView .kk-tool {
  background: transparent; border: 1px solid var(--kk-line); border-radius: 999px;
  padding: 5px 12px; font-size: 0.85rem; color: var(--kk-ink);
}
#kkView .kk-tool[aria-pressed="true"] { background: var(--kk-chip); border-color: var(--kk-accent); color: var(--kk-accent); }
#kkView .kk-tool.kk-warn { border-color: var(--kk-again); color: var(--kk-again); }

/* the index card */
#kkView .kk-stage { perspective: 1400px; }
#kkView .kk-card { display: grid; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; cursor: pointer; border-radius: var(--kk-radius); }
#kkView .kk-card.kk-flipped { transform: rotateY(180deg); }
#kkView .kk-card.kk-no-anim { transition: none; }
#kkView .kk-face {
  grid-area: 1 / 1;
  background: var(--kk-card);
  border: 1px solid var(--kk-line);
  border-radius: var(--kk-radius);
  box-shadow: 0 1px 0 var(--kk-line), 0 10px 24px -18px rgba(20, 30, 50, .45);
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  display: grid; grid-template-rows: auto 1fr; min-height: 300px;
}
#kkView .kk-face.kk-back { transform: rotateY(180deg); }
#kkView .kk-face-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 10px 18px 8px; border-bottom: 2px solid var(--kk-redline);
  font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--kk-muted);
}
#kkView .kk-badges { display: flex; gap: 6px; }
#kkView .kk-badge {
  font-family: var(--kk-f-mono); letter-spacing: 0; text-transform: none; font-size: 0.72rem;
  border: 1px solid var(--kk-redline); color: var(--kk-redline); border-radius: 4px; padding: 0 5px;
}
#kkView .kk-face-body { padding: 18px 18px 22px; display: grid; align-content: center; gap: 14px; min-width: 0; }
#kkView .kk-word { font-family: var(--kk-f-display); font-weight: 700; font-size: clamp(1.5rem, 6.2vw, 2.15rem); line-height: 1.2; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
#kkView .kk-word.kk-en { font-weight: 500; }
#kkView .kk-sentence {
  margin: 0; font-size: 1.04rem; line-height: 28px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--kk-rule) 27px 28px);
  overflow-wrap: anywhere;
}
#kkView .kk-sentence.kk-it { font-style: italic; }
#kkView .kk-ref { font-size: 0.85rem; color: var(--kk-muted); margin: 0; }
#kkView .kk-note { font-size: 0.85rem; color: var(--kk-muted); margin: 0; }
#kkView .kk-note b { color: var(--kk-ink); font-weight: 700; }
#kkView .kk-hint { text-align: center; font-size: 0.8rem; color: var(--kk-muted); margin-top: -6px; }

/* actions */
#kkView .kk-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 52px; }
#kkView .kk-btn {
  border-radius: var(--kk-radius); padding: 13px 10px; font-weight: 700; font-size: 1rem;
  border: 1.5px solid var(--kk-line); background: var(--kk-card);
}
#kkView .kk-btn.kk-flip { grid-column: 1 / -1; background: var(--kk-accent); color: var(--kk-accent-ink); border-color: var(--kk-accent); }
#kkView .kk-btn.kk-again { border-color: var(--kk-again); color: var(--kk-again); }
#kkView .kk-btn.kk-good { background: var(--kk-good); border-color: var(--kk-good); color: var(--kk-card); }
#kkView .kk-btn small { display: block; font-weight: 400; font-size: 0.72rem; opacity: .8; font-family: var(--kk-f-mono); }

/* done */
#kkView .kk-done { background: var(--kk-card); border: 1px solid var(--kk-line); border-radius: var(--kk-radius); padding: 26px 20px; display: grid; gap: 12px; text-align: center; }
#kkView .kk-done h3 { font-family: var(--kk-f-display); margin: 0; font-size: 1.35rem; }
#kkView .kk-done p { margin: 0; color: var(--kk-muted); }
#kkView .kk-done .kk-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* word list */
#kkView details { border-top: 1px solid var(--kk-line); padding-top: 10px; }
#kkView summary { cursor: pointer; color: var(--kk-muted); font-size: 0.9rem; }
#kkView .kk-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; }
#kkView .kk-list li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--kk-rule); font-size: 0.9rem; }
#kkView .kk-list li .kk-k { color: var(--kk-good); }
#kkView .kk-list li span:first-child { font-weight: 700; overflow-wrap: anywhere; }
#kkView .kk-list li span:last-child { color: var(--kk-muted); overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  #kkView .kk-card, #kkView .kk-progress i { transition: none; }
}

/* Menu entry — reuses the .extra-entry layout from extra-vocab.css and swaps
   in the index card's red line. */
.extra-entry + .extra-entry { margin-top: -12px; }
.extra-entry.kk-entry { border-left-color: #cf4a43; }
.extra-entry.kk-entry:hover { border-left-color: #cf4a43; }
.extra-entry.kk-entry .mark { font-family: "Bitter", Georgia, "Times New Roman", serif; color: #e8817b; min-width: 2.7em; text-align: center; }

ch nach vielen Jahren wohnt er {0} in Berlin.","blanks":[{"answer":"noch","alts":[],"topic":"noch_still","scaffoldPool":"chameleon_particles"}],"translation":"He still lives in Berlin.","explanation":"*noch* meaning *still* — the living-in-Berlin continues at the time of speaking."},{"id":"cham_noch_not_yet_001","kind":"cloze","prompt":"Sie hat den Film bisher {0} nicht gesehen.","blanks":[{"answer":"noch","alts":[],"topic":"noch_not_yet","scaffoldPool":"chameleon_particles"}],"translation":"She hasn't seen the movie yet.","explanation":"*noch nicht* = *not yet*; the *noch* extends a negation forward in time."},{"id":"cham_noch_another_001","kind":"cloze","prompt":"Dein Teller ist leer. Möchtest du {0} ein Stück Kuchen?","blanks":[{"answer":"noch","alts":[],"topic":"noch_another","scaffoldPool":"chameleon_particles"}],"translation":"Would you like another piece of cake?","explanation":"*noch* asking for *another* (more of the same): *noch ein Stück* = *one more piece*."},{"id":"cham_noch_even_001","kind":"cloze","prompt":"Der Film war gut, aber das Buch ist {0} besser.","blanks":[{"answer":"noch","alts":[],"topic":"noch_even","scaffoldPool":"chameleon_particles"}],"translation":"The book is even better than the film.","explanation":"*noch* intensifying a comparative: *noch besser* = *even better*."},{"id":"cham_noch_meaning_001","kind":"choice","prompt":"Der Chef sitzt noch im Büro. (Was bedeutet hier das Partikel?)","options":["still","not yet","another (additional)","even (intensifier)"],"answer":"still","topic":"noch_still","explanation":"*noch* meaning *still* — the boss's sitting in the office is ongoing at the moment of speaking."},{"id":"cham_noch_meaning_002","kind":"choice","prompt":"Das wäre noch interessanter. (Was bedeutet hier das Partikel?)","options":["still","not yet","another (additional)","even (intensifier)"],"answer":"even (intensifier)","topic":"noch_even","explanation":"*noch* intensifying the comparative *interessanter*: *even more interesting d."},{"id":"cham_mal_softener_001","kind":"cloze","prompt":"Kannst du mir {0} kurz helfen?","blanks":[{"answer":"mal","alts":[],"topic":"mal_softener","scaffoldPool":"chameleon_particles"}],"translation":"Could you help me?","explanation":"Modal-particle *mal* softening a request — *could you help me real quick*."},{"id":"cham_mal_once_more_001","kind":"cloze","prompt":"Kannst du das noch{0} erklären?","blanks":[{"answer":"mal","alts":[],"topic":"mal_once_more","scaffoldPool":"chameleon_particles"}],"translation":"Can you explain it once more?","explanation":"*noch mal* = *once more* (one additional time); *mal* here carries the repetition sense."},{"id":"cham_mal_meaning_001","kind":"choice","prompt":"Kannst du das Fenster mal öffnen? (Was bedeutet hier das Partikel?)","options":["request softener","once more (repetition)","after all","probably"],"answer":"request softener","topic":"mal_softener","explanation":"Modal-particle *mal* softening the request *open the window* — informal and brief."},{"id":"cham_erst_not_until_001","kind":"cloze","prompt":"Wir müssen warten: Der Zug fährt {0} um 10 Uhr ab.","blanks":[{"answer":"erst","alts":[],"topic":"erst_not_until","scaffoldPool":"chameleon_particles"}],"translation":"The train doesn't leave until 10.","explanation":"*erst* with a time expression means *not until*: the departure is later than expected."},{"id":"cham_erst_only_just_001","kind":"cloze","prompt":"Sie ist neu hier — sie ist {0} gestern angekommen.","blanks":[{"answer":"erst","alts":[],"topic":"erst_only_just","scaffoldPool":"chameleon_particles"}],"translation":"She only arrived yesterday.","explanation":"*erst* meaning *only just*: emphasis that her arrival happened only recently."},{"id":"cham_erst_first_001","kind":"cloze","prompt":"Ich lese {0} die E-Mail und dann das Dokument.","blanks":[{"answer":"erst","alts":[],"topic":"erst_first","scaffoldPool":"chameleon_particles"}],"translation":"I have to read the email first.","explanation":"*erst* meaning *first* in sequence — read the email before doing anything else."},{"id":"cham_erst_meaning_001","kind":"choice","prompt":"Er kommt erst nächste Woche zurück. (Was bedeutet hier das Partikel?)","options":["not until (later than expected)","only just (recently)","first (before something else)","already"],"answer":"not until (later than expected)","topic":"erst_not_until","explanation":"*erst nächste Woche* = *not until next week*: *erst* with a time expression pushes the event later than expected."},{"id":"cham_erst_meaning_002","kind":"choice","prompt":"Er ist erst vor einer Stunde aufgewacht. (Was bedeutet hier das Partikel?)","options":["not until (later than expected)","only just (recently)","first (before something else)","still"],"answer":"only just (recently)","topic":"erst_only_just","explanation":"*erst vor einer Stunde* = *only an hour ago*: *erst* stresses that the waking happened only recently."},{"id":"cham_ja_shared_knowledge_001","kind":"cloze","prompt":"Er kommt {0} morgen, wie wir wissen.","blanks":[{"answer":"ja","alts":[],"topic":"ja_shared_knowledge","scaffoldPool":"chameleon_particles"}],"translation":"He's coming tomorrow, as we know.","explanation":"Modal-particle *ja* appealing to information the listener already knows — *as we both know*."},{"id":"cham_ja_warning_001","kind":"cloze","prompt":"Pass auf: Du darfst das {0} nicht vergessen!","blanks":[{"answer":"ja","alts":[],"topic":"ja_warning","scaffoldPool":"chameleon_particles"}],"translation":"You'd better not forget that!","explanation":"*ja* in a warning intensifies it: *make sure you don't forget that!*"},{"id":"cham_ja_meaning_001","kind":"choice","prompt":"Du hast ja keine Zeit. (Was bedeutet hier das Partikel?)","options":["as we both know (shared knowledge)","emphatic warning","expression of surprise","yes"],"answer":"as we both know (shared knowledge)","topic":"ja_shared_knowledge","explanation":"Modal-particle *ja* appealing to shared knowledge: *as we both know, you have no time*."},{"id":"cham_ja_meaning_002","kind":"choice","prompt":"Vergiss das ja nicht! (Was bedeutet hier das Partikel?)","options":["as we both know (shared knowledge)","emphatic warning","expression of surprise","probably"],"answer":"emphatic warning","topic":"ja_warning","explanation":"*ja* in a negative imperative sharpens the warning: *make sure not to forget that!*"},{"id":"cham_denn_question_001","kind":"cloze","prompt":"Du siehst traurig aus. Was ist {0} los?","blanks":[{"answer":"denn","alts":[],"topic":"denn_question_particle","scaffoldPool":"chameleon_particles"}],"translation":"What's going on?","explanation":"*denn* as a modal particle softens the question and signals curiosity — not the conjunction *because*."},{"id":"cham_denn_question_002","kind":"cloze","prompt":"Ich habe dich überall gesucht. Wo warst du {0}?","blanks":[{"answer":"denn","alts":[],"topic":"denn_question_particle","scaffoldPool":"chameleon_particles"}],"translation":"Where were you?","explanation":"*denn* as a modal particle in a question signals curiosity or mild impatience — distinct from the conjunction *because*."},{"id":"cham_denn_meaning_001","kind":"choice","prompt":"Warum kommt er denn so spät? (Was bedeutet hier das Partikel?)","options":["question softener (curiosity/impatience)","because (conjunction)","after all","still"],"answer":"question softener (curiosity/impatience)","topic":"denn_question_particle","explanation":"*denn* in a *warum*-question softens it and signals curiosity or mild impatience — not the conjunction *because*."},{"id":"cham_wohl_probably_001","kind":"cloze","prompt":"Er antwortet nicht — er hat {0} keine Zeit.","blanks":[{"answer":"wohl","alts":[],"topic":"wohl_probably","scaffoldPool":"chameleon_particles"}],"translation":"He probably doesn't have time.","explanation":"*wohl* meaning *probably*; a speaker's hedged guess about his availability."},{"id":"cham_wohl_hedging_001","kind":"cloze","prompt":"Du hast {0} recht, denke ich.","blanks":[{"answer":"wohl",
