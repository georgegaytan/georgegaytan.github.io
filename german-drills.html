<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>German Drills</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;-webkit-tap-highlight-color:transparent}
.menu{height:100%;overflow-y:auto;padding:0 16px 40px;display:flex;flex-direction:column;align-items:center}
.menu.hidden{display:none}
.logo{margin:48px 0 8px;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#666}
.title{font-size:28px;font-weight:700;letter-spacing:-0.5px;color:#fff;margin-bottom:6px}
.subtitle{font-size:13px;color:#555;margin-bottom:32px;font-family:'DM Mono',monospace}
.deck-list{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.deck-card{position:relative;overflow:hidden;background:#16162a;border:1px solid #1e1e3a;border-radius:14px;padding:20px;cursor:pointer;transition:transform 0.15s,border-color 0.2s,box-shadow 0.2s}
.deck-card:active{transform:scale(0.97)}
.deck-card:hover{border-color:#333;box-shadow:0 4px 24px rgba(0,0,0,0.3)}
.deck-card .accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.deck-card .icon{font-size:28px;margin-bottom:10px;display:block}
.deck-card .name{font-size:17px;font-weight:600;color:#fff;margin-bottom:4px;letter-spacing:-0.2px}
.deck-card .desc{font-size:12px;color:#777;line-height:1.5;font-family:'DM Mono',monospace}
.deck-card .badge{position:absolute;top:16px;right:16px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;font-family:'DM Mono',monospace;letter-spacing:0.5px}
.deck-card .progress-bar{margin-top:12px;height:4px;background:#1e1e3a;border-radius:2px;overflow:hidden}
.deck-card .progress-fill{height:100%;border-radius:2px;transition:width 0.3s}
.deck-card .progress-label{font-size:10px;color:#555;margin-top:4px;font-family:'DM Mono',monospace}
.drill-view{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f1a;display:none;flex-direction:column;z-index:100}
.drill-view.active{display:flex}
.drill-topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0f0f1a;border-bottom:1px solid #1e1e3a;flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:#888;font-family:'DM Sans',system-ui,sans-serif;font-size:14px;font-weight:500;cursor:pointer;padding:6px 8px;border-radius:8px;transition:color 0.15s,background 0.15s}
.back-btn:hover{color:#fff;background:#1e1e3a}
.back-btn svg{width:18px;height:18px}
.drill-title{font-size:14px;font-weight:600;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drill-view iframe{flex:1;border:none;width:100%;background:#1a1a2e}
.backup-row{display:flex;gap:8px;justify-content:center;margin-top:24px}
.backup-btn{font-family:'DM Mono',monospace;font-size:11px;color:#555;border:1px solid #333;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all 0.15s}
.backup-btn:hover{border-color:#555;color:#888}
.restore-msg{text-align:center;color:#4ade80;font-size:12px;font-family:'DM Mono',monospace;margin-top:8px;opacity:0;transition:opacity 0.3s}
.restore-msg.show{opacity:1}
.streak-badge{display:inline-block;font-size:10px;color:#facc15;font-family:'DM Mono',monospace;margin-left:6px}
</style>
</head>
<body>
<div class="menu" id="menuScreen">
  <div class="logo">deutsch</div>
  <div class="title">German Drills</div>
  <div class="subtitle" id="subtitle">5 decks · tap to start</div>
  <div class="deck-list" id="deckList"></div>
  <div class="backup-row">
    <button class="backup-btn" onclick="exportProgress()">↓ Export</button>
    <button class="backup-btn" onclick="importProgress()">↑ Import</button>
  </div>
  <div class="restore-msg" id="restoreMsg"></div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(this)">
</div>
<div class="drill-view" id="drillView">
  <div class="drill-topbar">
    <button class="back-btn" onclick="closeDeck()">

      Menu
    </button>
    <div class="drill-title" id="drillTitle"></div>
  </div>
  <iframe id="drillFrame" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

function getProgress(d){
  try{
    var raw=localStorage.getItem(d.storeKey);
    if(!raw)return null;
    var data=JSON.parse(raw);

    // Declension: catStats — {cat: {c:n, w:n}}
    if(d.storeKey==="gd_stats_v2"){
      var total=0,correct=0;
      for(var k in data){if(data.hasOwnProperty(k)){total+=data[k].c+data[k].w;correct+=data[k].c;}}
      if(total===0)return null;
      return {pct:Math.round(correct/total*100),label:correct+" correct of "+total+" answered"};
    }

    // Modal Verbs: {session, items:[{box,correct,wrong}]}
    if(d.storeKey==="modal-verb-srs"){
      if(!data.items)return null;
      var mastered=0;
      for(var i=0;i<data.items.length;i++){if(data.items[i].box>=3)mastered++;}
      var pct=Math.round(mastered/data.items.length*100);
      return {pct:pct,label:mastered+"/"+data.items.length+" mastered"};
    }

    // Past/Future: {mode, round, items:[{b,wc,rc}]}
    if(d.storeKey==="germanDrill_pastfuture_v1"){
      if(!data.items)return null;
      var mastered=0;
      for(var i=0;i<data.items.length;i++){if(data.items[i].b>=3)mastered++;}
      var pct=Math.round(mastered/data.items.length*100);
      return {pct:pct,label:mastered+"/"+data.items.length+" mastered"};
    }

    // Pronouns: {cat0: bestPct, cat0_hard: bestPct, ...}
    if(d.storeKey==="germanDrill_pronouns_v1"){
      var vals=[];for(var k in data){if(data.hasOwnProperty(k))vals.push(data[k]);}
      if(!vals.length)return null;
      var avg=0;for(var i=0;i<vals.length;i++)avg+=vals[i];avg=Math.round(avg/vals.length);
      return {pct:avg,label:"best avg "+avg+"%"};
    }

    // Vocabulary: {boxes:[[idx],...], stats:{...}}
    if(d.storeKey==="vocabDrill_v1"){
      if(!data.boxes)return null;
      var mastered=0,total=0;
      for(var b=0;b<data.boxes.length;b++){total+=data.boxes[b].length;if(b>=3)mastered+=data.boxes[b].length;}
      if(total===0)return null;
      var pct=Math.round(mastered/total*100);
      return {pct:pct,label:mastered+"/"+total+" mastered"};
    }
  }catch(e){}
  return null;
}

function getOverallStats(){
  var pcts=[],weakest=null,weakPct=101;
  for(var i=0;i<DECKS.length;i++){
    var p=getProgress(DECKS[i]);
    if(p){
      pcts.push(p.pct);
      if(p.pct<weakPct){weakPct=p.pct;weakest=DECKS[i].name;}
    }
  }
  if(!pcts.length)return null;
  var sum=0;for(var j=0;j<pcts.length;j++)sum+=pcts[j];
  return{overallPct:Math.round(sum/pcts.length),weakestName:weakest,deckCount:pcts.length};
}

function getStreak(storeKey){
  try{
    var streaks=JSON.parse(localStorage.getItem('gd_streaks')||'{}');
    var entry=streaks[storeKey];
    if(!entry)return 0;
    var today=new Date().toISOString().slice(0,10);
    var yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(entry.date===today||entry.date===yesterday)return entry.streak;
    return 0;
  }catch(e){return 0;}
}

var KNOWN_KEYS=['gd_stats_v2','modal-verb-srs','germanDrill_pastfuture_v1','germanDrill_pronouns_v1','vocabDrill_v1','gd_streaks'];

function exportProgress(){
  var data={};
  for(var i=0;i<KNOWN_KEYS.length;i++){
    var raw=localStorage.getItem(KNOWN_KEYS[i]);
    if(raw){try{data[KNOWN_KEYS[i]]=JSON.parse(raw);}catch(e){}}
  }
  var backup={version:1,exported:new Date().toISOString(),data:data};
  var blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='german-drills-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importProgress(){
  document.getElementById('importFile').click();
}

function handleImport(input){
  var file=input.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var backup=JSON.parse(e.target.result);
      if(!backup.version||!backup.data||typeof backup.data!=='object'){
        alert('Invalid backup file.');return;
      }
      if(backup.version!==1){
        alert('Unsupported backup version: '+backup.version);return;
      }
      if(!confirm('This will replace your current progress. Continue?'))return;
      for(var i=0;i<KNOWN_KEYS.length;i++){
        if(backup.data[KNOWN_KEYS[i]]!==undefined){
          localStorage.setItem(KNOWN_KEYS[i],JSON.stringify(backup.data[KNOWN_KEYS[i]]));
        }
      }
      buildMenu();
      var msg=document.getElementById('restoreMsg');
      msg.textContent='Progress restored!';
      msg.className='restore-msg show';
      setTimeout(function(){msg.className='restore-msg';},2000);
    }catch(ex){
      alert('Error reading backup file.');
    }
    input.value='';
  };
  reader.readAsText(file);
}

function buildMenu(){
  var stats=getOverallStats();
  var sub=document.getElementById("subtitle");
  if(stats){
    sub.textContent=stats.overallPct+"% mastered \u00b7 "+stats.weakestName+" needs work";
  } else {
    sub.textContent="5 decks \u00b7 tap to start";
  }
  var list=document.getElementById("deckList");
  list.innerHTML="";
  for(var i=0;i<DECKS.length;i++){
    var d=DECKS[i];
    var prog=getProgress(d);
    var streak=getStreak(d.storeKey);
    var card=document.createElement("div");
    card.className="deck-card";
    card.onclick=(function(idx){return function(){openDeck(idx)}})(i);
    var progHtml="";
    if(prog){
      progHtml='<div class="progress-bar"><div class="progress-fill" style="width:'+prog.pct+'%;background:'+d.color+'"></div></div>'
        +'<div class="progress-label">'+prog.label+'</div>';
    }
    var streakHtml="";
    if(streak>=2) streakHtml='<span class="streak-badge">\ud83d\udd25 '+streak+'</span>';
    card.innerHTML='<div class="accent" style="background:linear-gradient(90deg,'+d.color+','+d.color+'aa)"></div>'
      +'<span class="icon">'+d.icon+'</span>'
      +'<div class="name">'+d.name+streakHtml+'</div>'
      +'<div class="desc">'+d.desc+'</div>'
      +'<span class="badge" style="background:'+d.color+'15;color:'+d.color+'">'+d.badge+'</span>'
      +progHtml;
    list.appendChild(card);
  }
}

function openDeck(idx){
  var d=DECKS[idx];
  document.getElementById("menuScreen").className="menu hidden";
  document.getElementById("drillTitle").textContent=d.name;
  var frame=document.getElementById("drillFrame");
  var bytes=atob(d.b64);
  var arr=new Uint8Array(bytes.length);
  for(var i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
  var html=new TextDecoder().decode(arr);
  frame.srcdoc=html;
  document.getElementById("drillView").className="drill-view active";
}

function closeDeck(){
  document.getElementById("drillView").className="drill-view";
  document.getElementById("drillFrame").srcdoc="";
  document.getElementById("menuScreen").className="menu";
  buildMenu(); // refresh progress indicators
}

buildMenu();
</script>
